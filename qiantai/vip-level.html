    <script>
      // 修复：使用正确的 API 域名
      const API_BASE = window.API_CONFIG?.baseURL || "https://api.4kp3l0iq.top";

      // VIP等级配置
      const VIP_LEVELS = [
        { level: 1, invest: 30000, rate: 0.05 },
        { level: 2, invest: 100000, rate: 0.1 },
        { level: 3, invest: 250000, rate: 0.12 },
        { level: 4, invest: 800000, rate: 0.15 },
        { level: 5, invest: 1500000, rate: 0.16 },
        { level: 6, invest: 3800000, rate: 0.18 },
        { level: 7, invest: 8000000, rate: 0.23 },
        { level: 8, invest: 13000000, rate: 0.25 },
      ];

      let userData = {
        currentLevel: 1,
        currentInvest: 0,
      };

      document.addEventListener("DOMContentLoaded", function () {
        loadUserVipInfo();
      });

      async function loadUserVipInfo() {
        const token = localStorage.getItem("providence_token");
        if (!token) {
          await showToast("", "请先登录");
          setTimeout(() => {
            window.location.href = "login.html";
          }, 1500);
          return;
        }

        try {
          // 尝试获取VIP进度
          const response = await fetch(
            API_BASE + "/user/vip/progress",
            {
              method: "GET",
              headers: {
                token: token,
              },
            }
          );

          if (response.ok) {
            const result = await response.json();
            console.log("[VIP等级] API响应:", result);

            if ((result.code === 1 || result.code === 1 || result.code === 200) && result.data) {
              userData.currentLevel = parseInt(
                result.data.current_level || result.data.level || 1
              );
              userData.currentInvest = parseFloat(
                result.data.current_invest ||
                  result.data.current_amount ||
                  result.data.recharges ||
                  0
              );
            }
          } else {
            // 如果API不存在，从用户信息获取
            const userResponse = await fetch(
              API_BASE + "/api/user/info",
              {
                method: "GET",
                headers: {
                  token: token,
                },
              }
            );

            if (userResponse.ok) {
              const userResult = await userResponse.json();
              if (
                (userResult.code === 1 || userResult.code === 200) &&
                userResult.data
              ) {
                userData.currentLevel = parseInt(userResult.data.level || 1);
                userData.currentInvest = parseFloat(
                  userResult.data.recharges || 0
                );
              }
            }
          }

          // 更新显示
          updateUpgradeHint();
          highlightCurrentLevel();
        } catch (error) {
          console.error("[VIP等级] 加载失败:", error);
          // 静默失败，显示默认数据
          updateUpgradeHint();
        }
      }

      function updateUpgradeHint() {
        const upgradeTextEl = document.getElementById("upgradeText");
        const upgradeTargetEl = document.getElementById("upgradeTarget");

        if (!upgradeTextEl || !upgradeTargetEl) return;

        if (userData.currentLevel >= 8) {
          upgradeTextEl.textContent = "已达到最高等级";
          upgradeTargetEl.textContent = "VIP8";
          upgradeTargetEl.style.color = "#10b981";
        } else {
          const nextLevel = VIP_LEVELS[userData.currentLevel]; // currentLevel索引对应下一等级
          const needInvest = nextLevel.invest - userData.currentInvest;

          if (needInvest > 0) {
            upgradeTextEl.textContent = `距离升级 VIP${nextLevel.level} 还差`;
            upgradeTargetEl.textContent = formatMoney(needInvest) + "元";
          } else {
            upgradeTextEl.textContent = "已满足升级条件";
            upgradeTargetEl.textContent = `VIP${nextLevel.level}`;
            upgradeTargetEl.style.color = "#10b981";
          }
        }
      }

      function highlightCurrentLevel() {
        const container = document.getElementById("vipLevelsContainer");
        if (!container) return;

        const rows = container.querySelectorAll(".vip-level-row");
        rows.forEach((row, index) => {
          if (index + 1 === userData.currentLevel) {
            row.style.background =
              "linear-gradient(135deg, rgba(212,175,55,0.3), rgba(246,210,122,0.3))";
            row.style.border = "2px solid #d4af37";
            row.style.boxShadow = "0 4px 16px rgba(212,175,55,0.4)";
          } else if (index + 1 < userData.currentLevel) {
            row.style.opacity = "0.7";
          }
        });
      }

      function formatMoney(amount) {
        return parseFloat(amount || 0).toLocaleString("zh-CN", {
          minimumFractionDigits: 0,
          maximumFractionDigits: 0,
        });
      }
