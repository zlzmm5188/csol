<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
    <!-- iOS状态栏配色 - 深色主题 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a1020" />
    <title>我的 - Providence</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- 统一API客户端 v2.0 -->
    <script src="api-unified-v2.js"></script>
    <!-- Token检查中间件 - 必须在其他脚本之前运行 -->
    <script src="token-check-middleware.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        touch-action: pan-x pan-y; /* 允许滚动但禁止缩放 */
        -webkit-user-select: none; /* 禁止文本选择 */
        user-select: none;
      }

      html,
      body {
        touch-action: pan-x pan-y !important; /* 禁止双指缩放 */
        -ms-touch-action: pan-x pan-y !important;
      }

      html {
        height: 100%;
        overflow: hidden; /* 防止整个html滚动 */
        overscroll-behavior: none; /* 禁用"橡皮筋"效果 */
      }

      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden; /* body不滚动 */
        background: linear-gradient(180deg, #0e2b44, #091c2e) !important;
        background-attachment: fixed; /* 恢复深蓝色渐变 */
        overscroll-behavior: none; /* 禁用"橡皮筋"效果 */
        opacity: 1 !important;
        visibility: visible !important;
      }

      #app {
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden; /* app容器不滚动 */
        opacity: 1 !important;
        visibility: visible !important;
      }

      /* 固定标题栏 - 统一规范（参考 projects-list.html） */
      .fixed-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        padding: 14px 16px;
        background: linear-gradient(180deg, rgba(10, 16, 32, 0.95), rgba(10, 16, 32, 0.75));
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .fixed-header .logo-full {
        display: flex;
        align-items: center;
      }

      .fixed-header .logo-img {
        height: 26px;
        width: 26px;
        border-radius: 8px;
        object-fit: contain;
        background: url('img/logo.png') center/contain no-repeat;
      }

      .fixed-header .brand {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .fixed-header .brand-name {
        font-size: 18px;
        font-weight: 600;
        color: #e8c991;
        letter-spacing: 0.3px;
        line-height: 1.2;
      }

      .fixed-header .brand-subtitle-animated {
        font-size: 12px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.7);
        line-height: 1.2;
      }

      /* 可滚动内容容器 */
      .scrollable-content {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-y: auto; /* 允许原生滚动行为，iOS会自动处理弹性 */
        padding-top: 60px; /* 为固定标题栏留空间 */
        padding-bottom: 100px; /* 为固定底部导航栏留更多空间，防止按钮被遮住 */
        scroll-behavior: smooth; /* 平滑滚动 */
      }

      /* 底部导航栏样式由styles.css统一管理 */

      /* 强制九宫格文字可见 - 移动端适配 */
      .grid-item .text,
      #profile-grid .grid-item .text,
      .action-grid .grid-item .text {
        color: #1a2332 !important;
        font-size: clamp(11px, 2.8vw, 13px) !important;
        font-weight: 600 !important;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        text-shadow: 0 1px 2px rgba(255, 255, 255, 0.9) !important;
        z-index: 999 !important;
        height: auto !important;
        line-height: 1.3 !important;
        margin-top: clamp(6px, 1.5vw, 8px) !important;
      }

      /* 移除可能的顶部空白 */
      body::before,
      body::after,
      #app::before,
      #app::after {
        display: none !important;
      }

      /* VIP升级进度 - 高端精致版 */
      .vip-progress-container {
        position: relative;
        z-index: 2;
        margin-top: -12px; /* 更紧凑 */
        padding: 0 clamp(16px, 4vw, 20px) clamp(12px, 3vw, 16px);
        display: block;
      }

      .vip-progress-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: clamp(10px, 2.5vw, 11px);
        color: rgba(232, 201, 145, 0.85);
        margin-bottom: clamp(8px, 2vw, 10px);
        font-weight: 600;
        letter-spacing: 0.3px;
      }

      .vip-progress-label span:first-child {
        color: rgba(255, 255, 255, 0.7);
        font-size: clamp(10px, 2.5vw, 11px);
      }

      .vip-progress-label span:last-child {
        color: #f6d27a;
        font-weight: 700;
        font-size: clamp(11px, 2.8vw, 12px);
        text-shadow: 0 1px 4px rgba(246, 210, 122, 0.6),
                     0 0 8px rgba(246, 210, 122, 0.4);
        letter-spacing: 0.5px;
      }

      .vip-progress-bar {
        height: clamp(14px, 3.5vw, 16px);
        background: linear-gradient(180deg,
          rgba(10, 20, 35, 0.85),
          rgba(15, 25, 40, 0.95)
        );
        border-radius: clamp(7px, 1.75vw, 8px);
        overflow: hidden;
        position: relative;
        box-shadow:
          inset 0 2px 6px rgba(0, 0, 0, 0.7),
          inset 0 -1px 2px rgba(255, 255, 255, 0.05),
          0 2px 8px rgba(0, 0, 0, 0.3);
        margin: 0;
        padding: 2px;
        z-index: 20;
        width: 100%;
        border: 1px solid rgba(200, 186, 148, 0.15);
      }

      .vip-progress-bar::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(246, 210, 122, 0.1),
          transparent
        );
        animation: progress-scan 3s ease-in-out infinite;
        z-index: 25;
      }

      .vip-progress-fill {
        height: 100%;
        background: linear-gradient(
          135deg,
          #c8ba94 0%,
          #f6d27a 25%,
          #e8c991 50%,
          #d4a574 75%,
          #c8ba94 100%
        );
        background-size: 300% 100%;
        animation: progress-shine 3s linear infinite;
        border-radius: clamp(5px, 1.25vw, 6px);
        transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        min-width: 8%;
        width: 0%;
        box-shadow:
          0 0 20px rgba(246, 210, 122, 0.6),
          0 0 40px rgba(246, 210, 122, 0.3),
          0 2px 8px rgba(200, 186, 148, 0.4),
          inset 0 1px 3px rgba(255, 255, 255, 0.4),
          inset 0 -1px 2px rgba(0, 0, 0, 0.2);
        position: relative;
        z-index: 21;
        overflow: hidden;
      }

      .vip-progress-fill::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 50%;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.3),
          transparent
        );
        border-radius: clamp(5px, 1.25vw, 6px) clamp(5px, 1.25vw, 6px) 0 0;
      }

      .vip-progress-fill::after {
        content: '';
        position: absolute;
        top: 0;
        right: -20px;
        width: 40px;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.6),
          transparent
        );
        animation: progress-gleam 2s ease-in-out infinite;
        transform: skewX(-20deg);
      }

      @keyframes progress-shine {
        0% {
          background-position: 300% 0;
        }
        100% {
          background-position: -300% 0;
        }
      }

      @keyframes progress-scan {
        0%, 100% {
          left: -100%;
        }
        50% {
          left: 100%;
        }
      }

      @keyframes progress-gleam {
        0%, 100% {
          right: -40px;
          opacity: 0;
        }
        50% {
          right: calc(100% + 40px);
          opacity: 1;
        }
      }

      /* 退出 */
      .logout {
        margin: clamp(12px, 3vw, 16px) clamp(16px, 4vw, 20px)
          clamp(100px, 25vw, 120px);
        padding: clamp(8px, 2vw, 10px) clamp(12px, 3vw, 14px);
        background: linear-gradient(180deg, #dbeafe, #bfdbfe, #93c5fd);
        border-radius: 12px;
        border: 1px solid rgba(59, 130, 246, 0.3);
        text-align: center;
        color: #2563eb;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
        min-height: clamp(44px, 11vw, 52px);
        display: flex;
        align-items: center;
        justify-content: center;
        /* 文字层级 */
        z-index: 2;
        /* 立体阴影效果 */
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2),
          0 2px 4px rgba(37, 99, 235, 0.15),
          inset 0 1px 2px rgba(255, 255, 255, 0.6),
          inset 0 -2px 4px rgba(37, 99, 235, 0.2);
      }

      /* 顶部高光 */
      .logout::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 50%;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.3) 0%,
          rgba(255, 255, 255, 0.05) 100%
        );
        border-radius: 12px 12px 50% 50%;
        pointer-events: none;
        z-index: 1;
      }

      /* 底部阴影 */
      .logout::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 30%;
        background: linear-gradient(
          180deg,
          transparent 0%,
          rgba(0, 0, 0, 0.15) 100%
        );
        border-radius: 0 0 12px 12px;
        pointer-events: none;
        z-index: 1;
      }

      .logout:active {
        transform: translateY(2px) scale(0.98);
        box-shadow: 0 2px 6px rgba(37, 99, 235, 0.12),
          0 1px 2px rgba(37, 99, 235, 0.08), inset 0 2px 4px rgba(0, 0, 0, 0.2);
      }

      .logout:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(37, 99, 235, 0.2),
          0 3px 6px rgba(37, 99, 235, 0.15),
          inset 0 1px 2px rgba(255, 255, 255, 0.3),
          inset 0 -2px 4px rgba(37, 99, 235, 0.2);
      }

      /* Profile 页面九宫格图标颜色和背景 - 强制覆盖缓存 - 移动端适配 */
      #profile-grid .grid-item .icon {
        background: #f8f9fa !important;
        box-shadow: none !important;
        border: 2px solid rgba(201, 169, 97, 0.8) !important;
        position: relative !important;
        width: clamp(44px, 11vw, 52px) !important;
        height: clamp(44px, 11vw, 52px) !important;
        min-width: clamp(44px, 11vw, 52px) !important;
        min-height: clamp(44px, 11vw, 52px) !important;
        padding: 0 !important;
        overflow: visible !important;
        border-radius: 50% !important;
      }

      /* 金色圆圈内圈 - 在图标内部 */
      #profile-grid .grid-item .icon::before {
        content: "" !important;
        position: absolute !important;
        top: 50% !important;
        left: 50% !important;
        transform: translate(-50%, -50%) !important;
        width: calc(100% - 14px) !important;
        height: calc(100% - 14px) !important;
        border: 2px solid rgba(201, 169, 97, 0.6) !important;
        border-radius: 50% !important;
        z-index: 1 !important;
        pointer-events: none !important;
      }

      #profile-grid .grid-item .icon svg {
        position: relative !important;
        z-index: 2 !important;
        filter: none !important;
      }

      /* 移除 SVG 元素上的滤镜属性 */
      #profile-grid .grid-item .icon svg path[filter],
      #profile-grid .grid-item .icon svg circle[filter],
      #profile-grid .grid-item .icon svg rect[filter],
      #profile-grid .grid-item .icon svg ellipse[filter],
      #profile-grid .grid-item .icon svg g[filter] {
        filter: none !important;
      }

      /* 移除 SVG 内部的滤镜元素，但保留渐变定义 */
      #profile-grid .grid-item .icon svg defs filter {
        display: none !important;
        display: none !important;
      }

      #profile-grid .grid-item .icon svg defs feGaussianBlur,
      #profile-grid .grid-item .icon svg defs feDropShadow,
      #profile-grid .grid-item .icon svg defs feOffset,
      #profile-grid .grid-item .icon svg defs feComponentTransfer,
      #profile-grid .grid-item .icon svg defs feMerge {
        display: none !important;
      }

      /* 图标颜色 - 温暖棕褐色/金色渐变 - 保留图标清晰度和层次 */
      /* 只修改渐变定义，不强制覆盖所有元素 */
      #profile-grid .grid-item .icon svg linearGradient stop[offset="0%"] {
        stop-color: #d2b48c !important;
      }

      #profile-grid .grid-item .icon svg linearGradient stop[offset="30%"],
      #profile-grid .grid-item .icon svg linearGradient stop[offset="40%"] {
        stop-color: #e6d3a3 !important;
      }

      #profile-grid .grid-item .icon svg linearGradient stop[offset="50%"],
      #profile-grid .grid-item .icon svg linearGradient stop[offset="70%"] {
        stop-color: #d4a574 !important;
      }

      #profile-grid .grid-item .icon svg linearGradient stop[offset="100%"] {
        stop-color: #c9a884 !important;
      }

      #profile-grid .grid-item .icon svg radialGradient stop[offset="0%"] {
        stop-color: #d2b48c !important;
      }

      #profile-grid .grid-item .icon svg radialGradient stop[offset="30%"],
      #profile-grid .grid-item .icon svg radialGradient stop[offset="40%"] {
        stop-color: #d4a574 !important;
      }

      #profile-grid .grid-item .icon svg radialGradient stop[offset="100%"] {
        stop-color: #c9a884 !important;
      }

      /* 统一描边颜色，添加金色反光效果 */
      #profile-grid .grid-item .icon svg path[stroke],
      #profile-grid .grid-item .icon svg circle[stroke],
      #profile-grid .grid-item .icon svg rect[stroke],
      #profile-grid .grid-item .icon svg ellipse[stroke] {
        stroke: #d4af37 !important;
        stroke-width: 1.5px !important;
      }

      /* 在SVG外层添加金色描边圆环 */
      #profile-grid .grid-item .icon svg {
        position: relative !important;
        z-index: 2 !important;
        filter: none !important;
      }

      /* 底部其他功能列表样式 - 去掉背景 */
      .other-functions {
        padding: clamp(8px, 2vw, 10px) clamp(16px, 4vw, 16px)
          clamp(12px, 3vw, 16px);
        margin-top: clamp(-12px, -3vw, -8px);
        position: relative;
        background: transparent;
        border-radius: clamp(12px, 3vw, 16px);
        overflow: visible;
        z-index: 1;
        margin-left: clamp(12px, 3vw, 16px);
        margin-right: clamp(12px, 3vw, 16px);
      }

      /* 移除背景容器 */
      .other-functions::after {
        display: none;
      }

      /* 移除原有背景遮罩 */
      .other-functions::before {
        display: none;
      }

      /* 资产区域布局 - 参考图样式 */
      .assets {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: clamp(8px, 2vw, 10px);
        position: relative;
        border-radius: clamp(10px, 2.5vw, 12px);
        overflow: visible;
        margin-top: clamp(0px, 0vw, 2px);
        margin-bottom: 0;
        margin-left: 16px;
        margin-right: 16px;
        z-index: 10;
        padding-top: clamp(6px, 1.5vw, 8px);
        padding-bottom: clamp(8px, 2vw, 10px);
        padding-left: 0;
        padding-right: 0;
        min-height: auto;
      }

      .assets .brand {
        position: relative;
        z-index: 1;
        width: 100%;
        display: none; /* 隐藏空div */
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(6px, 1.5vw, 8px);
        margin-bottom: clamp(8px, 2vw, 12px);
        margin-top: clamp(-8px, -2vw, -6px);
      }

      .assets .brand-info {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(4px, 1vw, 6px);
        min-width: 0;
        flex: 0 0 auto;
        justify-content: center;
      }

      .assets .brand-name-wrapper {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        min-width: 0;
      }

      .assets .brand-name-logo {
        width: clamp(32px, 8vw, 40px);
        height: clamp(32px, 8vw, 40px);
        object-fit: contain;
        flex-shrink: 0;
        background: none;
        border: none;
        padding: 0;
        box-shadow: none;
      }

      .assets .brand-name {
        font-size: clamp(22px, 5.5vw, 26px);
        font-weight: 700;
        color: #fff !important;
        line-height: 1.4;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        min-width: 0;
      }

      .assets .brand-subtitle {
        font-size: clamp(16px, 4vw, 18px);
        font-weight: 600;
        color: rgba(255, 255, 255, 0.9);
        line-height: 1.4;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        min-width: 0;
      }

      .assets .asset-wrapper {
        display: flex;
        align-items: stretch;
        gap: clamp(10px, 2.5vw, 12px);
        justify-content: space-between;
        flex-wrap: nowrap;
        width: 100%;
        margin-top: 0;
      }

      .assets::before {
        /* 移除背景地球图片 */
        display: none;
      }

      .assets::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.15);
        z-index: -1;
        pointer-events: none;
        border-radius: clamp(12px, 3vw, 14px);
      }

      /* 资产卡片 - 淡淡毛玻璃效果 */
      .asset {
        flex: 1 1 0;
        position: relative;
        z-index: 1;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-radius: clamp(8px, 2vw, 10px);
        padding: clamp(16px, 4vw, 20px) clamp(18px, 4.5vw, 22px);
        min-height: clamp(80px, 20vw, 100px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: clamp(2px, 0.5vw, 3px);
      }

      /* 确保三个资产卡片等宽 */
      .assets .asset-wrapper .asset {
        flex: 1 1 0;
        min-width: 0;
      }

      /* 账号和ID卡片 - 与其他卡片统一大小 */
      .account-id-card {
        flex: 1 1 0;
        min-width: 0;
      }

      /* 合并的资产卡片 - 固定为长方形（宽度大于高度） */
      .merged-asset {
        min-height: clamp(80px, 20vw, 100px) !important;
        height: clamp(80px, 20vw, 100px) !important;
      }

      /* 合并的资产和收益卡片 - 与账号ID卡片等高 */
      .merged-asset-income {
        min-height: clamp(120px, 30vw, 150px) !important;
        height: auto !important;
      }

      /* 所有资产卡片统一大小 - 固定为长方形（宽度大于高度） */
      .assets .asset-wrapper .asset {
        min-height: clamp(80px, 20vw, 100px) !important;
        height: clamp(80px, 20vw, 100px) !important;
      }

      /* 翻转卡片样式 */
      .flip-card {
        background-color: transparent;
        perspective: 1000px;
        cursor: pointer;
        padding: 0 !important;
      }

      .flip-card .asset {
        padding: clamp(16px, 4vw, 20px) clamp(18px, 4.5vw, 22px) !important;
      }

      .flip-card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        text-align: center;
        transition: transform 0.6s;
        transform-style: preserve-3d;
      }

      /* 禁用页面加载时的翻转动画，防止黑屏 */
      .flip-card-inner.no-transition {
        transition: none !important;
      }

      .flip-card.flipped .flip-card-inner {
        transform: rotateX(180deg);
      }

      .flip-card-front,
      .flip-card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: clamp(16px, 4vw, 20px) clamp(18px, 4.5vw, 22px);
      }

      .flip-card-back {
        transform: rotateX(180deg);
        background: rgba(255, 255, 255, 0.05);
        border-radius: clamp(8px, 2vw, 10px);
      }

      /* 图标样式 */
      .card-icon {
        width: 32px;
        height: 32px;
        margin: 0 auto clamp(8px, 2vw, 10px);
        opacity: 0.8;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card-icon img {
        width: 100%;

    <script>
      // VIP等级配置
      const VIP_CONFIG = [
        { level: 0, invest: 0 },
        { level: 1, invest: 30000 },
        { level: 2, invest: 100000 },
        { level: 3, invest: 250000 },
        { level: 4, invest: 800000 },
        { level: 5, invest: 1500000 },
        { level: 6, invest: 3800000 },
        { level: 7, invest: 8000000 },
        { level: 8, invest: 13000000 }
      ];

      // 加载用户VIP数据并更新进度条
      async function loadUserVipProgress() {
        try {
          const token = localStorage.getItem('providence_token');
          if (!token) return;

          const API_BASE = window.API_CONFIG?.baseURL || 'https://api.4kp3l0iq.top';
          const response = await fetch(`${API_BASE}/api/user/info`, {
            method: 'GET',
            headers: { 'token': token }
          });

          if (!response.ok) return;

          const data = await response.json();
          if (data.code === 1 && data.data) {
            const vipLevel = parseInt(data.data.vip_level || data.data.level || 0);
            const totalInvest = parseFloat(data.data.total_invest || data.data.recharges || 0);

            // 更新VIP等级显示
            const vipLevelEl = document.getElementById('currentVipLevel');
            if (vipLevelEl) {
              vipLevelEl.textContent = `VIP${vipLevel}`;
            }

            // 更新VIP卡片背景
            const vipCard = document.getElementById('vipCard');
            if (vipCard) {
              vipCard.dataset.vipLevel = vipLevel;
            }

            // 计算升级进度
            let progress = 0;
            if (vipLevel >= 8) {
              progress = 100; // 已满级
            } else {
              const currentThreshold = VIP_CONFIG[vipLevel]?.invest || 0;
              const nextThreshold = VIP_CONFIG[vipLevel + 1]?.invest || currentThreshold;
              const investInRange = totalInvest - currentThreshold;
              const rangeSize = nextThreshold - currentThreshold;
              progress = rangeSize > 0 ? Math.min((investInRange / rangeSize) * 100, 100) : 0;
            }

            // 更新进度条
            const progressFill = document.getElementById('vipProgressFill');
            if (progressFill) {
              progressFill.style.width = `${Math.max(5, progress)}%`;
            }

            console.log('[VIP] 等级:', vipLevel, '累计投资:', totalInvest, '进度:', progress.toFixed(1) + '%');
          }
        } catch (e) {
          console.warn('[VIP] 加载失败:', e);
        }
      }

      // 页面加载时获取VIP数据
      document.addEventListener('DOMContentLoaded', loadUserVipProgress);
    </script>
    <script>
      // 立即添加样式，防止加载时闪烁
      document.documentElement.style.cssText = 'background: linear-gradient(180deg, #0e2b44, #091c2e); opacity: 1;';
      document.body.style.cssText = 'background: linear-gradient(180deg, #0e2b44, #091c2e); opacity: 1; visibility: visible;';

      // 防止在当前页面重复加载（防止黑屏）
      document.addEventListener("DOMContentLoaded", function () {
        const currentTab = document.querySelector('.tabbar .tab.active');
        if (currentTab) {
          currentTab.addEventListener('click', function(e) {
            e.preventDefault(); // 阻止页面重新加载
            // 可选：滚动到顶部
            const scrollableContent = document.querySelector('.scrollable-content');
            if (scrollableContent) {
              scrollableContent.scrollTo({ top: 0, behavior: 'smooth' });
            }
            return false;
          });
        }
      });

      // 所有卡片翻转功能（点击翻转，状态持久化）
      document.addEventListener("DOMContentLoaded", function () {
        const flipCards = document.querySelectorAll(".flip-card");

        flipCards.forEach((card) => {
          const flipId = card.dataset.flipId;
          if (!flipId) return;

          // USDT卡片特殊处理：三态循环（余额 -> 收益 -> 空白 -> 余额）
          if (flipId === "usdt") {
            const usdtCard = card;
            let currentState = "balance"; // balance, income, empty

            // 从localStorage恢复状态
            const savedState = localStorage.getItem("flip_card_usdt_state");
            if (savedState) {
              currentState = savedState;
            } else {
              // 默认显示余额
              currentState = "balance";
            }

            // 更新显示状态
            function updateUsdtDisplay() {
              const balanceEl = usdtCard.querySelector(
                '[data-usdt-state="balance"]'
              );
              const incomeEl = usdtCard.querySelector(
                '[data-usdt-state="income"]'
              );
              const emptyEl = usdtCard.querySelector(
                '[data-usdt-state="empty"]'
              );

              // 重置所有状态
              if (balanceEl) {
                balanceEl.style.opacity = "0";
                balanceEl.style.pointerEvents = "none";
              }
              if (incomeEl) {
                incomeEl.style.opacity = "0";
                incomeEl.style.pointerEvents = "none";
              }
              if (emptyEl) {
                emptyEl.style.opacity = "0";
                emptyEl.style.pointerEvents = "none";
              }

              // 显示当前状态
              if (currentState === "balance" && balanceEl) {
                balanceEl.style.opacity = "1";
                balanceEl.style.pointerEvents = "auto";
              } else if (currentState === "income" && incomeEl) {
                incomeEl.style.opacity = "1";
                incomeEl.style.pointerEvents = "auto";
              } else if (currentState === "empty" && emptyEl) {
                emptyEl.style.opacity = "1";
                emptyEl.style.pointerEvents = "auto";
              }
            }

            // 初始化显示
            updateUsdtDisplay();

            // 点击切换状态：余额 -> 收益 -> 空白 -> 余额
            usdtCard.addEventListener("click", function () {
              if (currentState === "balance") {
                currentState = "income";
              } else if (currentState === "income") {
                currentState = "empty";
              } else if (currentState === "empty") {
                currentState = "balance";
              }
              updateUsdtDisplay();
              localStorage.setItem("flip_card_usdt_state", currentState);
            });

            // 监听USDT收益数据更新
            function updateUsdtIncomeDisplay() {
              const incomeEl = usdtCard.querySelector("#totalUsdtIncome");
              if (incomeEl) {
                const totalIncomeUsdtEl =
                  document.getElementById("totalIncomeUsdt");
                if (totalIncomeUsdtEl) {
                  const value = parseFloat(
                    totalIncomeUsdtEl.textContent || "0"
                  );
                  incomeEl.textContent = value.toFixed(2);
                  // 如果金额为0，使用白色；否则使用绿色
                  if (value === 0) {
                    incomeEl.style.color = "#ffffff";
                  } else {
                    incomeEl.style.color = "#4ade80";
                  }
                } else {
                  // 如果没有totalIncomeUsdt元素，直接显示0.00
                  incomeEl.textContent = "0.00";
                  incomeEl.style.color = "#ffffff";
                }
              }
            }

            const observer = new MutationObserver(function () {
              updateUsdtIncomeDisplay();
            });
            const totalIncomeUsdtEl =
              document.getElementById("totalIncomeUsdt");
            if (totalIncomeUsdtEl) {
              observer.observe(totalIncomeUsdtEl, {
                childList: true,
                characterData: true,
                subtree: true,
              });
              // 初始化USDT收益显示
              updateUsdtIncomeDisplay();
            } else {
              // 如果没有totalIncomeUsdt元素，也初始化显示
              updateUsdtIncomeDisplay();
            }
            return;
          }

          // 其他卡片：普通翻转
          const inner = card.querySelector(".flip-card-inner");
          if (!inner) return;

          // 从localStorage恢复翻转状态
          const savedState = localStorage.getItem(`flip_card_${flipId}`);
          const isFlipped = savedState === "flipped";

          if (isFlipped) {
            // 禁用动画，直接设置状态，防止黑屏
            inner.classList.add('no-transition');
            inner.style.transform = "rotateX(180deg)";
            // 强制重排后恢复动画
            setTimeout(() => {
              inner.classList.remove('no-transition');
            }, 50);
          }

          // 点击翻转
          card.addEventListener("click", function () {
            const currentTransform = inner.style.transform;
            const isCurrentlyFlipped = currentTransform === "rotateX(180deg)";

            if (isCurrentlyFlipped) {
              inner.style.transform = "rotateX(0deg)";
              localStorage.setItem(`flip_card_${flipId}`, "normal");
            } else {
              inner.style.transform = "rotateX(180deg)";
              localStorage.setItem(`flip_card_${flipId}`, "flipped");
            }
          });
        });
      });

      async function handleLogout() {
        const ok = await customConfirm("确定退出登录吗？", "退出登录");
        if (ok) {
          localStorage.removeItem("providence_token");
          window.location.href = "login.html";
        }
      }
    </script>
