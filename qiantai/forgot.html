<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
    <!-- iOS状态栏配色 - 深色主题 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a1020" />
<meta http-equiv="Cache-Control" content="no-cache" />
<title>找回密码 - Providence</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  position: fixed;
  background: linear-gradient(135deg, #0e2b44 0%, #1a3a5f 50%, #0e2b44 100%);
        background-attachment: fixed;
  background-size: 200% 200%;
  animation: gradientShift 15s ease infinite;
  padding-top: 60px;}

@keyframes gradientShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  color: #fff;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow-x: hidden;
}

.container {
  flex: 1;
  padding: 16px;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overflow-x: hidden;
  max-width: 100vw;
  -webkit-overflow-scrolling: touch;
}

.header {
  text-align: center;
  padding: clamp(20px, 4vh, 35px) 0 clamp(12px, 2.5vh, 20px);
  flex-shrink: 0;
}

.logo {
  width: clamp(60px, 14vw, 80px);
  height: clamp(60px, 14vw, 80px);
  border-radius: 18px;
  margin: 0 auto 12px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 0 2px rgba(201, 169, 97, 0.2);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.logo:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 0 3px rgba(201, 169, 97, 0.3);
}

.title {
  font-size: clamp(24px, 6vw, 32px);
  font-weight: 800;
  color: #fff;
  margin-bottom: 6px;
  letter-spacing: 3px;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
  background: linear-gradient(135deg, #fff 0%, rgba(201, 169, 97, 0.9) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.subtitle {
  font-size: clamp(13px, 3.2vw, 15px);
  color: rgba(255, 255, 255, 0.85);
  font-weight: 500;
  letter-spacing: 1px;
}

.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  max-width: 600px;
  width: 100%;
  margin: 0 auto;
  padding: 10px 0;
  flex-shrink: 0;
}

.option-card {
  background: rgba(255,255,255,0.1);
  border: 2px solid rgba(199,181,138,0.4);
  border-radius: 16px;
  padding: clamp(16px, 3.5vw, 24px);
  text-align: center;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  aspect-ratio: 1/1;
  width: 100%;
  min-height: 0;
}

.option-card:active {
  transform: scale(0.97);
  background: rgba(255,255,255,0.15);
  border-color: rgba(199,181,138,0.5);
}

.option-icon {
  font-size: clamp(32px, 8vw, 48px);
  margin-bottom: clamp(8px, 2vw, 12px);
  line-height: 1;
}

.option-title {
  font-size: clamp(14px, 3.5vw, 17px);
  font-weight: 700;
  color: #fff;
  margin-bottom: clamp(4px, 1vw, 8px);
  white-space: nowrap;
}

.option-desc {
  font-size: clamp(10px, 2.5vw, 12px);
  color: rgba(255,255,255,0.7);
  line-height: 1.4;
}

.option-badge {
  margin-top: clamp(6px, 1.5vw, 10px);
  padding: 3px 8px;
  background: rgba(199,181,138,0.25);
  border-radius: 10px;
  font-size: clamp(9px, 2.2vw, 11px);
  color: rgba(255,215,0,0.9);
  font-weight: 600;
  white-space: nowrap;
}

.back-link {
  text-align: center;
  margin-top: 16px;
  padding-bottom: 16px;
  flex-shrink: 0;
}

.back-link a {
  color: rgba(199,181,138,0.9);
  text-decoration: none;
  font-size: clamp(13px, 3.3vw, 15px);
}

</style>
</head>
<body>

<div class="container">
  <div class="header">
    <img src="img/logo.png" alt="Providence" class="logo" onerror="this.style.display='none'" />
    <h1 class="title">PROVIDENCE</h1>
    <p class="subtitle">找回密码</p>
  </div>

  <div class="options">
    <!-- AI智能找回 -->
    <div class="option-card" onclick="location.href='messages.html?intent=password_reset&from=forgot'">
      <div class="option-icon">🤖</div>
      <div class="option-title">AI智能找回</div>
      <div class="option-desc">
        通过AI客服引导<br />
        身份证+人脸验证
      </div>
      <div class="option-badge">推荐</div>
    </div>

    <!-- 人脸识别找回 -->
    <div class="option-card" onclick="location.href='reset-password.html'">
      <div class="option-icon">👤</div>
      <div class="option-title">人脸识别</div>
      <div class="option-desc">
        人脸识别验证<br />
        快速重置密码
      </div>
      <div class="option-badge">快速</div>
    </div>
  </div>

  <div class="back-link">
    <a href="login.html">← 返回登录</a>
  </div>
</div>
    <script src="page-lifecycle.js?v=1763897782"></script>
    <script defer src="smart-swipe-control.js?v=1763897782"></script>



</body>
</html>
