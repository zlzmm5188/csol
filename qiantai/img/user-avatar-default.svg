<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 背景圆形 -->
  <circle cx="100" cy="100" r="100" fill="#6FA3D9"/>

  <!-- 外圈（可选，增加层次感） -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#fff" stroke-width="2" opacity="0.3"/>

  <!-- 用户图标 -->
  <g transform="translate(100, 100)">
    <!-- 头部 -->
    <circle cx="0" cy="-20" r="28" fill="#fff"/>

    <!-- 身体 -->
    <path d="M -45 50 Q -45 10, -28 10 Q -28 0, 0 0 Q 28 0, 28 10 Q 45 10, 45 50 Z"
          fill="#fff"/>
  </g>

  <!-- 外圈装饰（可选） -->
  <circle cx="100" cy="100" r="98" fill="none" stroke="#fff" stroke-width="1" opacity="0.2"/>
</svg>
