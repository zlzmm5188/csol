<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#c9a732;stop-opacity:0.08" />
    </linearGradient>
  </defs>

  <!-- 外圈 - 天平 -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#logoGrad)" stroke-width="2" opacity="0.6"/>

  <!-- 天平主体 -->
  <g transform="translate(100, 90)">
    <!-- 中心支柱 -->
    <rect x="-2" y="0" width="4" height="60" fill="url(#logoGrad)" rx="2"/>
    <circle cx="0" cy="60" r="6" fill="url(#logoGrad)"/>

    <!-- 横梁 -->
    <line x1="-45" y1="10" x2="45" y2="10" stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- 左秤盘 -->
    <path d="M -45,10 L -50,20 L -40,20 Z" fill="url(#logoGrad)"/>
    <line x1="-50" y1="20" x2="-40" y2="20" stroke="url(#logoGrad)" stroke-width="2"/>

    <!-- 右秤盘 -->
    <path d="M 45,10 L 40,20 L 50,20 Z" fill="url(#logoGrad)"/>
    <line x1="40" y1="20" x2="50" y2="20" stroke="url(#logoGrad)" stroke-width="2"/>

    <!-- 装饰性线条 -->
    <line x1="-30" y1="25" x2="-30" y2="35" stroke="url(#logoGrad)" stroke-width="1" opacity="0.6"/>
    <line x1="30" y1="25" x2="30" y2="35" stroke="url(#logoGrad)" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- 底部文字 HK -->
  <text x="100" y="160" font-family="serif" font-size="24" font-weight="bold" fill="url(#logoGrad)" text-anchor="middle" letter-spacing="2">HK</text>
  <text x="100" y="175" font-family="serif" font-size="10" fill="url(#logoGrad)" text-anchor="middle" letter-spacing="1" opacity="0.8">CM&PF LAW</text>

  <!-- 装饰性金色点 -->
  <circle cx="30" cy="30" r="3" fill="url(#logoGrad)" opacity="0.4"/>
  <circle cx="170" cy="30" r="3" fill="url(#logoGrad)" opacity="0.4"/>
  <circle cx="30" cy="170" r="3" fill="url(#logoGrad)" opacity="0.4"/>
  <circle cx="170" cy="170" r="3" fill="url(#logoGrad)" opacity="0.4"/>
</svg>
