<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <!-- 黑金渐变1 - 主背景 -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#2d2d2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>

    <!-- 黑金渐变2 - 金色光泽 -->
    <radialGradient id="goldShine1" cx="20%" cy="30%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#c9a732;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="goldShine2" cx="80%" cy="70%">
      <stop offset="0%" style="stop-color:#f4e5b8;stop-opacity:0.12" />
      <stop offset="50%" style="stop-color:#d4af37;stop-opacity:0.06" />
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0" />
    </radialGradient>

    <!-- 线条图案 -->
    <pattern id="lines" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="40" y2="40" stroke="rgba(212,175,55,0.04)" stroke-width="1"/>
    </pattern>

    <!-- 光晕效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 主背景 -->
  <rect width="1200" height="400" fill="url(#mainGrad)"/>

  <!-- 金色光泽层 -->
  <rect width="1200" height="400" fill="url(#goldShine1)"/>
  <rect width="1200" height="400" fill="url(#goldShine2)"/>

  <!-- 线条纹理 -->
  <rect width="1200" height="400" fill="url(#lines)" opacity="0.3"/>

  <!-- 装饰性几何图形 -->
  <path d="M 0,0 L 200,0 L 0,100 Z" fill="rgba(212,175,55,0.05)"/>
  <path d="M 1200,400 L 1000,400 L 1200,300 Z" fill="rgba(212,175,55,0.05)"/>

  <!-- 金色装饰线 -->
  <line x1="0" y1="1" x2="1200" y2="1" stroke="rgba(212,175,55,0.2)" stroke-width="2"/>
  <line x1="0" y1="399" x2="1200" y2="399" stroke="rgba(212,175,55,0.2)" stroke-width="2"/>

  <!-- 中心光晕装饰 -->
  <circle cx="600" cy="200" r="150" fill="none" stroke="rgba(212,175,55,0.06)" stroke-width="1" filter="url(#glow)"/>
  <circle cx="600" cy="200" r="120" fill="none" stroke="rgba(212,175,55,0.04)" stroke-width="1"/>

  <!-- 边角装饰 -->
  <path d="M 50,50 L 100,50 L 50,100 Z" fill="none" stroke="rgba(212,175,55,0.3)" stroke-width="2"/>
  <path d="M 1150,350 L 1100,350 L 1150,300 Z" fill="none" stroke="rgba(212,175,55,0.3)" stroke-width="2"/>
</svg>
