<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 背景圆形渐变 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D9B45D;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E6C56E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F4D679;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e2b44;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a5f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆 -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" opacity="0.2"/>
  <circle cx="100" cy="100" r="85" fill="#fff"/>
  
  <!-- AI机器人头部 -->
  <circle cx="100" cy="95" r="65" fill="url(#faceGrad)"/>
  
  <!-- 眼睛 -->
  <circle cx="80" cy="85" r="12" fill="#D9B45D"/>
  <circle cx="120" cy="85" r="12" fill="#D9B45D"/>
  <circle cx="82" cy="83" r="5" fill="#fff"/>
  <circle cx="122" cy="83" r="5" fill="#fff"/>
  
  <!-- 嘴巴 - 微笑 -->
  <path d="M 75 110 Q 100 125 125 110" stroke="#D9B45D" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- 天线 -->
  <rect x="95" y="25" width="10" height="15" fill="url(#bgGrad)" rx="2"/>
  <circle cx="100" cy="22" r="6" fill="#E6C56E"/>
  <circle cx="100" cy="22" r="3" fill="#fff" opacity="0.6"/>
  
  <!-- 装饰线条 -->
  <path d="M 50 95 L 60 95" stroke="#D9B45D" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M 140 95 L 150 95" stroke="#D9B45D" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  
  <!-- 底部装饰 -->
  <path d="M 70 140 Q 100 145 130 140" stroke="url(#bgGrad)" stroke-width="2" fill="none"/>
</svg>

