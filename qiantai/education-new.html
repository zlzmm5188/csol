    <script>
    // 简化版课程渲染（直接在页面加载）
    (function() {
      // 等待 education.js 加载完成
      setTimeout(function() {
        // 获取课程数据
        const COURSES_DATA = window.COURSES_DATA || {
          courses: [],
          updateTime: new Date().toLocaleString()
        };

        let currentCategory = 'fund';
        let allCourses = COURSES_DATA.courses || [];

        console.log('📚 课程总数:', allCourses.length);

        // 分类切换
        document.querySelectorAll('.category-tab').forEach(tab => {
          tab.addEventListener('click', function() {
            document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            currentCategory = this.getAttribute('data-category');
            renderCourses();
          });
        });

        // 渲染课程
        function renderCourses() {
          const grid = document.getElementById('coursesGrid');
          const filtered = allCourses.filter(c => c.category === currentCategory);

          if (filtered.length === 0) {
            grid.innerHTML = '<div class="loading-text">暂无课程数据</div>';
            return;
          }

          grid.innerHTML = filtered.map(course => `
            <div class="course-card">
              <div class="course-icon">${course.icon}</div>
              <div class="course-header">
                <span class="course-level">${course.level}</span>
                ${course.featured ? '<span class="course-featured">⭐ 特色</span>' : ''}
              </div>
              <h3 class="course-title">${course.title}</h3>
              <p class="course-desc">${course.desc}</p>
              <div class="course-meta">
                <span>⏱️ ${course.duration}</span>
                <span>📚 ${course.lessons}课时</span>
              </div>
              <button class="course-btn">开始学习</button>
            </div>
          `).join('');
        }

        // 初始渲染
        renderCourses();

      , 100);
    )();
    </script>
