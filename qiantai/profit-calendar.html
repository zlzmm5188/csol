<title>收益日历 - Providence</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{height:100%;overflow:hidden
  padding-top: 60px;}

body{
    background-image:url('assets/a180d44deaf8c.jpg');
    background-size:cover;
    background-position:center top 0px;
    background-repeat:no-repeat;
    position:relative;
}

body::before{
    content:'';
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.25);
    z-index:0;
    pointer-events:none;
}

body>*{
    position:relative;
    z-index:1;
}

/* 顶部 - 毛玻璃效果 */
.top{
    background:rgba(14,43,68,0.8);
    backdrop-filter:blur(20px);
    padding:max(12px,env(safe-area-inset-top)) 16px 20px;
    position:relative;
    z-index:10;
    overflow:hidden;
    border-bottom:1px solid rgba(255,255,255,0.1);
}

.top::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(120% 180% at -10% -20%, rgba(255,255,255,0.1), transparent 65%),
                radial-gradient(140% 160% at 110% -10%, rgba(255,255,255,0.05), transparent 58%);
    pointer-events:none;
}

.top-bar{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    margin-bottom:16px;
}

.back-btn {
        width: 32px !important;
        height: 32px !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        border-radius: 8px !important;
        background: rgba(232, 201, 145, 0.15) !important;
        border: 1px solid rgba(232, 201, 145, 0.3) !important;
        color: #e8c991 !important;
        font-size: 20px !important;
        cursor: pointer !important;
        transition: all 0.2s ease !important;
    }
    .back-btn:active {
        transform: scale(0.95) !important;
    }
.back-btn:active {
    transform: scale(0.95) !important;
}

.page-title, .brand h1 { margin: 0; display: inline-block; white-space: nowrap; flex: 0 1 auto; }

.refresh-btn{
    color:#fff;
    font-size:13px;
    padding:6px 12px;
    background:rgba(255,255,255,0.15);
    border-radius:16px;
    cursor:pointer;
}

/* 收益概览卡片 */
.overview{
    position:relative;
    z-index:1;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}



.olabel{
    font-size:12px;
    color:rgba(255,255,255,0.6);
    margin-bottom:6px;
}

.ovalue{
    font-size:20px;
    font-weight:700;
    color:#fff;
}

.ovalue.green{color:#10b981}

/* 内容区 - 紧凑布局，固定一屏 */
.main{
    padding:16px;
    height:calc(100vh - 180px - 60px);
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    position:relative;
    z-index:1;
}

/* 月份导航 */
.month-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
    margin-bottom:16px;

}

.mnav{
    color:#D9B45D;
    font-size:26px;

    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(217,180,93,0.15);
    backdrop-filter:blur(10px);
    border-radius:50%;
    cursor:pointer;
    border:1px solid rgba(217,180,93,0.3);
}

.mnav:active{transform:scale(0.9)}

.mname{
    font-size:18px;
    font-weight:700;
    color:#fff;
    min-

    text-shadow:0 2px 8px rgba(0,0,0,0.8);
}

/* 日历 - 透明背景 */
.cal{
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(20px);
    border-radius:16px;
    padding:20px 16px;
    box-shadow:0 4px 24px rgba(0,0,0,0.15);
    position:relative;

    border:1px solid rgba(255,255,255,0.2);
}

.cal-head{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    margin-bottom:10px;
}

.cal-th{

    font-size:13px;
    color:rgba(255,255,255,0.9);
    padding:8px 0;
    font-weight:700;
    text-shadow:0 2px 4px rgba(0,0,0,0.5);
}

.cal-th:first-child,.cal-th:last-child{
    color:#D9B45D;
    text-shadow:0 2px 6px rgba(217,180,93,0.8);
}

.cal-body{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
}

.cal-cell{
    aspect-ratio:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    cursor:pointer;
    transition:all 0.2s;
    position:relative;
    background:rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.2);
}

.cal-cell:active{
    transform:scale(0.92);
}

.cal-cell.other{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
}

.cal-cell.today{
    background:rgba(251,191,36,0.3);
    backdrop-filter:blur(10px);
    border:2px solid rgba(251,191,36,0.6);
    box-shadow:0 2px 12px rgba(251,191,36,0.4);
}

.cal-cell.profit{
    background:rgba(16,185,129,0.2);
    backdrop-filter:blur(10px);
    border:1px solid rgba(16,185,129,0.4);
}

.cal-cell.profit.today{
    background:rgba(251,191,36,0.4);
    backdrop-filter:blur(10px);
    border:2px solid rgba(251,191,36,0.8);
    box-shadow:0 2px 12px rgba(251,191,36,0.5);
}

.cnum{
    font-size:18px;
    color:#fff;
    font-weight:800;
    text-shadow:0 2px 4px rgba(0,0,0,0.5);
}

.cal-cell.other .cnum{
    color:rgba(255,255,255,0.4);
    text-shadow:0 1px 2px rgba(0,0,0,0.3);
}

.cval{
    font-size:11px;
    color:#10b981;
    font-weight:700;
    margin-top:3px;
    text-shadow:0 1px 2px rgba(0,0,0,0.3);
}

/* iOS原生风格弹窗 */
.ios-toast{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(0.95);
    background:#fff;
    border-radius:13px;
    max-

    z-index:9999;
    box-shadow:0 20px 60px rgba(0,0,0,0.3);
    opacity:0;
    transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events:none;
    overflow:hidden;
}

.ios-toast.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
    pointer-events:auto;
}

.ios-toast-title{
    font-size:17px;
    font-weight:400;
    color:#000;

    padding:20px 20px 8px;
    letter-spacing:-0.01em;
}

.ios-toast-message{
    font-size:13px;
    color:#000;

    line-height:1.4;
    padding:0 20px 20px;
    letter-spacing:-0.01em;
    border-bottom:0.5px solid #d1d1d6;
}

.ios-toast-buttons{
    display:flex;
    border-top:0.5px solid #d1d1d6;
}

.ios-toast-button{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:13px 0;
    background:none;
    border:none;
    font-size:17px;
    font-weight:400;
    color:#007aff;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    position:relative;
}

.ios-toast-button::after{
    content:'';
    position:absolute;
    right:0;
    top:0;
    bottom:0;

    background:#d1d1d6;
}

.ios-toast-button:first-child{
    color:#000;
}

.ios-toast-button:last-child::after{
    display:none;
}

.ios-toast-button.only-button::after{
    display:none;
}

.ios-toast-button:active{
    background:rgba(0,0,0,0.05);
}
      .brand { display: flex; flex-direction: row; align-items: center; gap: 8px; white-space: nowrap; justify-content: flex-start; }
      .brand .back-btn {
        width: 32px !important;
        height: 32px !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        border-radius: 8px !important;
        background: rgba(232, 201, 145, 0.15) !important;
        border: 1px solid rgba(232, 201, 145, 0.3) !important;
        color: #e8c991 !important;
        font-size: 20px !important;
        cursor: pointer !important;
        transition: all 0.2s ease !important;
    }
    .back-btn:active {
        transform: scale(0.95) !important;
    }
.back-btn:active {
    transform: scale(0.95) !important;
}
      .brand .page-title, .page-title, .brand h1 { margin: 0; display: inline-block; white-space: nowrap; flex: 0 1 auto; }
    </style>

<body>

<div class="top">
    <div class="top-bar">
        <div class="back-btn" onclick="history.back()">‹</div>
        <div class="page-title">收益日历</div>
        <div class="refresh-btn" onclick="loadData()">刷新</div>
    </div>

    <div class="overview">
        <div class="ocard">
            <div class="olabel">今日收益</div>
            <div class="ovalue green" id="todayProfit">+0.00</div>
        </div>
        <div class="ocard">
            <div class="olabel">本月收益</div>
            <div class="ovalue green" id="monthProfit">+0.00</div>
        </div>
        <div class="ocard">
            <div class="olabel">收益率</div>
            <div class="ovalue" id="rate">+0.00%</div>
        </div>
    </div>
</div>

<div class="main">

    <div class="month-nav">
        <div class="mnav" onclick="prevMonth()">‹</div>
        <div class="mname" id="monthName">2025年 10月</div>
        <div class="mnav" onclick="nextMonth()">›</div>
    </div>

    <div class="cal">
        <div class="cal-head">
            <div class="cal-th">日</div>
            <div class="cal-th">一</div>
            <div class="cal-th">二</div>
            <div class="cal-th">三</div>
            <div class="cal-th">四</div>
            <div class="cal-th">五</div>
            <div class="cal-th">六</div>
        </div>
        <div class="cal-body" id="calBody"></div>
    </div>

</div>

<!-- 底部导航已移除 -->

<!-- iOS原生风格弹窗 -->
<div class="ios-toast" id="iosToast">
    <div class="ios-toast-title" id="iosToastTitle"></div>
    <div class="ios-toast-message" id="iosToastMessage"></div>
    <div class="ios-toast-buttons">
        <div class="ios-toast-button" id="iosToastCancel">取消</div>
        <div class="ios-toast-button" id="iosToastConfirm">确定</div>
    </div>
</div>

<script>
const API_BASE='https://api.4kp3l0iq.top';
let year=2025,month=10;
let profitData={};
let userData={token:localStorage.getItem('providence_token')||''};

// iOS原生风格弹窗
function showToast(title,message){
    const toast=document.getElementById('iosToast');
    const titleEl=document.getElementById('iosToastTitle');
    const msgEl=document.getElementById('iosToastMessage');
    const cancelBtn=document.getElementById('iosToastCancel');
    const confirmBtn=document.getElementById('iosToastConfirm');

    // 重置样式
    confirmBtn.classList.remove('only-button');
    cancelBtn.style.display='flex';

    titleEl.textContent=title;
    msgEl.textContent=message;

    // 只显示一个确定按钮，隐藏取消按钮
    cancelBtn.style.display='none';
    confirmBtn.textContent='确定';
    confirmBtn.classList.add('only-button');
    toast.classList.add('show');

    confirmBtn.onclick=()=>{
        toast.classList.remove('show');
        confirmBtn.classList.remove('only-button');
        cancelBtn.style.display='flex';
    };
}

// 加载收益数据
async function loadProfitData(){
    try{
        const response=await fetch(API_BASE+'/user/profit/calendar',{
            method:'POST',
            headers:{
                'Content-Type':'application/json',
                'token':userData.token
            },
            body:JSON.stringify({year,month})
        });
        const data=await response.json();
        if(data.code===200&&data.data){
            updateOverview(data.data);
            if(data.data.daily)profitData=data.data.daily;
        }
        render();
    }catch(error){
        console.error('加载数据失败:',error);
        render();
    }
}

// 更新顶部统计
function updateOverview(data){
    // 后端返回的字段名
    const todayProfit=data.today_profit||data.today||0;
    const monthProfit=data.month_profit||data.year_profit||0;
    const rate=data.profit_rate||data.rate||0;

    document.getElementById('todayProfit').textContent='+'+parseFloat(todayProfit).toFixed(2);
    document.getElementById('monthProfit').textContent='+'+parseFloat(monthProfit).toFixed(2);
    document.getElementById('rate').textContent='+'+parseFloat(rate).toFixed(2)+'%';

    console.log('[收益日历] 更新总览:',{todayProfit,monthProfit,rate});
}

// 获取单日详情（从已加载的profitData中获取）
function getDayDetail(date){
    if(profitData && profitData[date]){
        return profitData[date];
    }
    return null;
}

function render(){
const first=new Date(year,month-1,1).getDay();
const days=new Date(year,month,0).getDate();
const body=document.getElementById('calBody');
body.innerHTML='';
document.getElementById('monthName').textContent=`${year}年 ${month}月`;

for(let i=0;i<first;i++){
const c=document.createElement('div');
c.className='cal-cell other';
body.appendChild(c);
}

const today=new Date();
for(let d=1;d<=days;d++){
const c=document.createElement('div');
const isToday=year===today.getFullYear()&&month===today.getMonth()+1&&d===today.getDate();
        const dateStr=`${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const dayData=profitData[dateStr]||{profit:0};
        const profit=parseFloat(dayData.profit)||0;

        c.className=`cal-cell ${isToday?'today':''} ${profit>0?'profit':''}`;
        c.innerHTML=`<div class="cnum">${d}</div>${profit>0?`<div class="cval">+${profit.toFixed(0)}</div>`:''}`;
        c.onclick=()=>{
            const detail=getDayDetail(dateStr);
            const detailText=detail?`当日收益：${(detail.profit||0).toFixed(2)}元\n收益率：${(detail.rate||0).toFixed(2)}%`:'暂无详情';
            showToast(`${year}年${month}月${d}日`,detailText);
        };
body.appendChild(c);
}
}

function prevMonth(){
month--;
if(month<1){month=12;year--}
    loadProfitData();
}

function nextMonth(){
month++;
if(month>12){month=1;year++}
    loadProfitData();
}

function loadData(){
    loadProfitData();
}

document.querySelectorAll('.ptab').forEach(t=>{
t.onclick=()=>{
document.querySelectorAll('.ptab').forEach(x=>x.classList.remove('active'));
t.classList.add('active');
};
});

// 初始化
loadProfitData();
</script>

    <script src="smart-swipe-control.js?v=1763897782"></script>


</body>
</html>
