  <link rel="icon" href="favicon.ico">
  <style>
    :root {
      --navy-dark: #0a1929;
      --navy-mid: #1e3a5f;
      --navy-light: #2a4a6f;
      --gold: #b8925a;
      --gold-dark: #8b7044;
      --gold-light: #d4b896;
      --text-light: #e8edf3;
      --text-dark: #1a2332;
      --border-subtle: rgba(184, 146, 90, 0.2);
      --border-normal: rgba(184, 146, 90, 0.35);
      --bg-overlay: rgba(10, 25, 41, 0.75);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%;
      overflow-x: hidden
    }

    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-light);
      background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy-mid) 50%, var(--navy-dark) 100%);
      background-size: 200% 200%;
      animation: gradientShift 20s ease infinite;
      padding-bottom: 90px;
      min-height: 100vh;
    }

    @keyframes gradientShift {

      0%,
      100% {
        background-position: 0% 50%
      }

      50% {
        background-position: 100% 50%
      }
    }

    /* ========== 顶部导航栏 ========== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      padding: 14px 16px;
      background: linear-gradient(180deg, rgba(10, 23, 35, 0.95), rgba(10, 23, 35, 0.75));
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--lineD);
    }

    .topbar-content {
      max-width: 100%;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-btn {
        width: 32px !important;
        height: 32px !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        border-radius: 8px !important;
        background: rgba(232, 201, 145, 0.15) !important;
        border: 1px solid rgba(232, 201, 145, 0.3) !important;
        color: #e8c991 !important;
        font-size: 20px !important;
        cursor: pointer !important;
        transition: all 0.2s ease !important;
    }
    .back-btn:active {
        transform: scale(0.95) !important;
    }

    .topbar-title {
      flex: 0 0 auto;
    }

    .topbar-title h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 1.5px;
      margin: 0;
    }


    /* ========== 头版头条 Hero Banner ========== */
    .hero-banner {
      position: relative;
      height: clamp(300px, 42vh, 450px);
      margin: 0 0 32px;
      overflow: hidden;
      cursor: pointer;
    }

    .hero-bg {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=1200');
      background-size: cover;
      background-position: center;
      filter: brightness(0.7) saturate(0.8);
      transition: transform 0.6s ease;
    }

    .hero-banner:hover .hero-bg {
      transform: scale(1.05);
    }

    .hero-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(to bottom,
          transparent 0%,
          rgba(10, 25, 41, 0.6) 40%,
          rgba(10, 25, 41, 0.95) 100%);
    }

    .hero-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 40px 24px;
      max-
      
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(184, 146, 90, 0.9);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .hero-title {
      font-size: clamp(26px, 5.5vw, 38px);
      font-weight: 800;
      color: #fff;
      line-height: 1.3;
      margin-bottom: 16px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
    }

    .hero-meta {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 500;
    }

    .hero-meta span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ========== 快讯滚动条 ========== */
    .news-ticker {
      background: rgba(184, 146, 90, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
      padding: 14px 0;
      margin-bottom: 40px;
      overflow: hidden;
      position: relative;
    }

    .ticker-label {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--gold-dark);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      z-index: 2;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .ticker-content {
      display: flex;
      gap: 50px;
      animation: scroll 35s linear infinite;
      padding-left: 140px;
    }

    @keyframes scroll {
      0% {
        transform: translateX(0)
      }

      100% {
        transform: translateX(-50%)
      }
    }

    .ticker-item {
      white-space: nowrap;
      font-size: 14px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ticker-item::before {
      content: '•';
      color: var(--gold);
      font-size: 20px;
      font-weight: bold;
    }

    /* ========== 编辑精选（3栏）========== */
    .featured-section {
      max-width: 100%;
      padding: 0 20px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
    }

    .section-title {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .section-line {
      
      height: 1px;
      background: linear-gradient(90deg, var(--border-normal), transparent);
    }

    .featured-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
    }

    .featured-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .featured-card:hover {
      transform: translateY(-6px);
      border-color: var(--border-normal);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
      background: rgba(255, 255, 255, 0.06);
    }

    .featured-img {
      height: 180px;
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
    }

    .featured-img::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(to bottom, transparent 0%, rgba(10, 25, 41, 0.4) 100%);
    }

    .featured-category {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 5px 12px;
      background: rgba(10, 25, 41, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.5px;
      z-index: 2;
      text-transform: uppercase;
    }

    .featured-body {
      padding: 20px;
    }

    .featured-date {
      font-size: 12px;
      color: var(--gold-light);
      font-weight: 500;
      margin-bottom: 10px;
    }

    .featured-title {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      line-height: 1.5;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .featured-summary {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.65);
      line-height: 1.7;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ========== 时间线布局 ========== */
    .timeline-section {
      max-width: 100%;
      padding: 0 20px;
    }

    .timeline-container {
      position: relative;
      padding-left: 100px;
    }

    .timeline-line {
      position: absolute;
      left: 46px;
      top: 0;
      bottom: 0;
      
      background: linear-gradient(to bottom,
          var(--gold) 0%,
          var(--gold-dark) 50%,
          transparent 100%);
      opacity: 0.4;
    }

    .timeline-group {
      margin-bottom: 56px;
      position: relative;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .timeline-group.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .timeline-date {
      position: absolute;
      left: -100px;
      top: 4px;
      
      
    }

    .timeline-year {
      font-size: 18px;
      font-weight: 800;
      color: var(--gold);
      
      letter-spacing: 0.5px;
    }

    .timeline-month {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 600;
    }

    .timeline-dot {
      position: absolute;
      left: -55px;
      top: 10px;
      
      height: 14px;
      border-radius: 50%;
      background: var(--gold);
      border: 3px solid var(--navy-dark);
      box-shadow: 0 0 0 3px rgba(184, 146, 90, 0.2);
      z-index: 2;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        box-shadow: 0 0 0 3px rgba(184, 146, 90, 0.2);
      }

      50% {
        box-shadow: 0 0 0 6px rgba(184, 146, 90, 0.4);
      }
    }

    .timeline-items {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .timeline-card {
      background: rgba(14, 43, 68, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(201, 169, 97, 0.15);
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      position: relative;

      /* 去掉Spotlight滚动效果 */
      transform: none;
      opacity: 1;
      will-change: transform, opacity;
    }

    /* 标签默认暗淡 */
    .timeline-badge {
      opacity: 0.4;
      transition: opacity 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .timeline-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      
      background: var(--gold);
      opacity: 0;
      /* 快速响应的透明度过渡 */
      transition: opacity 0.28s cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    .timeline-card:hover {
      border-color: var(--border-normal);
    }

    .timeline-card.active::before {
      opacity: 1;
    }

    .timeline-card-header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 0;
    }

    .timeline-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      
      opacity: 0.4;
      /* 快速响应的透明度过渡 */
      transition: opacity 0.28s cubic-bezier(0.22, 0.61, 0.36, 1);
      align-self: flex-start;
    }

    .timeline-card.active .timeline-badge {
      opacity: 1;
    }

    .timeline-badge.investment {
      background: rgba(251, 191, 36, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, 0.3);
    }

    .timeline-badge.awards {
      background: rgba(59, 130, 246, 0.15);
      color: #3b82f6;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .timeline-badge.strategy {
      background: rgba(139, 92, 246, 0.15);
      color: #a78bfa;
      border: 1px solid rgba(139, 92, 246, 0.3);
    }

    .timeline-badge.expansion {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .timeline-card-content {
      
    }

    .timeline-card-title {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .timeline-card-desc {
      display: none;
    }

    /* ========== 数据统计 ========== */
    .stats-section {
      max-width: 100%;
      padding: 0 20px;
    }

    .stats-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 36px;
      
    }

    .stats-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 28px;
      letter-spacing: 0.5px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 32px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stat-number {
      font-size: 40px;
      font-weight: 800;
      color: var(--gold);
      text-shadow: 0 2px 8px rgba(184, 146, 90, 0.3);
    }

    .stat-label {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    /* ========== 底部导航 ========== */
    .tabbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(180deg, rgba(11, 59, 94, 0.98), rgba(18, 76, 106, 0.98)),
        url('img/photo_2025-10-20_05-38-52.jpg') center bottom/contain repeat-x;
      backdrop-filter: blur(16px);
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      border-top: 1px solid rgba(212, 175, 55, 0.25);
      height: 68px;
      z-index: 100;
      padding: 4px 0 4px;
      box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.2);
    }

    .tab {
      
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      color: #8b9aa8;
      text-decoration: none;
      transition: color .3s ease;
      position: relative;
      padding: 0;
      gap: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .tab:active .ico {
      transform: scale(0.90)
    }

    .tab.active {
      color: #f5d771
    }

    .tab .ico {
      
      height: 110px;
      background-image: url('assets/a75728afde83d.jpg');
      background-size: 400% 400%;
      background-repeat: no-repeat;
      background-color: transparent;
      margin-bottom: 0;
      transition: transform .2s ease, opacity .2s ease;
      position: relative;
      will-change: transform, opacity;
    }

    .tab:not(.active) .ico {
      opacity: 0.65
    }

    .tab.active .ico {
      opacity: 1;
      transform: scale(1.18)
    }

    .tab .txt {
      font-size: 11px;

      letter-spacing: 0.5px;
      margin-top: -30px;
      line-height: 1;
      margin-bottom: 4px;
    }

    .ico-home {
      background-image: url('img/zy.png?v=1763897782') !important;

    }

    .ico-finance {

    }

    .ico-market {
      background-image: url('img/xm.png?v=1763897782') !important;
      background-size: 75% !important;

    }

    .ico-message {
      background-image: url('img/34.png?v=1763897782') !important;

      background-position: center !important
    }

    .ico-me {
      background-image: url('img/wd.png?v=1763897782') !important;
      background-size: 75% !important;
      background-position: center !important
    }

    /* ========== 模态框（从下往上滑入）========== */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 9999;
    }

    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    .modal-sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 90vh;
      background: #fff;
      border-radius: 20px 20px 0 0;
      overflow: hidden;
      animation: slideUpSheet 0.4s cubic-bezier(0.32, 0.72, 0, 1);
      box-shadow: 0 -4px 60px rgba(0, 0, 0, 0.5);
    }

    @keyframes slideUpSheet {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    .modal-handle {
      
      height: 4px;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 2px;
      margin: 12px auto;
    }

    .modal-header {
      position: sticky;
      top: 0;
      background: #fff;
      padding: 0 24px 16px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      z-index: 10;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      
      height: 32px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.05);
      color: #666;
      font-size: 20px;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .modal-close:hover {
      background: rgba(0, 0, 0, 0.1);
    }

    .modal-body {
      padding: 0 24px 40px;
      overflow-y: auto;
      max-height: calc(90vh - 120px);
      color: var(--text-dark);
    }

    .modal-body::-webkit-scrollbar {
      
      border-radius: 3px
    }

    .modal-badge {
      display: inline-block;
      padding: 6px 12px;
      background: var(--gold);
      color: #fff;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .modal-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .modal-meta {
      display: flex;
      gap: 20px;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      flex-wrap: wrap;
    }

    .modal-meta-item {

    .modal-section {

    }

    .modal-section-title {

      font-weight: 700;

    }

    .modal-text {
      font-size: 16px;
      line-height: 1.8;
      color: #444;
      margin-bottom: 20px;
      
    }

    .modal-highlight {
      background: rgba(184, 146, 90, 0.1);
      border-left: 3px solid var(--gold);
      padding: 16px;
      margin: 20px 0;
      border-radius: 0 6px 6px 0;
    }

    .modal-highlight-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--gold-dark);
      margin-bottom: 8px;
    }

    .modal-highlight-text {
      font-size: 14px;
      line-height: 1.7;
      color: #555;
    }

    .modal-list {
      list-style: none;
      padding: 0;
      margin: 20px 0;
    }

    .modal-list li {
      padding: 12px 0 12px 24px;
      position: relative;
      font-size: 15px;
      line-height: 1.7;
      color: #555;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    .modal-list li:last-child {
      border-bottom: none;
    }

    .modal-list li::before {
      content: '→';
      position: absolute;
      left: 0;
      color: var(--gold);
      font-weight: bold;
    }

    // 图片配置
    const images = {
      featured1: 'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=800',
      featured2: 'https://images.unsplash.com/photo-1611162616475-46b635cb6868?w=800',
      featured3: 'https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=800'
    };

    // 渲染快讯滚动条
    function renderTicker() {
      const tickerContent = document.getElementById('tickerContent');
      const tickerItems = newsData.slice(0, 6).map(news =>
        `<div class="ticker-item">${news.title}</div>`
      ).join('');
      tickerContent.innerHTML = tickerItems + tickerItems;
    }

    // 渲染编辑精选
    function renderFeatured() {
      const featuredGrid = document.getElementById('featuredGrid');
      const featured = newsData.filter(n => n.featured).slice(0, 3);

      featuredGrid.innerHTML = featured.map((news, idx) => `
    <div class="featured-card" onclick="openModal('${news.id}')">
      <div class="featured-img" style="background-image:url('${news.image || images['featured' + (idx + 1)]}')">
        <div class="featured-category">${news.category}</div>
            </div>
      <div class="featured-body">
        <div class="featured-date">${news.date}</div>
        <div class="featured-title">${news.title}</div>
        <div class="featured-summary">${news.summary}</div>
      </div>
    </div>
  `).join('');
    }

    // 渲染时间线
    function renderTimeline() {
      const container = document.getElementById('timelineContainer');

      const grouped = {};
      newsData.forEach(news => {
        const key = `${news.year}-${news.month}`;
        if (!grouped[key]) {
          grouped[key] = {
            year: news.year,
            month: news.month,
            items: []
          };
        }
        grouped[key].items.push(news);
      });

      const sortedGroups = Object.values(grouped).sort((a, b) => {
        const yearDiff = parseInt(b.year) - parseInt(a.year);
        if (yearDiff !== 0) return yearDiff;
        return parseInt(b.month) - parseInt(a.month);
      });

      container.innerHTML = '<div class="timeline-line"></div>' + sortedGroups.map(group => `
    <div class="timeline-group">
      <div class="timeline-date">
        <span class="timeline-year">${group.year}</span>
        <span class="timeline-month">${group.month}</span>
                </div>
      <div class="timeline-dot"></div>
      <div class="timeline-items">
        ${group.items.map(news => `
          <div class="timeline-card" onclick="openModal('${news.id}')">
            <div class="timeline-card-header">
              <span class="timeline-badge ${news.type}">${news.badge}</span>
              <div class="timeline-card-content">
                <div class="timeline-card-title">${news.title}</div>
                <div class="timeline-card-desc">${news.summary}</div>
                </div>
                </div>
            </div>
        `).join('')}
      </div>
    </div>
    `).join('');
    }

    // 打开模态框
    function openModal(newsId) {
      const news = newsData.find(n => n.id == newsId);
      if (!news) return;

      const modalBody = document.getElementById('modalBody');

      let detailsHTML = '';
      if (news.details) {
        detailsHTML = Object.entries(news.details).map(([key, value]) => `
      <div class="modal-highlight">
        <div class="modal-highlight-title">${getDetailTitle(key)}</div>
        <div class="modal-highlight-text">${value}</div>
      </div>
    `).join('');
      }

      modalBody.innerHTML = `
    <div class="modal-badge">${news.badge}</div>
    <h1 class="modal-title">${news.title}</h1>
    <div class="modal-meta">
      <div class="modal-meta-item">
        <span>📅</span>
        <span>${news.date}</span>
      </div>
      <div class="modal-meta-item">
        <span>📂</span>
        <span>${news.category}</span>
      </div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">新闻概要</div>
      <div class="modal-text">${news.content.replace(/\n\n/g, '</div><div class="modal-text">')}</div>
    </div>

    ${detailsHTML ? `
      <div class="modal-section">
        <div class="modal-section-title">详细信息</div>
        ${detailsHTML}
      </div>
    ` : ''}
  `;

      const modal = document.getElementById('newsModal');
      modal.style.display = 'block';
      document.body.style.overflow = 'hidden';
    }

    // 关闭模态框
    function closeModal() {
      const modal = document.getElementById('newsModal');
      modal.style.display = 'none';
      document.body.style.overflow = '';
    }

    // 获取详情标题
    function getDetailTitle(key) {
      const titles = {
        impact: '重要影响',
        recognition: '权威认可',
        dealSize: '交易规模',
        strategy: '战略意义',
        partners: '合作伙伴',
        growth: '增长数据',
        composition: '资产构成',
        outlook: '未来展望',
        features: '核心功能',
        technology: '技术优势',
        access: '使用权限',
        scope: '合作范围',
        benefits: '客户收益',
        size: '基金规模',
        focus: '投资重点',
        investors: '投资者',
        returns: '投资回报',
        support: '增值服务',
        initiatives: 'ESG举措',
        commitment: '长期承诺',
        traction: '业务进展',
        vision: '发展愿景',
        fund: '基金设立',
        platform: '平台建设',
        investment: '投资详情',
        outcome: '投资成果'
      };
      return titles[key] || key;
    }

    // 页面加载时初始化
    document.addEventListener('DOMContentLoaded', function () {
      renderTicker();
      renderFeatured();
      renderTimeline();

      // 滚动监听 - 时间线渐现动画
      const observerOptions = {
        threshold: 0.15,
        rootMargin: '0px 0px -50px 0px'
      };

      const observer = new IntersectionObserver(function (entries) {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
          }
        });
      }, observerOptions);

      // 监听所有时间线组
      setTimeout(() => {
        document.querySelectorAll('.timeline-group').forEach(group => {
          observer.observe(group);
        });
      }, 100);

      // 已去掉Spotlight滚动效果
    });
  </script>
