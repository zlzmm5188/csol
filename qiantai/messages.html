<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>AI智能客服 - Providence</title>
<link rel="icon" href="favicon.ico" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
    height: 100%;
    overflow: hidden;
    position: fixed;
    width: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, "PingFang SC", sans-serif;
    background: #0e2b44 !important;
}

body {
    background: linear-gradient(135deg, #0e2b44 0%, #1a3a5f 50%, #0e2b44 100%) !important;
}

.chat-container {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: -webkit-fill-available;
    background: linear-gradient(135deg, #0e2b44 0%, #1a3a5f 50%, #0e2b44 100%) !important;
}

/* 顶部导航 */
.chat-header {
    background: rgba(14, 43, 68, 0.95);
    backdrop-filter: blur(20px);
    padding: max(12px, env(safe-area-inset-top)) 16px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
    border-bottom: 1px solid rgba(201, 169, 97, 0.2);
    z-index: 100;
}

.back-btn {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    background: rgba(232, 201, 145, 0.15);
    border: 1px solid rgba(232, 201, 145, 0.3);
    color: #e8c991;
    font-size: 22px;
    cursor: pointer;
}

.ai-info {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 12px;
}

.ai-avatar {
    height: 48px;
    width: 48px;
    border-radius: 50%;
    overflow: hidden;
}

.ai-avatar img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.ai-name {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 1px;
    line-height: 1.2;
    background: linear-gradient(135deg, #fff 0%, rgba(201, 169, 97, 0.9) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.ai-status {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.5px;
    line-height: 1.2;
    color: rgba(255, 255, 255, 0.9);
    display: flex;
    align-items: center;
    gap: 6px;
}

.status-dot {
    height: 8px;
    width: 8px;
    border-radius: 50%;
    background: #4caf50;
    animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

.header-btns {
    display: flex;
    gap: 8px;
}

/* 菜单按钮 */
.menu-wrapper {
    position: relative;
}

.menu-btn {
    width: 40px;
    height: 40px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 10px;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.menu-btn:active {
    background: rgba(255, 255, 255, 0.2);
}

.menu-dropdown {
    position: absolute;
    top: 48px;
    right: 0;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    overflow: hidden;
    min-width: 160px;
    z-index: 200;
    display: none;
    animation: slideDown 0.2s ease;
}

@keyframes slideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}

.menu-dropdown.show {
    display: block;
}

.menu-item {
    padding: 14px 18px;
    font-size: 14px;
    color: #333;
    cursor: pointer;
    border-bottom: 1px solid #f0f0f0;
    transition: background 0.2s;
}

.menu-item:last-child {
    border-bottom: none;
}

.menu-item:hover {
    background: #f8f8f8;
}

.menu-item:active {
    background: #f0f0f0;
}

/* 弹窗样式 */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    animation: fadeIn 0.2s ease;
}

.modal-box {
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    width: 90%;
    max-width: 360px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}

.modal-icon {
    font-size: 48px;
    margin-bottom: 16px;
}

.modal-title {
    font-size: 18px;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 8px;
}

.modal-desc {
    font-size: 14px;
    color: #666;
    margin-bottom: 20px;
    line-height: 1.6;
}

.modal-input {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid #e0e0e0;
    border-radius: 10px;
    font-size: 14px;
    margin-bottom: 16px;
    outline: none;
}

.modal-input:focus {
    border-color: #4caf50;
}

.modal-btns {
    display: flex;
    gap: 12px;
}

.modal-btn {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
}

.modal-btn.cancel {
    background: #f0f0f0;
    color: #666;
}

.modal-btn.confirm {
    background: linear-gradient(135deg, #4caf50, #66bb6a);
    color: #fff;
}

.modal-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

/* 消息区域 */
.messages-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    -webkit-overflow-scrolling: touch;
    background: transparent !important;
}

/* 欢迎界面 */
.welcome-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    text-align: center;
    padding: 20px;
    background: transparent !important;
}

.welcome-logo {
    width: 80px;
    height: 80px;
    margin-bottom: 20px;
}

.welcome-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.welcome-title {
    font-size: 26px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 12px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
}

.welcome-subtitle {
    font-size: 16px;
    color: rgba(255,255,255,0.85);
    margin-bottom: 30px;
    font-weight: 500;
}

.quick-tags {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    max-width: 320px;
}

.quick-tag {
    padding: 12px 20px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 22px;
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    text-shadow: 0 1px 2px rgba(0,0,0,0.2);
}

.quick-tag:active {
    background: rgba(201, 169, 97, 0.3);
    border-color: #C9A961;
}

/* 消息气泡 - 左右布局 */
.msg {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 20px;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.msg.user {
    flex-direction: row-reverse;
}

.msg-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    background: rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
}

.msg-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.msg-avatar-text {
    font-size: 18px;
}

.msg-content {
    max-width: 80%;
    display: flex;
    flex-direction: column;
}

.msg.user .msg-content {
    align-items: flex-end;
}

.msg-bubble {
    padding: 14px 18px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.7;
    word-wrap: break-word;
}

.msg.ai .msg-bubble {
    background: #fff;
    color: #1a1a1a;
    border-top-left-radius: 4px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}

.msg.user .msg-bubble {
    background: linear-gradient(135deg, #1e4976, #2a5a8a);
    color: #fff;
    border-top-right-radius: 4px;
    box-shadow: 0 4px 20px rgba(30, 73, 118, 0.3);
}

.msg-time {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    margin-top: 6px;
    padding: 0 4px;
}

/* 余额样式 */
.balance-usdt {
    color: #22c55e;
    font-weight: 700;
}

.balance-cny {
    color: #C9A961;
    font-weight: 700;
}

/* 输入区域 */
.input-area {
    background: rgba(14, 43, 68, 0.98);
    border-top: 1px solid rgba(201, 169, 97, 0.3);
    padding: 14px 16px;
    padding-bottom: max(14px, env(safe-area-inset-bottom));
    display: flex;
    gap: 12px;
    align-items: center;
    backdrop-filter: blur(10px);
}

.input-box {
    flex: 1;
    padding: 14px 18px;
    border: 1.5px solid rgba(201, 169, 97, 0.4);
    border-radius: 24px;
    font-size: 16px;
    outline: none;
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
}

.input-box:focus {
    border-color: #D9B45D;
    background: rgba(255, 255, 255, 0.15);
}
.input-box::placeholder {
    color: rgba(255, 255, 255, 0.5);
}


.send-btn {
    height: 50px;
    width: 50px;
    border-radius: 50%;
    background: linear-gradient(135deg, #C9A961, #D9B45D);
    border: none;
    color: #0e2b44;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.send-btn:disabled {
    opacity: 0.5;
}

/* 加载动画 */
.typing {
    display: flex;
    gap: 5px;
    padding: 8px 0;
}

.typing-dot {
    height: 8px;
    width: 8px;
    border-radius: 50%;
    background: #D9B45D;
    animation: typingAnim 1.4s ease-in-out infinite;
}

.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingAnim {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-8px); opacity: 1; }
}

/* 隐藏类 */
.hidden { display: none !important; }

/* iOS Safari 兼容修复 */
@supports (-webkit-touch-callout: none) {
    html, body, .chat-container, .messages-area, .welcome-screen {
        background-color: #0e2b44 !important;
    }
    body {
        background: #0e2b44 !important;
        background-image: linear-gradient(135deg, #0e2b44 0%, #1a3a5f 50%, #0e2b44 100%) !important;
    }
}

/* 强制所有元素继承深色背景 */
.chat-container * {
    background-color: inherit;
}

/* 防止iOS默认样式覆盖 */
input, textarea, button {
    -webkit-appearance: none;
    appearance: none;
}
</style>
</head>
<body style="background:#0e2b44!important;background-image:linear-gradient(135deg,#0e2b44 0%,#1a3a5f 50%,#0e2b44 100%)!important;">

<div class="chat-container" style="background:linear-gradient(135deg,#0e2b44 0%,#1a3a5f 50%,#0e2b44 100%)!important;">
    <div class="chat-header">
        <div class="back-btn" onclick="history.back()">‹</div>
        <div class="ai-info">
            <div class="ai-avatar">
                <img src="img/logo-new.png" alt="AI" />
            </div>
            <div>
                <div class="ai-name">Providence</div>
                <div class="ai-status">
                    <span class="status-dot"></span>
                    <span id="statusText">智能客服AI在线</span>
                </div>
            </div>
        </div>
    <div class="menu-wrapper">
      <button class="menu-btn" onclick="toggleMenu()">☰</button>
      <div class="menu-dropdown" id="menuDropdown">
        <div class="menu-item" onclick="requestHumanSupport(); toggleMenu();">👨‍💼 人工客服</div>
        <div class="menu-item" id="historyBtn" onclick="toggleHistory(); toggleMenu();">📋 查看记录</div>
        <div class="menu-item" onclick="clearChat(); toggleMenu();">🗑️ 清空对话</div>
      </div>
    </div>
    </div>

    <div class="messages-area" id="messagesArea" style="background:transparent!important;">
        <!-- 欢迎界面 -->
        <div class="welcome-screen" id="welcomeScreen" style="background:transparent!important;">
            <div class="welcome-logo">
                <img src="img/logo-new.png" alt="Providence" />
            </div>
            <div class="welcome-title">有什么可以帮你的？</div>
            <div class="welcome-subtitle">智能客服 · 7×24小时在线</div>
            <div class="quick-tags">
                <div class="quick-tag" onclick="quickAsk('怎么充值')">💳 充值</div>
                <div class="quick-tag" onclick="quickAsk('怎么提现')">💰 提现</div>
                <div class="quick-tag" onclick="quickAsk('我的余额')">💵 余额</div>
                <div class="quick-tag" onclick="quickAsk('VIP权益')">👑 VIP</div>
                <div class="quick-tag" onclick="quickAsk('日利宝')">💎 日利宝</div>
                <div class="quick-tag" onclick="quickAsk('USDT充值')">₮ USDT</div>
            </div>
        </div>

        <!-- 对话区域 -->
        <div id="chatMessages" class="hidden"></div>
    </div>

    <div class="input-area">
        <input type="text" class="input-box" id="chatInput" placeholder="输入您的问题..." />
        <button class="send-btn" id="sendBtn" onclick="handleSend()">➤</button>
    </div>
</div>

<script>
const messagesArea = document.getElementById('messagesArea');
const welcomeScreen = document.getElementById('welcomeScreen');
const chatMessages = document.getElementById('chatMessages');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');
const statusText = document.getElementById('statusText');
const historyBtn = document.getElementById('historyBtn');

let conversationHistory = [];
let isGenerating = false;
let showingHistory = false;

// 初始化
document.addEventListener('DOMContentLoaded', () => {
    chatInput.focus();
    console.log('🤖 Providence 智能客服已就绪');

    // 点击外部关闭菜单
    document.addEventListener('click', (e) => {
        const menu = document.getElementById('menuDropdown');
        const btn = document.querySelector('.menu-btn');
        if (!menu.contains(e.target) && !btn.contains(e.target)) {
            menu.classList.remove('show');
        }
    });
});

// 切换菜单
function toggleMenu() {
    const menu = document.getElementById('menuDropdown');
    menu.classList.toggle('show');
}

// 获取时间
function getTimeString() {
    return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
}

// 快捷提问
function quickAsk(question) {
    chatInput.value = question;
    handleSend();
}

// 切换历史记录
function toggleHistory() {
    const saved = localStorage.getItem('deepseek_chat_history');
    if (!saved) {
        alert('暂无对话记录');
        return;
    }

    showingHistory = !showingHistory;
    historyBtn.classList.toggle('active', showingHistory);

    if (showingHistory) {
        // 显示历史
        welcomeScreen.classList.add('hidden');
        chatMessages.classList.remove('hidden');
        chatMessages.innerHTML = '';

        const history = JSON.parse(saved);
        history.forEach(msg => {
            if (msg.role === 'user') {
                appendMessage('user', msg.content);
            } else if (msg.role === 'assistant') {
                appendMessage('ai', formatMessage(msg.content));
            }
        });
        conversationHistory = history;
    } else {
        // 隐藏历史，显示欢迎
        chatMessages.classList.add('hidden');
        chatMessages.innerHTML = '';
        welcomeScreen.classList.remove('hidden');
        conversationHistory = [];
    }
}

// 发送消息
async function handleSend() {
    const message = chatInput.value.trim();
    if (!message || isGenerating) return;

    // 开始对话，隐藏欢迎界面
    welcomeScreen.classList.add('hidden');
    chatMessages.classList.remove('hidden');
    showingHistory = false;
    historyBtn.classList.remove('active');

    isGenerating = true;
    chatInput.disabled = true;
    sendBtn.disabled = true;
    statusText.textContent = 'AI思考中...';

    // 添加用户消息
    appendMessage('user', message);
    conversationHistory.push({ role: 'user', content: message });
    chatInput.value = '';

    // 显示加载
    const loadingId = 'loading-' + Date.now();
    appendMessage('ai', '<div class="typing"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>', loadingId);

    try {
        const userToken = localStorage.getItem('token') || '';

        const response = await fetch('https://bot.4kp3l0iq.top/deepseek-proxy.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                messages: conversationHistory,
                token: userToken,
                stream: false
            })
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        removeMessage(loadingId);

        if (data.choices && data.choices[0] && data.choices[0].message) {
            const aiReply = data.choices[0].message.content;
            appendMessage('ai', formatMessage(aiReply));
            conversationHistory.push({ role: 'assistant', content: aiReply });
            saveHistory();
        } else {
            appendMessage('ai', '抱歉，我暂时无法回答，请稍后重试。');
        }

    } catch (error) {
        console.error('AI请求失败:', error);
        removeMessage(loadingId);
        appendMessage('ai', '😔 网络连接失败，请检查后重试。');
    } finally {
        isGenerating = false;
        chatInput.disabled = false;
        sendBtn.disabled = false;
        statusText.textContent = '智能客服AI在线';
        chatInput.focus();
    }
}

// 添加消息到界面
function appendMessage(type, content, msgId) {
    const id = msgId || 'msg-' + Date.now();
    const time = getTimeString();

    let avatarHtml;
    if (type === 'ai') {
        avatarHtml = '<img src="img/logo-new.png" alt="AI" onerror="this.parentElement.innerHTML=\'🤖\'" />';
    } else {
        avatarHtml = '<img src="img/user-avatar-default.svg" alt="用户" onerror="this.parentElement.innerHTML=\'👤\'" />';
    }

    const html = `
        <div class="msg ${type}" id="${id}">
            <div class="msg-avatar">${avatarHtml}</div>
            <div class="msg-content">
                <div class="msg-bubble">${content}</div>
                <div class="msg-time">${time}</div>
            </div>
        </div>
    `;

    chatMessages.insertAdjacentHTML('beforeend', html);
    scrollToBottom();
    return id;
}

// 移除消息
function removeMessage(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
}

// 格式化消息
function formatMessage(text) {
    // 换行
    text = text.replace(/\n/g, '<br>');
    // 加粗
    text = text.replace(/\*\*(.*?)\*\*/g, '<strong style="color:#0e2b44">$1</strong>');
    // USDT余额 - 绿色 (匹配多种格式)
    text = text.replace(/USDT[余额：:]*\s*(\d+[\d,\.]*)/gi, 'USDT：<span class="balance-usdt">$1</span>');
    text = text.replace(/(\d+[\d,\.]*)\s*USDT/gi, '<span class="balance-usdt">$1 USDT</span>');
    // 人民币余额 - 金色
    text = text.replace(/人民币[余额：:]*\s*(\d+[\d,\.]*)/gi, '人民币：<span class="balance-cny">$1</span>');
    text = text.replace(/(\d+[\d,\.]*)\s*(CNY|元)/gi, '<span class="balance-cny">$1 $2</span>');
    return text;
}

// 滚动到底部
function scrollToBottom() {
    setTimeout(() => {
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }, 50);
}

// 清空对话
function clearChat() {
    conversationHistory = [];
    localStorage.removeItem('deepseek_chat_history');
    chatMessages.innerHTML = '';
    chatMessages.classList.add('hidden');
    welcomeScreen.classList.remove('hidden');
    showingHistory = false;
    historyBtn.classList.remove('active');
}

// 保存历史
function saveHistory() {
    try {
        const toSave = conversationHistory.slice(-20);
        localStorage.setItem('deepseek_chat_history', JSON.stringify(toSave));
    } catch (e) {
        console.error('保存历史失败:', e);
    }
}

// 回车发送
chatInput.addEventListener('keypress', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
    }
});

// 人工服务请求
function requestHumanSupport() {
    // 创建弹窗
    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.id = 'humanSupportModal';
    modal.innerHTML = `
        <div class="modal-box">
            <div class="modal-icon">👨‍💼</div>
            <div class="modal-title">转接人工客服</div>
            <div class="modal-desc">请简述你的问题，我们会为你转接专属人工客服</div>
            <input type="text" class="modal-input" id="humanQuestion" placeholder="请输入你的问题..." />
            <div class="modal-btns">
                <button class="modal-btn cancel" onclick="closeHumanModal()">取消</button>
                <button class="modal-btn confirm" id="confirmHumanBtn" onclick="confirmHumanSupport()">确认转接</button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);

    // 聚焦输入框
    setTimeout(() => {
        document.getElementById('humanQuestion').focus();
    }, 100);
}

// 关闭弹窗
function closeHumanModal() {
    const modal = document.getElementById('humanSupportModal');
    if (modal) modal.remove();
}

// 确认转接人工
// 确认转接人工
async function confirmHumanSupport() {
    const questionInput = document.getElementById('humanQuestion');
    const confirmBtn = document.getElementById('confirmHumanBtn');
    const question = questionInput.value.trim() || '用户需要人工帮助';

    confirmBtn.disabled = true;
    confirmBtn.textContent = '转接中...';

    try {
        const userToken = localStorage.getItem('token') || '';

        const response = await fetch('https://bot.4kp3l0iq.top/kefu-redirect.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                token: userToken,
                question: question
            })
        });

        const data = await response.json();

        closeHumanModal();

        if (data.success && data.redirect_url) {
            // 跳转到客服页面
            window.location.href = data.redirect_url;
        } else {
            showNotification('❌ 转接失败：' + (data.error || '请稍后重试'), 'error');
        }

    } catch (error) {
        console.error('人工服务请求失败:', error);
        closeHumanModal();
        showNotification('❌ 网络错误，请稍后重试', 'error');
    }
}

// 显示通知
function showNotification(message, type) {
    const notification = document.createElement('div');
    notification.style.cssText = `
        position: fixed;
        top: 80px;
        left: 50%;
        transform: translateX(-50%);
        background: ${type === 'success' ? '#4caf50' : '#f44336'};
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 14px;
        z-index: 2000;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        animation: fadeIn 0.3s ease;
    `;
    notification.textContent = message;
    document.body.appendChild(notification);

    setTimeout(() => {
        notification.remove();
    }, 3000);
}
</script>
