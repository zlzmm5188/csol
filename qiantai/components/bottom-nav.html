<script>
// 自动激活当前页面的导航项
(function() {
    const currentPage = window.location.pathname.split('/').pop() || 'index.html';
    const navItems = document.querySelectorAll('.bottom-nav .nav-item');
    
    navItems.forEach(item => {
        const href = item.getAttribute('href');
        if (href === currentPage || 
            (currentPage.includes('profile') && href === 'profile.html') ||
            (currentPage.includes('ribao') && href === 'profile.html') ||
            (currentPage.includes('team') && href === 'profile.html') ||
            (currentPage.includes('points') && href === 'profile.html')) {
            item.classList.add('active');
        }
    });
})();
</script>
