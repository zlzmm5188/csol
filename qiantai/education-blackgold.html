    <script>
        // ========== 学习进度管理 ==========
        const PROGRESS_KEY = 'education_progress_blackgold';

        function getProgress() {
            const data = localStorage.getItem(PROGRESS_KEY);
            return data ? JSON.parse(data) : [];
        }

        function saveProgress(completed) {
            localStorage.setItem(PROGRESS_KEY, JSON.stringify(completed));
        }

        function isCourseCompleted(courseId) {
            return getProgress().includes(courseId);
        }

        function markCourseComplete(courseId) {
            const completed = getProgress();
            if (!completed.includes(courseId)) {
                completed.push(courseId);
                saveProgress(completed);
            }
        }

        function isCourseUnlocked(courseId) {
            const course = COURSES.find(c => c.id === courseId);
            if (!course) return false;

            // 每个分类的第一门课始终解锁
            const sameCategoryCourses = COURSES
                .filter(c => c.category === course.category)
                .sort((a, b) => a.order - b.order);

            if (sameCategoryCourses[0].id === courseId) return true;

            // 检查上一门课是否完成
            const courseIndex = sameCategoryCourses.findIndex(c => c.id === courseId);
            if (courseIndex <= 0) return false;

            const prevCourse = sameCategoryCourses[courseIndex - 1];
            return isCourseCompleted(prevCourse.id);
        }

                    currentCategory = this.getAttribute('data-category');
                    renderCourses();
                });
            });

                if (e.target === this) {

            });

        }

            };

            return {
                intro: `欢迎学习《${course.title}》！${levelDesc[course.level]}。通过本课程的学习，你将掌握关键的投资知识和实战技巧。`,
                objectives: [
                    `深入理解"${course.title}"的核心概念和原理`,
                    `掌握${categoryNames[course.category]}领域的实用技巧`,
                    `学会运用所学知识进行实际投资决策`,
                    `提升${course.level}阶段的专业投资能力`
                ],
                sections: [
                    {
                        title: "核心概念讲解",
                        text: `在本章节中，我们将系统学习《${course.title}》的基本定义、发展历程和重要意义。理解这些基础概念是掌握后续知识的关键。通过本节的学习，你将建立起扎实的理论基础。`,
                        tips: `建议先理解核心概念，再进入实战应用阶段。可以多读几遍，确保完全掌握。`
                    },
                    {
                        title: "关键要点分析",
                        text: `本节重点分析《${course.title}》中的关键要点和注意事项。我们将通过实际案例，帮助你深入理解这些要点在实战中的应用。案例都来自真实的投资场景，具有很强的参考价值。`,
                        tips: `重点关注案例分析，思考如何将理论应用到实际投资中。建议做笔记记录关键点。`
                    },
                    {
                        title: "实战技巧分享",
                        text: `在掌握了理论知识后，本节将分享实用的投资技巧和策略。这些技巧都是经过市场验证的，可以直接应用到你的投资实践中。我们还会分享一些常见的误区和陷阱，帮助你避免不必要的损失。`,
                        tips: `建议边学边实践，通过模拟投资来验证所学技巧。实践是检验真理的唯一标准。`
                    },
                    {
                        title: "风险管理要点",
                        text: `任何投资都伴随风险，本节将详细讲解${categoryNames[course.category]}中的常见风险，以及相应的防范和应对策略。学会风险管理是长期成功的关键。我们将教你如何识别风险、评估风险、控制风险。`,
                        tips: `风险管理永远是第一位的，不要为了追求高收益而忽视风险。保住本金比赚钱更重要！`
                    }
                ],
                summary: `通过本课程的系统学习，你已经掌握了《${course.title}》的核心知识和实战技巧。记住，投资是一个持续学习的过程，建议定期回顾本课程内容，并结合市场实践不断深化理解。理论联系实际，才能真正提升投资水平。`,
                nextSteps: [
                    `复习本课程的关键知识点，确保完全理解`,
                    `继续学习下一课程，持续提升投资能力`,
                    `将所学知识应用到实际投资中，积累经验`,
                    `关注市场动态，保持学习热情，终身学习`
                ]
            };
        }

        // 渲染课程列表
        function renderCourses() {
            const grid = document.getElementById('coursesGrid');
            const filtered = COURSES.filter(c => c.category === currentCategory).sort((a, b) => a.order - b.order);

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="loading">暂无课程数据</div>';
                return;
            }

            grid.innerHTML = filtered.map(course => {
                const completed = isCourseCompleted(course.id);
                const unlocked = isCourseUnlocked(course.id);

                return `
          <div class="course-card ${!unlocked ? 'locked' : ''}" onclick="${unlocked ? `openCourse(${course.id})` : ''}">
            <div class="course-icon">${course.icon}</div>
            <div class="course-header">
              <span class="course-level">${course.level}</span>
              ${completed ? '<span class="course-status">✓ 已完成</span>' : ''}
              ${!unlocked ? '<span class="course-lock">🔒</span>' : ''}
            </div>
            <div class="course-title">${course.title}</div>
            <div class="course-desc">${course.desc || '系统学习投资知识，掌握实战技巧'}</div>
            <div class="course-meta">
              <span>⏱️ ${course.duration}</span>
              <span>📚 ${course.lessons}课时</span>
            </div>
          </div>
        `;
            }).join('');
        }

        // 打开课程详情
        function openCourse(courseId) {
            const course = COURSES.find(c => c.id === courseId);
            if (!course) return;

            let content = window.COURSE_CONTENTS && window.COURSE_CONTENTS[courseId];

            if (!content) {
                content = generateGenericContent(course);
            }

            const completed = isCourseCompleted(courseId);

            const modalHTML = `
        <div class="modal-header">
          <div class="modal-close" onclick="closeModal()">×</div>
          <div class="modal-icon">${course.icon}</div>
          <h2 class="modal-title">${course.title}</h2>
          <p class="modal-intro">${content.intro}</p>
        </div>
        <div class="modal-body">
          <div class="content-card">
            <div class="content-card-title">🎯 学习目标</div>
            <ul class="objectives-list">
              ${content.objectives.map(obj => `<li>${obj}</li>`).join('')}
            </ul>
          </div>

          ${content.sections.map((section, idx) => `
            <div class="content-card">
              <div class="content-card-title">${idx + 1}️⃣ ${section.title}</div>
              <div class="content-card-text">${section.text}</div>
              ${section.tips ? `<div class="content-card-tip">💡 ${section.tips}</div>` : ''}
            </div>
          `).join('')}

          <div class="content-card">
            <div class="content-card-title">📝 课程总结</div>
            <div class="content-card-text">${content.summary}</div>
          </div>

          <div class="content-card">
            <div class="content-card-title">🚀 下一步行动</div>
            <ul class="next-steps-list">
              ${content.nextSteps.map(step => `<li>${step}</li>`).join('')}
            </ul>
          </div>

          <div class="action-buttons">
            ${!completed ?
                    `<button class="action-btn action-btn-primary" onclick="completeCourse(${courseId})">✓ 标记为已完成</button>` :
                    `<button class="action-btn action-btn-secondary" disabled style="opacity:0.5">✓ 已完成</button>`
                }
            <button class="action-btn action-btn-secondary" onclick="closeModal()">稍后学习</button>
          </div>
        </div>
      `;

            document.getElementById('modalContent').innerHTML = modalHTML;
            document.getElementById('modalOverlay').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        // 关闭模态框
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
            document.body.style.overflow = '';
        }

        // 完成课程
        function completeCourse(courseId) {
            markCourseComplete(courseId);
            showToast('🎉 恭喜完成本课程！');
            closeModal();
            renderCourses();
        }

        // 页面加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPage);
        } else {
            initPage();
        }
    </script>
</body>

</html>
