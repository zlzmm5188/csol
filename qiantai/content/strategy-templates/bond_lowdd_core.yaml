key: bond_lowdd_core
title: 固收低回撤·纪律增强
language: zh-CN
category: bond
tags: 低回撤,对冲,择券池,稳健
bodyMd: |
  本策略聚焦于**回撤可控**与**资金效率**两大驱动维度，通过严谨的择券池纪律与事件因子动态调整，使产品在弱行情区间仍维持稳定收益曲线。

  - 历史真实回撤长期控制在 **{{risk_drawdown}}%** 区间
  - 深/沪可转债筛选模型 + **Q-自适应** 调仓
  - 组合透明化，**每周** 固定公开持仓分布与目标区间

variants:
  - variantKey: A
    weight: 3
    bodyMd: |
      核心在于**纪律化执行**与**对冲保护**。择券池采用多维因子打分，优先保留流动性良好、基本面稳健的标的，减少尾部风险暴露。
  - variantKey: B
    weight: 1
    bodyMd: |
      我们更关注**稳定复利**而非单期高收益。通过对异常波动的**回撤阈值**管理，追求净值曲线的平滑与可预期性。
