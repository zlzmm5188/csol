key: fund_fixed_plus
title: 固收增强·基金组合
language: zh-CN
category: fund
tags: 固收增强,基金组合,稳健增值,资产配置
bodyMd: |
  本策略通过**固收类基金组合**实现稳健增值，在控制回撤的前提下追求超越基准的收益表现。

  - 组合构建：精选优质固收基金，通过资产配置优化风险收益比
  - 动态调整：根据市场环境与基金表现，定期优化组合结构
  - 收益目标：在 **{{cycle_days}}** 天周期内，追求稳定复利增长

variants:
  - variantKey: A
    weight: 2
    bodyMd: |
      采用**核心+卫星**策略：核心仓位配置稳健型固收基金，卫星仓位参与增强型产品，平衡风险与收益。
  - variantKey: B
    weight: 1
    bodyMd: |
      采用**多策略组合**：结合纯债基金、可转债基金、混合型基金，通过分散配置降低单一策略风险。
