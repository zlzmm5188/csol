    <script>
        let currentBalance = 0;

        document.addEventListener('DOMContentLoaded', function() {
            if (!checkLogin()) {
                return; // 如果未登录，不继续执行
            }
            loadPointsBalance();
        });

        function checkLogin() {
            // 兼容两种token存储方式
            const token = localStorage.getItem('providence_token') || localStorage.getItem('token');
            if (!token) {
                showToast('请先登录');
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 1500);
                return false;
            }
            return true;
        }

        async function loadPointsBalance() {
            try {
                // 优先使用ApiService封装（来自config.js）
                if (window.ApiService && window.ApiService.points && window.ApiService.points.getBalance) {
                    try {
                        const result = await window.ApiService.points.getBalance();
                        if (result && result.points !== undefined) {
                            currentBalance = parseFloat(result.points) || 0;
                            document.getElementById('pointsBalance').textContent = currentBalance.toFixed(2);
                            document.getElementById('todayPoints').textContent = '+0.00';
                            document.getElementById('totalExchange').textContent = '0.00';
                            return;
                        }
                    } catch (apiError) {
                        console.warn('ApiService调用失败，使用fallback:', apiError);
                    }
                }

                // Fallback: 直接使用fetch
                // 注意：API路径应该是 /user/points/balance
                // config.js中baseURL是 https://api.4kp3l0iq.top，应该使用这个
                const API_BASE = window.API_CONFIG?.baseURL || 'https://api.4kp3l0iq.top';
                const token = localStorage.getItem('providence_token') || localStorage.getItem('token') || '';

                if (!token) {
                    throw new Error('未登录，请先登录');
                }

                const url = API_BASE + '/api/points/balance';
                const res = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    }
                });

                if (!res.ok) {
                    const errorText = await res.text();
                    throw new Error(`HTTP ${res.status}: ${res.statusText}`);
                }

                const text = await res.text();

                if (!text || text.trim().startsWith('<')) {
                    throw new Error('服务器返回了HTML而不是JSON，可能是路由配置问题');
                }

                let data;
                try {
                    data = JSON.parse(text);
                } catch (parseError) {
                    throw new Error('响应格式错误，无法解析JSON');
                }

                if (data.code === 1 && data.data) {
                    currentBalance = parseFloat(data.data.points) || 0;
                    document.getElementById('pointsBalance').textContent = currentBalance.toFixed(2);
                    // 后端只返回points，没有today_points和total_exchange，显示为0
                    document.getElementById('todayPoints').textContent = '+0.00';
                    document.getElementById('totalExchange').textContent = '0.00';
                } else {
                    const errorMsg = data.message || data.msg || '加载失败';
                    showToast(errorMsg);
                }
            } catch (error) {
                showToast('加载失败: ' + (error.message || '未知错误'));
            }
        }

        function calculateAmount() {
            const points = parseFloat(document.getElementById('exchangeAmount').value) || 0;
            // 兑换比例：1 = ¥0.5
            const EXCHANGE_RATE = 0.5;
            const money = points * EXCHANGE_RATE;
            document.getElementById('exchangeMoney').textContent = '¥' + money.toFixed(2);

            const btn = document.getElementById('exchangeBtn');
            // 最低兑换100
            if (points < 100) {
                btn.disabled = true;
                btn.textContent = '最低兑换 100';
            } else if (points > currentBalance) {
                btn.disabled = true;
                btn.textContent = '余额不足';
            } else {
                btn.disabled = false;
                btn.textContent = '确认兑换';
            }
        }

        function showPasswordModal() {
            const points = parseFloat(document.getElementById('exchangeAmount').value) || 0;

            // 最低兑换100
            if (points < 100) {
                showToast('最低兑换 100');
                return;
            }

            if (points > currentBalance) {
                showToast('余额不足');
                return;
            }

            document.getElementById('passwordModal').classList.add('active');
            document.getElementById('tradePassword').value = '';
            setTimeout(() => {
                document.getElementById('tradePassword').focus();
            }, 300);
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').classList.remove('active');
        }

        async function confirmExchange() {
            const points = parseFloat(document.getElementById('exchangeAmount').value) || 0;
            const tradePassword = document.getElementById('tradePassword').value;

            if (!tradePassword || tradePassword.length !== 6) {
                document.getElementById('tradePassword').classList.add('error');
                showToast('请输入6位支付密码');
                setTimeout(() => {
                    document.getElementById('tradePassword').classList.remove('error');
                }, 300);
                return;
            }

            const btn = document.querySelector('.popup-btn-confirm');
            btn.classList.add('loading');
            btn.textContent = '处理中...';

            try {
                // 使用正确的API地址（config.js中baseURL是 https://api.4kp3l0iq.top）
                const API_BASE = window.API_CONFIG?.baseURL || 'https://api.4kp3l0iq.top';
                const token = localStorage.getItem('providence_token') || localStorage.getItem('token') || '';
                const res = await fetch(API_BASE + '/api/points/exchange', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({
                        points: points,
                        currency: 'CNY',
                        pay_password: tradePassword
                    })
                });
                const text = await res.text();
                const data = text ? JSON.parse(text) : { code: -1, message: '响应解析失败' };

                if (data.code === 1) {
                    showToast(data.message || '兑换成功！');
                    closePasswordModal();

                    document.getElementById('exchangeAmount').value = '';
                    calculateAmount();

                    setTimeout(() => {
                        loadPointsBalance();
                    }, 1000);
                } else {
                    document.getElementById('tradePassword').classList.add('error');
                    showToast(data.message || data.msg || '兑换失败');
                    setTimeout(() => {
                        document.getElementById('tradePassword').classList.remove('error');
                    }, 300);
                }
            } catch (error) {
                console.error('兑换失败:', error);
                showToast('兑换失败，请重试');
            } finally {
                btn.classList.remove('loading');
                btn.textContent = '确认兑换';
            }
        }

        function goBack() {
            // 检查是否有历史记录
            if (window.history.length > 1) {
                // 尝试使用 history.back()
                const referrer = document.referrer;
                if (referrer && referrer.includes(window.location.hostname)) {
                    window.history.back();
                } else {
                    // 如果没有有效的 referrer，跳转到个人中心
                    window.location.href = 'profile.html';
                }
            } else {
                // 没有历史记录，跳转到个人中心（积分兑换通常从个人中心进入）
                window.location.href = 'profile.html';
            }
        }

        function goHistory() {
            window.location.href = '/points-exchange-history.html';
        }

        document.getElementById('passwordModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closePasswordModal();
            }
        });

        document.getElementById('tradePassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                confirmExchange();
            }
        });
    </script>
