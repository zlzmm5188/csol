<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
    <!-- iOS状态栏配色 - 深色主题 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a1020" />
    <title>实名认证 - Providence</title>
    <link rel="stylesheet" href="styles.css?v=1763897782" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        background-attachment: fixed;
            min-height: 100vh;
            padding: clamp(12px, 3vw, 20px);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
        }

        .kyc-container {
            max-width: clamp(320px, 90vw, 600px);
            width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: clamp(12px, 3vw, 16px);
            padding: clamp(16px, 4vw, 24px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .kyc-title {
            width: 100%;
            font-size: clamp(20px, 5vw, 24px);
            font-weight: 700;
            color: #1a1d29;
            margin-bottom: clamp(16px, 4vw, 24px);
        }

        .upload-area {
            border: 2px dashed #d0d7de;
            border-radius: clamp(10px, 2.5vw, 12px);
            padding: clamp(24px, 6vw, 40px) clamp(16px, 4vw, 20px);
            width: 100%;
            background: #f6f8fa;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: clamp(16px, 4vw, 20px);
        }

        .upload-area:hover {
            border-color: #667eea;
            background: #f0f3ff;
        }

        .upload-area.active {
            border-color: #667eea;
            background: #e8ecff;
        }

        .upload-icon {
            font-size: clamp(36px, 9vw, 48px);
            margin-bottom: clamp(8px, 2vw, 12px);
        }

        .upload-text {
            font-size: clamp(14px, 3.5vw, 16px);
            color: #57606a;
            margin-bottom: clamp(6px, 1.5vw, 8px);
        }

        .upload-hint {
            font-size: clamp(12px, 3vw, 14px);
            color: #8b949e;
        }

        .preview-area {
            display: none;
            margin-bottom: 20px;
        }

        .preview-area.show {

        }

        .preview-image {
            width: 100%;
            max-height: clamp(200px, 50vw, 300px);
            object-fit: contain;
            border-radius: clamp(6px, 1.5vw, 8px);
            margin-bottom: clamp(8px, 2vw, 12px);
        }

        .preview-actions {
            display: flex;
            gap: clamp(8px, 2vw, 12px);
            justify-content: center;
            flex-wrap: wrap;
        }

        .form-group {
            margin-bottom: clamp(16px, 4vw, 20px);
        }

        .form-label {
            width: 100%;
            font-size: clamp(13px, 3.3vw, 14px);
            font-weight: 600;
            color: #1a1d29;
            margin-bottom: clamp(6px, 1.5vw, 8px);
            display: block;
        }

        .form-input {
            width: 100%;
            padding: clamp(10px, 2.5vw, 12px) clamp(12px, 3vw, 16px);
            border: 2px solid #d0d7de;
            border-radius: clamp(6px, 1.5vw, 8px);
            font-size: clamp(14px, 3.5vw, 16px);
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-input.success {
            border-color: #2da44e;
            background: #f0fff4;
        }

        .btn {
            width: 100%;
            padding: clamp(12px, 3vw, 14px);
            border: none;
            border-radius: clamp(6px, 1.5vw, 8px);
            font-size: clamp(14px, 3.5vw, 16px);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f6f8fa;
            color: #57606a;
        }

        .btn-secondary:hover {
            background: #eaeef2;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress-container {
            display: none;
            margin: 20px 0;
        }

        .progress-container.show {

        }

        .progress-bar {
            height: 8px;
            background: #e8ecff;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);

            transition: width 0.3s;
        }

        .progress-text {

            font-size: 14px;
            color: #57606a;
            margin-top: 8px;
        }

        .tip {
            background: #fff8e1;
            border-left: 4px solid #ffc107;
            padding: clamp(10px, 2.5vw, 12px) clamp(12px, 3vw, 16px);
            border-radius: clamp(4px, 1vw, 4px);
            font-size: clamp(12px, 3vw, 14px);
            color: #5f4c00;
            margin-top: clamp(16px, 4vw, 20px);
            line-height: 1.5;
        }

        .hidden {
            display: none;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }
        }

        .shake {
            animation: shake 0.5s;
        }
          .brand { display: flex; flex-direction: row; align-items: center; gap: 8px; white-space: nowrap; justify-content: flex-start; }
          .page-title, .brand h1 { margin: 0; display: inline-block; white-space: nowrap; flex: 0 1 auto; }
    </style>
</head>

<body>
    <div class="kyc-container">
        <h1 class="kyc-title">📱 实名认证</h1>

        <!-- 上传区域 -->
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📷</div>
            <div class="upload-text">点击拍摄身份证正面</div>
            <div class="upload-hint">支持拍照或从相册选择</div>
            <input type="file" id="fileInput" accept="image/*" capture="environment" style="display: none;" />
        </div>

        <!-- 预览区域 -->
        <div class="preview-area" id="previewArea">
            <img id="previewImage" class="preview-image" alt="预览" />
            <div class="preview-actions">
                <button class="btn btn-secondary" onclick="reupload()">重新拍摄</button>
                <button class="btn btn-primary" onclick="startRecognize()">开始识别</button>
            </div>
        </div>

        <!-- 识别进度 -->
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">正在识别中...</div>
        </div>

        <!-- 表单 -->
        <form id="kycForm">
            <div class="form-group">
                <label class="form-label">真实姓名</label>
                <input type="text" class="form-input" id="realName" placeholder="请输入真实姓名" required />
            </div>

            <div class="form-group">
                <label class="form-label">身份证号码</label>
                <input type="text" class="form-input" id="idNumber" placeholder="识别后自动填写或手动输入" maxlength="18" required />
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">提交认证</button>
        </form>

        <div class="tip">
            💡 提示：照片在您的手机本地识别，不会上传到服务器，请放心使用。识别后请仔细核对证件号码。
        </div>
    </div>

    <!-- 引入Tesseract.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script defer src="js/ocr/tesseract-ocr.js?v=1763897782"></script>
    <script src="ios-toast.js?v=1763897782"></script>
    <script>
        let selectedFile = null;

        // 点击上传区域
        document.getElementById('uploadArea').addEventListener('click', function () {
            document.getElementById('fileInput').click();
        });

        // 文件选择
        document.getElementById('fileInput').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                showPreview(file);
            }
        });

        // 显示预览
        function showPreview(file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                document.getElementById('previewImage').src = e.target.result;
                document.getElementById('uploadArea').style.display = 'none';
                document.getElementById('previewArea').classList.add('show');
            };
            reader.readAsDataURL(file);
        }

        // 重新上传
        function reupload() {
            selectedFile = null;
            document.getElementById('uploadArea').style.display = 'block';
            document.getElementById('previewArea').classList.remove('show');
            document.getElementById('progressContainer').classList.remove('show');
            document.getElementById('fileInput').value = '';
        }

        // 开始识别
        async function startRecognize() {
            if (!selectedFile) {
                showToast('请先选择图片');
                return;
            }

            try {
                // 显示进度
                document.getElementById('progressContainer').classList.add('show');
                setProgress(0, '准备识别...');

                // 识别身份证（带进度回调）
                const result = await window.ProvidenceOCR.recognizeIDCard(
                    selectedFile,
                    (percent, text) => {
                        setProgress(percent, text);
                    }
                );

                if (result.success) {
                    // 识别成功
                    setProgress(100, '识别完成！');

                    // 自动填写
                    const idInput = document.getElementById('idNumber');
                    idInput.value = result.idNumber;
                    idInput.classList.add('success');

                    showToast('✅ 识别成功！请核对证件号码');

                    // 聚焦到姓名输入框
                    document.getElementById('realName').focus();
                } else {
                    // 识别失败
                    setProgress(0, '');
                    showToast(result.message || '识别失败，请手动输入');
                    document.getElementById('idNumber').focus();
                }

                // 隐藏进度条
                setTimeout(() => {
                    document.getElementById('progressContainer').classList.remove('show');
                }, 2000);

            } catch (error) {
                console.error('识别错误:', error);
                setProgress(0, '');
                document.getElementById('progressContainer').classList.remove('show');
                showToast('识别失败: ' + error.message);
            }
        }

        // 设置进度
        function setProgress(percent, text) {
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressText').textContent = text;
        }

        // 表单提交
        document.getElementById('kycForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const realName = document.getElementById('realName').value.trim();
            const idNumber = document.getElementById('idNumber').value.trim();

            if (!realName || !idNumber) {
                showToast('请填写完整信息');
                return;
            }

            // 验证身份证号
            if (!window.ProvidenceOCR.validateIDNumber(idNumber)) {
                showToast('身份证号格式不正确');
                document.getElementById('idNumber').classList.add('shake');
                setTimeout(() => {
                    document.getElementById('idNumber').classList.remove('shake');
                }, 500);
                return;
            }

            // 提交到后端
            try {
                showToast('正在提交...');

                // TODO: 调用后端API
                // const response = await fetch('/api/user/kyc/submit', {
                //     method: 'POST',
                //     headers: { 'Content-Type': 'application/json' },
                //     body: JSON.stringify({ realName, idNumber })
                // });

                // 模拟提交成功
                setTimeout(() => {
                    showToast('✅ 认证提交成功，等待审核');
                    setTimeout(() => {
                        window.location.href = 'profile.html';
                    }, 1500);
                }, 1000);

            } catch (error) {
                console.error('提交错误:', error);
                showToast('提交失败: ' + error.message);
            }
        });

        // 身份证号输入格式化
        document.getElementById('idNumber').addEventListener('input', function (e) {
            // 只允许数字和X
            this.value = this.value.toUpperCase().replace(/[^0-9X]/g, '');
        });
    </script>
    <script src="page-lifecycle.js?v=1763897782"></script>
    <script defer src="smart-swipe-control.js?v=1763897782"></script>


</body>

</html>
