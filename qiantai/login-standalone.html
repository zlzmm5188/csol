<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <!-- iOS适配 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a1020">

    <title>登录 - Providence（独立版）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #0e2b44 0%, #1a3a5f 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 60px 20px 30px;
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            border-radius: 14px;
            margin: 0 auto 16px;
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: 3px;
        }

        .subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }

        .form-container {
            flex: 1;
            padding: 0 20px 30px;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1.5px solid rgba(199, 181, 138, 0.4);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
        }

        .form-group input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(199, 181, 138, 0.8);
            outline: none;
            box-shadow: 0 0 0 3px rgba(199, 181, 138, 0.15);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #0b3b5e, #0e4a78);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .links {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .links a {
            color: rgba(199, 181, 138, 0.9);
            text-decoration: none;
        }

        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 10000;
            display: none;
            min-width: 200px;
            text-align: center;
        }

        .debug {
            background: rgba(0, 0, 0, 0.7);
            color: #0f0;
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            font-size: 11px;
            font-family: monospace;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>

<body>
    <div class="header">
        <img src="img/logo.png" alt="Providence" class="logo" onerror="this.style.display='none'">
        <h1 class="title">PROVIDENCE</h1>
        <p class="subtitle">EQUITY PARTNERS</p>
    </div>

    <div class="form-container">
        <div class="form-group">
            <label>账号</label>
            <input type="text" id="username" placeholder="请输入账号" autocomplete="username">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <div class="links">
            <a href="register.html">立即注册</a>
            <a href="reset-password.html">忘记密码</a>
        </div>
        <button class="btn" id="btnLogin">登录</button>
        <div class="debug" id="debug" style="display:block;"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ========== 完全独立的登录逻辑（不依赖外部JS） ==========

        const API_BASE = 'https://api.4kp3l0iq.top';
        const TOKEN_KEY = 'providence_token';

        function log(msg) {
            const debugEl = document.getElementById('debug');
            const time = new Date().toLocaleTimeString();
            debugEl.innerHTML += `[${time}] ${msg}<br>`;
            debugEl.scrollTop = debugEl.scrollHeight;
            console.log(msg);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2000);
        }

        async function handleLogin() {
            const btn = document.getElementById('btnLogin');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username) {
                showToast('请输入账号');
                return;
            }
            if (!password) {
                showToast('请输入密码');
                return;
            }

            btn.disabled = true;
            btn.textContent = '登录中...';

            log('━━━━━━━━━━━━━━━━━━━━━━');
            log('🚀 开始登录');
            log('账号: ' + username);
            log('API: ' + API_BASE);

            try {
                const requestData = {
                    username: username,
                    password: password,
                    system: 1
                };

                log('📤 Request: ' + JSON.stringify(requestData));

                const response = await fetch(API_BASE + '/index.php/login/account', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestData)
                });

                log('📡 Status: ' + response.status);

                const text = await response.text();
                log('📥 Response (raw): ' + text.substring(0, 200));

                let data;
                try {
                    data = JSON.parse(text);
                    log('✅ JSON 解析成功');
                } catch (e) {
                    log('❌ JSON 解析失败: ' + e.message);
                    showToast('服务器响应格式错误');
                    btn.disabled = false;
                    btn.textContent = '登录';
                    return;
                }

                log('📊 Response: ' + JSON.stringify(data, null, 2));

                if (data.code === 200 || data.msg === '登陆成功') {
                    log('🎉 登录成功！');

                    const token = data.data.access_token || data.data.token;
                    localStorage.setItem(TOKEN_KEY, token);
                    localStorage.setItem('providence_user_id', data.data.user_id || data.data.id);
                    localStorage.setItem('providence_user_name', username);

                    showToast('登录成功');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    log('❌ 登录失败: ' + (data.message || data.msg));
                    showToast(data.message || data.msg || '登录失败');
                    btn.disabled = false;
                    btn.textContent = '登录';
                }
            } catch (error) {
                log('❌ 请求失败: ' + error.message);
                showToast('网络错误: ' + error.message);
                btn.disabled = false;
                btn.textContent = '登录';
            }
        }

        // 绑定事件
        document.getElementById('btnLogin').addEventListener('click', handleLogin);
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        // 初始化日志
        log('✅ 页面已加载');
        log('📍 API Base: ' + API_BASE);
        log('等待用户输入...');
    </script>
</body>

</html>
