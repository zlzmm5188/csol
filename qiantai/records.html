  <body class="page-other">
    <div id="app">
      <div class="nav-bar">
        <div class="nav-back" onclick="goBack()">‹</div>
        <div class="nav-title">交易记录</div>
      </div>
      <main class="content-white">
        <div class="records-filter">
          <button class="filter-btn active" data-filter="all">全部</button>
          <button class="filter-btn" data-filter="recharge">充值</button>
          <button class="filter-btn" data-filter="withdraw">提现</button>
          <button class="filter-btn" data-filter="income">收益</button>
          <button class="filter-btn" data-filter="expense">支出</button>
        </div>

        <div class="records-list" id="recordsList">
          <div class="loading-state" id="loadingState">
            <div class="loading-spinner"></div>
            <div class="loading-text">加载中...</div>
          </div>
        </div>

        <div class="load-more">
          <button class="btn-load-more" id="loadMoreBtn" style="display: none">
            加载更多
          </button>
        </div>

    <script src="ios-toast.js?v=1763897782"></script>
    <script>
      // ========== 导航函数 ==========
      function goBack() {
        window.history.back();
      }

      (function () {
          const API_BASE = window.API_CONFIG?.baseURL || 'https://api.4kp3l0iq.top';
          const TOKEN_KEY = 'providence_token';

          let currentFilter = 'all';
          let currentPage = 1;
          let hasMore = true;
          let isLoading = false;
          let allRecords = [];

          const recordsList = document.getElementById('recordsList');
          const loadMoreBtn = document.getElementById('loadMoreBtn');
          const loadingState = document.getElementById('loadingState');

          // 类型映射
          const typeMap = {
              'recharge': ['充值', '银行转账', 'USDT充值'],
              'withdraw': ['提现', '提现到银行卡'],
              'income': ['收益', '理财收益', '签到奖励', '日利宝收益'],
              'expense': ['支出', '申购', '购买']
          };

          // 图标映射
          const iconMap = {
              '充值': '📥',
              '提现': '💸',
              '收益': '💰',
              '理财收益': '💰',
              '签到奖励': '🎁',
              '申购': '🛒',
              '购买': '🛒',
              '日利宝': '💎',
              '转出': '💸',
              '转入': '📥'
          };

          // 初始化
          document.addEventListener('DOMContentLoaded', async function () {
              const token = localStorage.getItem(TOKEN_KEY);
              if (!token) {
                  await showToast('提示', '请先登录');
                  setTimeout(() => {
                      window.location.href = 'login.html';
                  }, 1500);
                  return;
              }

              await loadRecords();
              bindEvents();
          });

          // 绑定事件
          function bindEvents() {
              // 筛选按钮
              document.querySelectorAll('.filter-btn').forEach(btn => {
                  btn.addEventListener('click', function () {
                      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                      this.classList.add('active');
                      currentFilter = this.dataset.filter;
                      currentPage = 1;
                      filterRecords();
                  });
              });

              // 加载更多
              loadMoreBtn.addEventListener('click', async function () {
                  if (!isLoading && hasMore) {
                      currentPage++;
                      await loadRecords();
                  }
              });
          }

          // 加载交易记录
          async function loadRecords() {
              if (isLoading) return;

              isLoading = true;
              const token = localStorage.getItem(TOKEN_KEY);

              try {
                  if (currentPage === 1) {
                      loadingState.style.display = 'block';
                      recordsList.innerHTML = '';
                  }

                  // 使用统一的API客户端
                  const API_BASE = window.API_CONFIG?.baseURL || 'https://api.4kp3l0iq.top';
                  let data;

                  // 优先使用ApiClient
                  if (window.ApiClient && window.ApiClient.get) {
                      try {
                          const response = await window.ApiClient.get('/api/user/transaction/records', {
                              params: { page: currentPage, pageSize: 20 }
                          });
                          if (response && (response.code === 1 || response.code === 200)) {
                              data = response;
                          }
                      } catch (e) {
                          console.warn('[Records] ApiClient调用失败，使用fallback:', e);
                      }
                  }

                  // Fallback: 直接使用fetch
                  if (!data) {
                      const response = await fetch(`${API_BASE}/api/user/transaction/records?page=${currentPage}&pageSize=20`, {
                          method: 'GET',
                          headers: {
                              'Content-Type': 'application/json',
                              'Token': token,
                              'Authorization': `Bearer ${token}`
                          }
                      });

                      if (!response.ok) {
                          throw new Error(`HTTP错误: ${response.status}`);
                      }

                      const text = await response.text();

                      // 检查是否是HTML错误页面
                      if (text.trim().startsWith('<!DOCTYPE') || text.trim().startsWith('<html') || text.includes('系统发生错误') || text.includes('ThinkPHP')) {
                          loadingState.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div>服务器内部错误，请联系客服</div></div>';
                          return;
                      }

                      try {
                          data = JSON.parse(text);
                      } catch (e) {
                          loadingState.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div>数据格式错误</div></div>';
                          return;
                      }
                  }

                  if ((data.code === 1 || data.code === 200) && data.data && Array.isArray(data.data)) {
                      const newRecords = data.data;

                      if (currentPage === 1) {
                          allRecords = newRecords;
                      } else {
                          allRecords = allRecords.concat(newRecords);
                      }

                      hasMore = newRecords.length >= 20; // 每页20条

                      loadingState.style.display = 'none';
                      renderRecords();

                      if (hasMore) {
                          loadMoreBtn.style.display = 'block';
                      } else {
                          loadMoreBtn.style.display = 'none';
                      }
                  } else {
                      loadingState.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div>暂无交易记录</div></div>';
                      loadMoreBtn.style.display = 'none';
                  }
              } catch (error) {
                  console.error('❌ 加载交易记录失败:', error);
                  console.error('错误详情:', {
                      message: error.message,
                      stack: error.stack,
                      name: error.name
                  });
                  loadingState.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div>加载失败：' + error.message + '</div><div style="font-size: 12px; margin-top: 8px; opacity: 0.7;">请检查网络连接或联系客服</div></div>';
                  await showToast('错误', '加载失败：' + error.message);
              } finally {
                  isLoading = false;
              }
          }

          // 渲染记录
          function renderRecords() {
              if (allRecords.length === 0) {
                  recordsList.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div>暂无交易记录</div></div>';
                  return;
              }

              const filtered = currentFilter === 'all'
                  ? allRecords
                  : allRecords.filter(record => {
                      const typeName = record.type_name || record.remark || '';
                      const types = typeMap[currentFilter] || [];
                      return types.some(t => typeName.includes(t));
                  });

              if (filtered.length === 0) {
                  recordsList.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div>该类型暂无记录</div></div>';
                  return;
              }

              recordsList.innerHTML = filtered.map(record => {
                  const typeName = record.type_name || record.remark || '未知';
                  const amount = parseFloat(record.money || 0);
                  const isIncome = amount > 0;
                  const icon = getIcon(typeName);
                  const time = record.created_at || record.time || '';

                  return `
              <div class="record-item" data-type="${getRecordType(typeName)}">
                  <div class="record-icon">${icon}</div>
                  <div class="record-content">
                      <div class="record-title">${typeName}</div>
                      <div class="record-desc">${record.desc || record.remark || ''}</div>
                      <div class="record-time">${time}</div>
                  </div>
                  <div class="record-amount ${isIncome ? 'income' : 'outcome'}">
                      ${isIncome ? '+' : '-'}${Math.abs(amount).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                  </div>
              </div>
          `;
              }).join('');
          }

          // 筛选记录
          function filterRecords() {
              renderRecords();
          }

          // 获取图标
          function getIcon(typeName) {
              for (const [key, icon] of Object.entries(iconMap)) {
                  if (typeName.includes(key)) {
                      return icon;
                  }
              }
              return '💰';
          }

          // 获取记录类型
          function getRecordType(typeName) {
              if (typeName.includes('充值') || typeName.includes('转账')) return 'recharge';
              if (typeName.includes('提现')) return 'withdraw';
              if (typeName.includes('收益') || typeName.includes('奖励')) return 'income';
              return 'expense';
          }
      })();
    </script>
