<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <meta name="theme-color" content="#0a1020">
    <title>实名认证 - Providence</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
            background: linear-gradient(180deg, #0a1723 0%, #0d1d2b 40%, #08141f 100%);
            color: #e9eef6;
            display: flex;
            flex-direction: column;
        }

        .header {
            height: 50px;
            background: rgba(10, 23, 35, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            padding: 0 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            flex-shrink: 0;
        }

        .back-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: rgba(232,201,145,0.12);
            border: 1px solid rgba(232,201,145,0.25);
            color: #e8c991;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
        }

        .header-title {
            flex: 1;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-right: 32px;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 12px;
            max-width: 420px;
            margin: 0 auto;
            width: 100%;
            overflow: hidden;
        }

        .status-box {
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            text-align: center;
            flex-shrink: 0;
        }

        .status-box.pending {
            background: rgba(251,191,36,0.15);
            border: 1px solid rgba(251,191,36,0.3);
            color: #fbbf24;
        }

        .status-box.approved {
            background: rgba(34,197,94,0.15);
            border: 1px solid rgba(34,197,94,0.3);
            color: #22c55e;
        }

        .steps {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .step-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: all 0.3s;
        }

        .step-dot.active {
            width: 28px;
            border-radius: 5px;
            background: #e8c991;
        }

        .step-dot.done {
            background: #22c55e;
        }

        .card {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 16px;
            overflow: hidden;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            color: #e8c991;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .upload-area {
            height: 130px;
            position: relative;
            border: 2px dashed rgba(232,201,145,0.4);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(232,201,145,0.05);
            cursor: pointer;
            transition: all 0.3s;
            overflow: hidden;
            flex-shrink: 0;
        }

        .upload-area:active {
            transform: scale(0.98);
            background: rgba(232,201,145,0.1);
        }

        .upload-area.has-image {
            border-style: solid;
            border-color: #22c55e;
            background: rgba(34,197,94,0.08);
        }

        .upload-area.processing {
            border-color: #fbbf24;
            background: rgba(251,191,36,0.08);
        }

        .upload-icon { font-size: 36px; margin-bottom: 6px; }
        .upload-text { font-size: 14px; color: #e8c991; font-weight: 500; }
        .upload-hint { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 4px; }

        .preview-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        .preview-text {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #22c55e;
            background: rgba(0,0,0,0.6);
            padding: 3px 10px;
            border-radius: 10px;
        }

        .form-section {
            margin-top: 14px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .form-group { margin-bottom: 12px; flex-shrink: 0; }

        .form-label {
            display: block;
            font-size: 13px;
            color: rgba(255,255,255,0.8);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            font-size: 15px;
            background: rgba(255,255,255,0.08);
            color: #fff;
            -webkit-appearance: none;
        }

        .form-input:focus {
            outline: none;
            border-color: #e8c991;
        }

        .form-input::placeholder { color: rgba(255,255,255,0.4); }
        .form-input:read-only { background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.3); }
        .form-input.success { background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.3); }

        .face-box {
            flex: 1;
            min-height: 200px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .face-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .face-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140px;
            height: 180px;
            border: 3px dashed rgba(232,201,145,0.6);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .face-tip {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            color: #e8c991;
            padding: 8px 16px;
            border-radius: 16px;
            font-size: 13px;
        }

        .face-placeholder {
            flex: 1;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.05);
            border: 2px dashed rgba(232,201,145,0.3);
            border-radius: 12px;
            cursor: pointer;
        }

        .face-result {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .face-result img {
            width: 120px;
            height: 120px;
            border-radius: 60px;
            object-fit: cover;
            border: 3px solid #22c55e;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: auto;
            flex-shrink: 0;
        }

        .btn + .btn { margin-top: 10px; }

        .btn:active { transform: scale(0.98); }

        .btn-primary {
            background: linear-gradient(135deg, #e8c991 0%, #d4a855 100%);
            color: #0a1723;
        }

        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        .btn-green {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: #fff;
        }

        .hidden { display: none !important; }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(10,23,35,0.3);
            border-top-color: #0a1723;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }

        .spinner-white { border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; }

        @keyframes spin { to { transform: rotate(360deg); } }

        .processing-text { color: #fbbf24; font-size: 13px; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="profile.html" class="back-btn">‹</a>
        <div class="header-title">实名认证</div>
    </div>

    <div class="container">
        <div id="statusBox" class="status-box hidden"></div>

        <div class="steps">
            <div class="step-dot active" id="dot1"></div>
            <div class="step-dot" id="dot2"></div>
        </div>

        <!-- 步骤1: 上传身份证 + 填写信息（合并） -->
        <div id="step1" class="card">
            <div class="card-title">📄 上传身份证正面</div>

            <div id="uploadArea" class="upload-area">
                <div id="uploadPlaceholder">
                    <div class="upload-icon">🪪</div>
                    <div class="upload-text">点击上传身份证正面</div>
                    <div class="upload-hint">人像面，系统将自动识别</div>
                </div>
                <div id="uploadProcessing" class="hidden">
                    <div class="upload-icon">⏳</div>
                    <div class="upload-text">正在识别...</div>
                    <div class="processing-text"><span class="spinner spinner-white"></span>请稍候</div>
                </div>
                <div id="uploadPreview" class="hidden">
                    <img id="previewImg" class="preview-img">
                    <div class="preview-text">✓ 点击重新上传</div>
                </div>
            </div>

            <div class="form-section">
                <div class="form-group">
                    <label class="form-label">真实姓名</label>
                    <input type="text" id="realName" class="form-input" placeholder="请输入身份证上的姓名">
                </div>

                <div class="form-group">
                    <label class="form-label">身份证号</label>
                    <input type="text" id="idCard" class="form-input" placeholder="上传身份证后自动识别" maxlength="18" readonly>
                </div>
            </div>

            <button id="nextBtn1" class="btn btn-primary" disabled>下一步：人脸采集</button>
        </div>

        <!-- 步骤2: 人脸采集 -->
        <div id="step2" class="card hidden">
            <div class="card-title">👤 人脸采集</div>

            <div id="cameraBox" class="face-box hidden">
                <video id="faceVideo" class="face-video" autoplay playsinline></video>
                <div class="face-overlay"></div>
                <div class="face-tip">请将面部置于框内</div>
            </div>

            <div id="facePlaceholder" class="face-placeholder">
                <div class="upload-icon">📸</div>
                <div class="upload-text">点击开始人脸采集</div>
                <div class="upload-hint">需要使用前置摄像头</div>
            </div>

            <div id="faceResult" class="face-result hidden">
                <img id="faceImg">
                <div style="color:#22c55e;font-weight:600;margin-top:12px;font-size:15px;">✓ 人脸采集成功</div>
                <div style="color:rgba(255,255,255,0.5);font-size:12px;margin-top:4px;">点击图片重新拍摄</div>
            </div>

            <button id="captureBtn" class="btn btn-green hidden">📷 拍摄照片</button>
            <button id="submitBtn" class="btn btn-primary hidden">提交认证</button>
            <button class="btn btn-secondary" onclick="goStep(1)">返回上一步</button>
        </div>
    </div>

    <canvas id="canvas" style="display:none"></canvas>
    <input type="file" id="idCardFile" accept="image/*" style="display:none !important;">

    <script src="api-config.js?v=20251125"></script>
    <script src="ios-toast.js?v=20251125"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>

    <script>
        const API_BASE = window.API_CONFIG?.baseURL || 'https://api.4kp3l0iq.top';
        const TOKEN_KEY = window.API_CONFIG?.tokenKey || 'providence_token';

        let currentStep = 1;
        let idCardBase64 = null;
        let recognizedIdCard = null;
        let faceBase64 = null;
        let videoStream = null;
        let ocrWorker = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem(TOKEN_KEY);
            if (!token) {
                await showToast('提示', '请先登录');
                setTimeout(() => location.href = 'login.html', 1500);
                return;
            }

            checkStatus();

            const fileInput = document.getElementById('idCardFile');
            const uploadArea = document.getElementById('uploadArea');

            fileInput.addEventListener('change', handleFileSelect);
            uploadArea.addEventListener('click', () => fileInput.click());
            uploadArea.addEventListener('touchend', (e) => { e.preventDefault(); fileInput.click(); });

            document.getElementById('nextBtn1').addEventListener('click', validateAndGoStep2);
            document.getElementById('facePlaceholder').addEventListener('click', startCamera);
            document.getElementById('captureBtn').addEventListener('click', captureFace);
            document.getElementById('submitBtn').addEventListener('click', submitKYC);

            // 监听姓名输入，启用/禁用按钮
            document.getElementById('realName').addEventListener('input', checkFormValid);

            initOCR();
        });

        function checkFormValid() {
            const name = document.getElementById('realName').value.trim();
            const id = document.getElementById('idCard').value.trim();
            const btn = document.getElementById('nextBtn1');
            btn.disabled = !(name && id && id.length === 18);
        }

        async function initOCR() {
            try {
                ocrWorker = await Tesseract.createWorker('eng');
            } catch (e) {
                console.error('[OCR] 初始化失败:', e);
            }
        }

        async function checkStatus() {
            try {
                const token = localStorage.getItem(TOKEN_KEY);
                const res = await fetch(`${API_BASE}/api/user/kyc/status`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                if (data.code === 1 && data.data) {
                    const status = data.data.is_kyc;
                    const box = document.getElementById('statusBox');

                    if (status === 2) {
                        box.className = 'status-box approved';
                        box.innerHTML = `<div style="font-size:42px;margin-bottom:10px">✅</div>
                            <div style="font-size:18px;font-weight:600">实名认证已通过</div>
                            <div style="margin-top:8px;opacity:0.8;font-size:14px">姓名：${data.data.real_name || '***'}</div>
                            <div style="opacity:0.8;font-size:14px">身份证：${data.data.id_card || '***'}</div>`;
                        box.classList.remove('hidden');
                        document.getElementById('step1').classList.add('hidden');
                        document.querySelector('.steps').classList.add('hidden');
                    } else if (status === 1) {
                        box.className = 'status-box pending';
                        box.innerHTML = `<div style="font-size:42px;margin-bottom:10px">⏳</div>
                            <div style="font-size:18px;font-weight:600">审核中</div>
                            <div style="margin-top:8px;opacity:0.8;font-size:14px">您的实名认证正在审核中，请耐心等待</div>`;
                        box.classList.remove('hidden');
                        document.getElementById('step1').classList.add('hidden');
                        document.querySelector('.steps').classList.add('hidden');
                    }
                }
            } catch (e) {
                console.error('检查状态失败:', e);
            }
        }

        async function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                await showToast('错误', '请选择图片文件');
                return;
            }

            if (file.size > 10 * 1024 * 1024) {
                await showToast('错误', '图片大小不能超过10MB');
                return;
            }

            document.getElementById('uploadPlaceholder').classList.add('hidden');
            document.getElementById('uploadPreview').classList.add('hidden');
            document.getElementById('uploadProcessing').classList.remove('hidden');
            document.getElementById('uploadArea').classList.add('processing');
            document.getElementById('uploadArea').classList.remove('has-image');
            document.getElementById('idCard').value = '';
            document.getElementById('idCard').classList.remove('success');
            document.getElementById('nextBtn1').disabled = true;
            recognizedIdCard = null;

                const reader = new FileReader();
            reader.onload = async (evt) => {
                const img = new Image();
                img.onload = async () => {
                    const canvas = document.createElement('canvas');
                    // 压缩到最大1000px，质量75%（保证OCR识别效果）
                    const maxW = 1000;
                    let w = img.width, h = img.height;
                    if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
                    if (h > maxW) { w = Math.round(w * maxW / h); h = maxW; }
                    canvas.width = w;
                    canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);

                    idCardBase64 = canvas.toDataURL('image/jpeg', 0.75);
                    const idNumber = await recognizeIDCard(idCardBase64);

                    if (idNumber) {
                        recognizedIdCard = idNumber;
                        document.getElementById('idCard').value = idNumber;
                        document.getElementById('idCard').classList.add('success');
                        document.getElementById('previewImg').src = idCardBase64;
                        document.getElementById('uploadProcessing').classList.add('hidden');
                        document.getElementById('uploadPreview').classList.remove('hidden');
                        document.getElementById('uploadArea').classList.remove('processing');
                        document.getElementById('uploadArea').classList.add('has-image');
                        checkFormValid();
                    } else {
                        document.getElementById('uploadProcessing').classList.add('hidden');
                        document.getElementById('uploadPlaceholder').classList.remove('hidden');
                        document.getElementById('uploadArea').classList.remove('processing');
                        idCardBase64 = null;
                        e.target.value = '';
                        await showToast('识别失败', '未能识别到身份证号\n\n请重新上传清晰的身份证正面照片');
                    }
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function recognizeIDCard(imageData) {
            try {
                if (!ocrWorker) { ocrWorker = await Tesseract.createWorker('eng'); }
                const result = await ocrWorker.recognize(imageData);
                const text = result.data.text;
                const cleanText = text.replace(/[\s\n\r\-\.]/g, '');
                const matches = cleanText.match(/\d{17}[\dXx]|\d{18}/g);

                if (matches && matches.length > 0) {
                    const idNumber = matches[0].toUpperCase();
                    if (/^[1-9]\d{5}(18|19|20)\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])\d{3}[\dX]$/.test(idNumber)) {
                        return idNumber;
                    }
                }
                return null;
            } catch (e) {
                return null;
            }
        }

        function goStep(step) {
            if (currentStep === 2 && step !== 2) stopCamera();
            document.getElementById(`step${currentStep}`).classList.add('hidden');
            document.getElementById(`step${step}`).classList.remove('hidden');

            document.getElementById('dot1').classList.remove('active', 'done');
            document.getElementById('dot2').classList.remove('active', 'done');

            if (step === 1) {
                document.getElementById('dot1').classList.add('active');
            } else {
                document.getElementById('dot1').classList.add('done');
                document.getElementById('dot2').classList.add('active');
            }

            currentStep = step;
        }

        async function validateAndGoStep2() {
            const name = document.getElementById('realName').value.trim();
            const id = document.getElementById('idCard').value.trim().toUpperCase();

            if (!name) { await showToast('提示', '请输入真实姓名'); return; }
            if (!id || id.length !== 18) { await showToast('提示', '请上传身份证以识别身份证号'); return; }
            if (!/^[1-9]\d{5}(18|19|20)\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])\d{3}[\dXx]$/.test(id)) {
                await showToast('提示', '身份证号格式不正确'); return;
            }
            goStep(2);
        }

        async function startCamera() {
            try {
                const video = document.getElementById('faceVideo');
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: 640, height: 480 }
                });
                video.srcObject = videoStream;

                document.getElementById('facePlaceholder').classList.add('hidden');
                document.getElementById('cameraBox').classList.remove('hidden');
                document.getElementById('captureBtn').classList.remove('hidden');
                document.getElementById('faceResult').classList.add('hidden');
                document.getElementById('submitBtn').classList.add('hidden');
            } catch (e) {
                await showToast('摄像头错误', '无法启动摄像头\n请检查权限设置');
            }
        }

        function stopCamera() {
            if (videoStream) { videoStream.getTracks().forEach(t => t.stop()); videoStream = null; }
        }

        async function captureFace() {
            const video = document.getElementById('faceVideo');
            const canvas = document.getElementById('canvas');
            // 压缩人脸照片到最大480px
            const maxW = 480;
            let w = video.videoWidth, h = video.videoHeight;
            if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(video, 0, 0, w, h);

            faceBase64 = canvas.toDataURL('image/jpeg', 0.7);
            stopCamera();

            document.getElementById('cameraBox').classList.add('hidden');
            document.getElementById('captureBtn').classList.add('hidden');
            document.getElementById('faceResult').classList.remove('hidden');
            document.getElementById('faceImg').src = faceBase64;
            document.getElementById('submitBtn').classList.remove('hidden');

            document.getElementById('faceResult').onclick = () => {
                faceBase64 = null;
                document.getElementById('faceResult').classList.add('hidden');
                document.getElementById('submitBtn').classList.add('hidden');
                document.getElementById('facePlaceholder').classList.remove('hidden');
            };
        }

        async function submitKYC() {
            const name = document.getElementById('realName').value.trim();
            const id = document.getElementById('idCard').value.trim().toUpperCase();

            if (!idCardBase64 || !faceBase64 || !name || !id) {
                await showToast('提示', '请完成所有认证步骤');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>提交中...';

            try {
                const token = localStorage.getItem(TOKEN_KEY);

                // 检查数据大小
                const payload = JSON.stringify({
                    real_name: name,
                    id_card: id,
                    id_card_front: idCardBase64,
                    face_photo: faceBase64
                });
                const sizeKB = Math.round(payload.length / 1024);
                console.log('[KYC] 提交数据大小:', sizeKB, 'KB');

                if (sizeKB > 6000) {
                    await showToast('提示', '照片过大，请重新拍摄');
                    btn.disabled = false;
                    btn.textContent = '提交认证';
                    return;
                }

                const res = await fetch(`${API_BASE}/api/user/kyc/submit`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: payload
                });

                // 检查响应状态
                if (!res.ok) {
                    console.error('[KYC] HTTP错误:', res.status);
                    if (res.status === 413) {
                        await showToast('提交失败', '照片文件过大，请重新拍摄');
                    } else if (res.status === 401) {
                        await showToast('登录过期', '请重新登录');
                        setTimeout(() => location.href = 'login.html', 1500);
                    } else {
                        await showToast('提交失败', `服务器错误(${res.status})`);
                    }
                    btn.disabled = false;
                    btn.textContent = '提交认证';
                    return;
                }

                const text = await res.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    console.error('[KYC] 响应解析失败:', text.substring(0, 200));
                    await showToast('提交失败', '服务器响应异常');
                    btn.disabled = false;
                    btn.textContent = '提交认证';
                    return;
                }

                if (data.code === 1) {
                    await showToast('提交成功', '实名认证已提交\n请耐心等待审核');
                    setTimeout(() => location.href = 'profile.html', 2000);
                } else {
                    await showToast('提交失败', data.msg || '请重试');
                    btn.disabled = false;
                    btn.textContent = '提交认证';
                }
            } catch (e) {
                console.error('[KYC] 提交异常:', e);
                await showToast('网络错误', '请检查网络连接后重试\n' + e.message);
                btn.disabled = false;
                btn.textContent = '提交认证';
            }
        }
    </script>
</body>
</html>
