    <script>
        // ========== 导航函数 ==========
        function goBack() {
            window.history.back();
        }

        // 使用 config.js 中的 API 配置
        const API_BASE = window.API_CONFIG?.baseURL || 'https://api.4kp3l0iq.top';
        const TOKEN_KEY = window.API_CONFIG?.tokenKey || 'providence_token';
        let currentBindType = ''; // 'bank' 或 'usdt'
        let hasPayPassword = false; // 用户是否已设置支付密码

        // 使用全局iOS弹窗组件（通过ios-toast.js）

        // 检查用户是否已设置支付密码
        async function checkPayPasswordStatus() {
            try {
                const token = localStorage.getItem(TOKEN_KEY);
                if (!token) return;

                const response = await fetch(`${API_BASE}/user/info`, {
                    method: 'GET',
                    headers: { 'token': token }
                });

                if (response.ok) {
                    const result = await response.json();
                    if (result.code === 1 || result.code === 200) {
                        // 注意：后端不返回trade_password字段（安全考虑）
                        // 我们通过尝试绑定时的错误来判断，或者假设用户已设置
                        // 这里简化处理：如果用户信息正常返回，假设可能已设置
                        // 实际状态由后端在绑定时判断
                        const pwdInput = document.getElementById('pwd');
                        const pwdLabel = document.getElementById('payPasswordLabel');
                        const pwdHint = document.getElementById('payPasswordHint');

                        if (pwdInput && pwdLabel && pwdHint) {
                            // 默认显示"验证支付密码"（因为大多数用户已设置）
                            // 如果未设置，后端会返回错误提示
                            pwdInput.placeholder = '请输入支付密码（6位数字）';
                            pwdLabel.textContent = '支付密码';
                            pwdHint.textContent = '首次绑定将自动设置支付密码，已设置则验证密码';
                        }
                    }
                }
            } catch (error) {
                console.error('检查支付密码状态失败:', error);
            }
        }

        // 加载银行卡列表
        async function loadBankCards() {
            const loadingState = document.getElementById('loadingState');
            const cardsList = document.getElementById('cardsList');

            try {
                const token = localStorage.getItem(TOKEN_KEY);
                if (!token) {
                    loadingState.innerHTML = '<div class="empty-state">请先登录</div>';
                    return;
                }

                // 优先使用ApiClient
                let data = null;
                if (window.ApiClient && window.ApiClient.get) {
                    try {
                        const response = await window.ApiClient.get('/api/user/bank/list');
                        if (response && (response.code === 1 || response.code === 200)) {
                            data = response;
                        }
                    } catch (e) {
                        console.warn('[BankCards] ApiClient调用失败，使用fallback:', e);
                    }
                }

                // Fallback: 直接使用fetch
                if (!data) {
                    const response = await fetch(`${API_BASE}/api/user/bank/list`, {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                            'Token': token,
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP错误: ${response.status}`);
                    }

                    const text = await response.text();

                    // 检查是否是HTML错误页面
                    if (text.trim().startsWith('<!DOCTYPE') || text.trim().startsWith('<html') || text.includes('系统发生错误') || text.includes('ThinkPHP')) {
                        loadingState.innerHTML = '<div class="empty-state">暂无绑定记录</div>';
                        return;
                    }

                    try {
                        data = JSON.parse(text);
                    } catch (e) {
                        loadingState.innerHTML = '<div class="empty-state">暂无绑定记录</div>';
                        return;
                    }
                }

                if ((data.code === 1 || data.code === 200) && data.data) {
                    const cards = Array.isArray(data.data) ? data.data : (data.data.cards || []);
                    if (cards.length > 0) {
                        loadingState.style.display = 'none';
                        renderBankCards(cards);
                    } else {
                        loadingState.innerHTML = '<div class="empty-state">暂无绑定记录</div>';
                    }
                } else {
                    loadingState.innerHTML = '<div class="empty-state">暂无绑定记录</div>';
                }
            } catch (error) {
                console.error('❌ 加载银行卡列表失败:', error);
                console.warn('📌 接口暂未开放，显示空状态');
                // 网络错误或接口不可用，优雅降级
                loadingState.innerHTML = '<div class="empty-state">暂无绑定记录</div>';
            }
        }

        // 渲染银行卡列表
        function renderBankCards(cards) {
            const cardsList = document.getElementById('cardsList');
            cardsList.innerHTML = '';

            cards.forEach(card => {
                const cardItem = document.createElement('div');
                cardItem.className = 'bank-card-item' + (card.type === 1 ? ' primary' : '');
                cardItem.innerHTML = `
            <div class="card-bank">${card.btype || '未设置'}</div>
            ${card.card ? `<div class="card-number">${card.card}</div>` : ''}
            ${card.usdt_address ? `<div class="card-usdt">USDT: ${card.usdt_address}</div>` : ''}
            <div class="card-holder">${card.branch || ''}</div>
            ${card.type === 1 ? '<div class="card-badge">默认</div>' : ''}
            <div class="card-actions">
                ${card.can_modify ? `
                    <button class="card-action-btn unbind-btn" data-card-id="${card.id}">解绑</button>
                ` : `
                    <span class="card-action-hint">已锁定，联系客服换绑</span>
                `}
            </div>
        `;
                cardsList.appendChild(cardItem);
            });

            // 绑定解绑事件
            document.querySelectorAll('.unbind-btn').forEach(btn => {
                btn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    const cardId = this.dataset.cardId;
                    unbindCard(cardId);
                });
            });
        }

        // 解绑银行卡
        async function unbindCard(cardId) {
            const confirmed = await showConfirm('确认解绑', '确认解绑该银行卡/USDT地址？');
            if (!confirmed) return;

            try {
                const token = localStorage.getItem(TOKEN_KEY);
                // 优先使用ApiClient
                let data = null;
                if (window.ApiClient && window.ApiClient.post) {
                    try {
                        const response = await window.ApiClient.post('/api/user/bank/del', { id: cardId });
                        if (response && (response.code === 1 || response.code === 200)) {
                            data = response;
                        }
                    } catch (e) {
                        console.warn('[BankCards] ApiClient解绑失败，使用fallback:', e);
                    }
                }

                // Fallback: 直接使用fetch
                if (!data) {
                    const response = await fetch(`${API_BASE}/api/user/bank/del`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Token': token,
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ id: cardId })
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP错误: ${response.status}`);
                    }

                    const text = await response.text();

                    // 检查是否是HTML错误页面
                    if (text.trim().startsWith('<!DOCTYPE') || text.trim().startsWith('<html') || text.includes('系统发生错误') || text.includes('ThinkPHP')) {
                        await showToast('错误', '服务器内部错误，请联系客服');
                        return;
                    }

                    try {
                        data = JSON.parse(text);
                    } catch (e) {
                        await showToast('错误', '服务器返回格式错误，请重试或联系客服');
                        return;
                    }
                }

                if (data.code === 1 || (typeof data.message === 'string' && data.message.includes('成功'))) {
                    await showToast('成功', '银行卡/USDT地址已解绑');
                    loadBankCards();
                } else {
                    await showToast('错误', data.msg || '解绑失败，请重试');
                }
            } catch (error) {
                console.error('❌ 解绑失败:', error);
                await showToast('错误', '网络错误：' + error.message + '\n\n请检查网络连接后重试');
            }
        }

        // 显示选择类型模态框
        function showTypeSelectModal() {
            document.getElementById('typeSelectModal').style.display = 'flex';
        }

        // 隐藏选择类型模态框
        function hideTypeSelectModal() {
            document.getElementById('typeSelectModal').style.display = 'none';
        }

        // 显示添加表单模态框
        function showAddModal(type) {
            currentBindType = type;
            const modalTitle = document.getElementById('modalTitle');
            const bankForm = document.getElementById('bankForm');
            const usdtForm = document.getElementById('usdtForm');

            if (type === 'bank') {
                modalTitle.textContent = '添加银行卡';
                bankForm.style.display = 'block';
                usdtForm.style.display = 'none';
                document.getElementById('card').required = true;
                document.getElementById('usdt_address').required = false;
            } else if (type === 'usdt') {
                modalTitle.textContent = '添加USDT地址';
                bankForm.style.display = 'none';
                usdtForm.style.display = 'block';
                document.getElementById('card').required = false;
                document.getElementById('usdt_address').required = true;
            }

            document.getElementById('addCardModal').style.display = 'flex';
        }

        // 隐藏添加表单模态框
        function hideAddModal() {
            document.getElementById('addCardModal').style.display = 'none';
            document.getElementById('addCardForm').reset();
            currentBindType = '';
        }

        // USDT地址验证
        function validateUsdtAddress(address) {
            if (!address) return true; // 可选

            const trimmed = address.trim();

            // 长度检查
            if (trimmed.length < 26 || trimmed.length > 65) {
                return false;
            }

            // TRC20格式
            if (/^T[A-Za-z1-9]{33}$/.test(trimmed)) {
                return true;
            }

            // ERC20/BEP20格式
            if (/^0x[a-fA-F0-9]{40}$/.test(trimmed)) {
                return true;
            }

            // Base58格式
            if (/^[123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz]{26,35}$/.test(trimmed)) {
                return true;
            }

            // 宽松验证
            return /^[A-Za-z0-9]{26,65}$/.test(trimmed);
        }

        // 提交表单
        document.getElementById('addCardForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const accountName = document.getElementById('accountName')?.value?.trim() || '';
            const branch = document.getElementById('branch').value.trim();
            const btype = document.getElementById('btype').value.trim();
            const card = document.getElementById('card').value.trim();
            const usdtAddress = document.getElementById('usdt_address').value.trim();
            const pwd = document.getElementById('pwd').value.trim();

            // 验证：根据类型验证必填项
            if (currentBindType === 'bank') {
                if (!accountName) {
                    await showToast('请输入持卡人姓名', '持卡人姓名不能为空');
                    return;
                }
                if (!btype) {
                    await showToast('请输入银行名称', '银行名称不能为空');
                    return;
                }
                if (!card) {
                    await showToast('请输入银行卡号', '银行卡号不能为空');
                    return;
                }
            }

            if (currentBindType === 'usdt' && !usdtAddress) {
                await showToast('请输入USDT地址', 'USDT地址不能为空');
                return;
            }

            // 验证USDT地址格式
            if (currentBindType === 'usdt' && usdtAddress && !validateUsdtAddress(usdtAddress)) {
                await showToast('USDT地址格式不正确', '请输入有效的虚拟货币钱包地址（支持TRC20、ERC20、BEP20等）');
                return;
            }

            // 验证支付密码
            if (!pwd || pwd.length !== 6 || !/^\d{6}$/.test(pwd)) {
                await showToast('支付密码错误', '请输入6位数字支付密码');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '绑定中...';

            try {
                const token = localStorage.getItem(TOKEN_KEY);
                let apiPath, bodyData;

                if (currentBindType === 'bank') {
                    apiPath = '/api/user/bank/add';
                    bodyData = {
                        account_name: accountName || '',  // 持卡人姓名（必须与实名一致）
                        card_number: card || '',
                        bank_name: btype || '',           // 银行名称（如：中国银行）
                        account_branch: branch || '',     // 开户行支行
                        pay_password: pwd
                    };
                } else {
                    apiPath = '/api/user/bank/add';  // USDT地址也使用同一接口
                    bodyData = {
                        address: usdtAddress || '',
                        chain_type: 'TRC20',
                        pay_password: pwd,
                        card_type: 'usdt'
                    };
                }

                // 优先使用ApiClient
                let data = null;
                if (window.ApiClient && window.ApiClient.post) {
                    try {
                        const response = await window.ApiClient.post(apiPath, bodyData);
                        if (response && (response.code === 1 || response.code === 200 || response.code === 0)) {
                            data = response;
                        }
                    } catch (e) {
                        console.warn('[BankCards] ApiClient绑定失败，使用fallback:', e);
                    }
                }

                // Fallback: 直接使用fetch
                if (!data) {
                    const response = await fetch(`${API_BASE}${apiPath}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Token': token,
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(bodyData)
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP错误: ${response.status}`);
                    }

                    const text = await response.text();

                    // 检查是否是HTML错误页面
                    if (text.trim().startsWith('<!DOCTYPE') || text.trim().startsWith('<html') || text.includes('系统发生错误') || text.includes('ThinkPHP')) {
                        await showToast('错误', '服务器内部错误，请联系客服');
                        return;
                    }

                    try {
                        data = JSON.parse(text);
                    } catch (e) {
                        await showToast('错误', '服务器返回格式错误，请重试或联系客服');
                        return;
                    }
                }

                if (data.code === 0 || data.code === 1 || (typeof data.msg === 'string' && data.msg.includes('成功'))) {
                    await showToast('成功', '绑定成功\n如需换绑请联系客服');
                    hideAddModal();
                    loadBankCards();
                } else {
                    // 处理需要实名认证的情况
                    if (data.data && data.data.need_kyc) {
                        const goKyc = confirm(data.msg + '\n\n是否前往实名认证？');
                        if (goKyc) {
                            window.location.href = 'kyc-verification.html';
                        }
                    } else if (data.data && data.data.realname_hint) {
                        // 姓名不一致时显示提示
                        await showToast('姓名不一致', data.msg + '\n\n您的实名姓名：' + data.data.realname_hint);
                    } else {
                        await showToast('错误', data.msg || '绑定失败，请重试');
                    }
                }
            } catch (error) {
                console.error('❌ 绑定失败:', error);
                await showToast('错误', '网络错误：' + error.message + '\n\n请检查网络连接后重试');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '确认绑定';
            }
        });

        // 选择类型事件
        document.querySelectorAll('.type-option').forEach(option => {
            option.addEventListener('click', function () {
                const type = this.dataset.type;
                hideTypeSelectModal();
                showAddModal(type);
            });
        });

        // 绑定事件
        document.getElementById('addCardMainBtn').addEventListener('click', function (e) {
            e.preventDefault();
            showTypeSelectModal();
        });

        document.getElementById('closeTypeModal').addEventListener('click', hideTypeSelectModal);
        document.getElementById('closeModal').addEventListener('click', hideAddModal);
        document.getElementById('cancelBtn').addEventListener('click', hideAddModal);

        // 点击模态框外部关闭
        document.getElementById('typeSelectModal').addEventListener('click', function (e) {
            if (e.target === this) {
                hideTypeSelectModal();
            }
        });

        document.getElementById('addCardModal').addEventListener('click', function (e) {
            if (e.target === this) {
                hideAddModal();
            }
        });

        // 页面加载时获取银行卡列表和支付密码状态
        loadBankCards();

        // 打开绑定弹窗时，重新检查支付密码状态
        document.getElementById('addCardBtn')?.addEventListener('click', function() {
            checkPayPasswordStatus();
        });
    </script>
    <!-- 支付密码验证弹窗 -->
    <div class="popup-overlay" id="passwordModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 200; align-items: flex-end;">
        <div class="popup-content" style=" max-height: 28vh; background: #fff; border-radius: 20px 20px 0 0; padding: 24px 20px; animation: rise 0.35s ease;">
            <div class="popup-title" style="font-size: 18px; font-weight: 700; color: #2F3847;  margin-bottom: 20px;">输入支付密码</div>
            <input type="tel" class="password-input" id="verifyPassword" placeholder="请输入6位支付密码" maxlength="6" inputmode="numeric" style=" height: 56px; padding: 0 20px; background: #F8F6F2; border: 2px solid #D4C9B8; border-radius: 16px; font-size: 20px; font-weight: 600; color: #2F3847;  letter-spacing: 6px; outline: none; margin-bottom: 16px;" />
            <button class="submit-btn" onclick="verifyAndSubmit()" style=" height: 56px; background: linear-gradient(135deg, #F3D49A, #E2B76A); border: none; border-radius: 28px; font-size: 17px; font-weight: 700; color: #2B1B05; cursor: pointer;">确认绑定</button>
        </div>
    </div>
    <script>
    function showPasswordModal() {
        const modal = document.getElementById("passwordModal");
        if (modal) {
            modal.style.display = "flex";
            document.getElementById("verifyPassword").focus();
        }
    }
    function verifyAndSubmit() {
        const pwd = document.getElementById("verifyPassword").value;
        if (!pwd || pwd.length !== 6) {
            showToast("请输入6位支付密码");
            return;
        }
        submitBankCard(pwd);
    }
    </script>

</body>
