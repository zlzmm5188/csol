    <script src="api-new.js?v=1763813622"></script>

    <script>
      // Providence 日利宝页面 - API对接修复
      // 移除所有硬编码数据，使用真实API

      // 全局数据（ribaoData在下面定义，这里不重复声明）
      let userData = null;

      // 初始化
      async function init() {
        console.log("💰 日利宝页面初始化");

        // 等待API加载
        await waitForAPI();

        // 加载数据
        await loadRibaoData();
        await loadUserData();
      }

      // 等待API配置加载
      function waitForAPI() {
        return new Promise((resolve) => {
          if (window.API && window.API_CONFIG) {
            resolve();
          } else {
            const check = setInterval(() => {
              if (window.API && window.API_CONFIG) {
                clearInterval(check);
                resolve();
              }
            }, 50);
            setTimeout(() => {
              clearInterval(check);
              resolve();
            }, 3000);
          }
        });
      }

      // 加载日利宝数据
      // 修复：切换币种时更新所有按钮的class
      function updateButtonColors(currency) {
        const allButtons = document.querySelectorAll(
          ".action-btn, .quick-amount"
        );
        const section = document.querySelector(".section");

        if (currency === "USDT") {
          allButtons.forEach((btn) => {
            btn.classList.remove("cny-mode");
            btn.classList.add("usdt-mode");
          });
          if (section) {
            section.classList.add("usdt-mode");
          }
        } else {
          allButtons.forEach((btn) => {
            btn.classList.remove("usdt-mode");
            btn.classList.add("cny-mode");
          });
          if (section) {
            section.classList.remove("usdt-mode");
          }
        }
      }

      // 在selectCurrency函数中调用
      const originalSelectCurrency = window.selectCurrency;
      window.selectCurrency = function (currency) {
        if (originalSelectCurrency) {
          originalSelectCurrency(currency);
        }
        updateButtonColors(currency);
      };

      // 页面加载时初始化
      let currentCurrency = "CNY";
      let transferAmount = 0;
      // 后端返回单一对象，不是CNY/USDT分离
      let ribaoData = {
        balance: 0,              // 账户余额
        ribao_balance: 0,        // 日利宝余额
        ribao_total_profit: 0,  // 累计收益
        ribao_yesterday_profit: 0, // 昨日收益（显示为今日收益）
        expected_profit: 0,     // 预计明日收益
        daily_rate: 0.001,       // 日收益率
        min_amount: 100,         // 最低转入金额
        max_amount: 1000000,      // 最高转入金额
        is_enabled: true          // 是否启用
      };

      // 返回和跳转函数
      function goBack() {
        window.history.back();
      }

      function goHistory() {
        window.location.href = 'ribao-history.html';
      }

      document.addEventListener("DOMContentLoaded", function () {
        // 检查登录状态（新版本token检查）
        if (!ApiService.auth.requireLogin()) return;

        // 初始化为CNY金色模式
        updateColorMode("CNY");

        loadRibaoData();
        loadRates();
        loadUserBalance(); // 加载用户钱包余额
      });

      async function loadRibaoData() {
        try {
          // 优先使用ApiService封装（来自config.js）
          let result = null;
          if (window.ApiService && window.ApiService.ribao && window.ApiService.ribao.getInfo) {
            try {
              const data = await window.ApiService.ribao.getInfo();
              if (data && (data.balance !== undefined || data.ribao_balance !== undefined)) {
                result = { code: 1, data: data };
              }
            } catch (apiError) {
              console.warn('ApiService调用失败，使用fallback:', apiError);
            }
          }

          // Fallback: 直接使用fetch
          if (!result) {
            const API_BASE = window.API_CONFIG?.baseURL || 'https://api.4kp3l0iq.top/api';
            const url = `${API_BASE}/user/api/ribao/info`;
            const token = localStorage.getItem("providence_token") || localStorage.getItem("token") || "";

            console.log('[日利宝] 使用fetch请求:', url);
            console.log('[日利宝] Token:', token ? token.substring(0, 10) + '...' : '未找到');

            try {
              const res = await fetch(url, {
                method: "GET",
                headers: {
                  "Content-Type": "application/json",
                  token: token,
                },
              });

              console.log('[日利宝] 响应状态:', res.status, res.statusText);

              if (!res.ok) {
                const errorText = await res.text();
                console.error('[日利宝] HTTP错误响应:', errorText.substring(0, 200));
                throw new Error(`HTTP ${res.status}: ${res.statusText}`);
              }

              const text = await res.text();
              console.log('[日利宝] 响应内容:', text.substring(0, 200));

              if (!text || text.trim().startsWith('<')) {
                console.error('[日利宝] 服务器返回了HTML而不是JSON');
                throw new Error('服务器返回了HTML而不是JSON，可能是路由配置问题');
              }

              try {
                result = JSON.parse(text);
              } catch (parseError) {
                console.error('[日利宝] JSON解析失败:', parseError, '响应内容:', text.substring(0, 200));
                throw new Error('响应格式错误，无法解析JSON');
              }
            } catch (fetchError) {
              console.error('[日利宝] Fetch请求失败:', fetchError);
              // 如果是网络错误，提供更友好的提示
              if (fetchError.message.includes('Failed to fetch') || fetchError.message.includes('NetworkError')) {
                throw new Error('网络连接失败，请检查网络设置或稍后重试');
              }
              throw fetchError;
            }
          }

          console.log('[日利宝] API响应:', result);

          if (result.code === 1 && result.data) {
            // 后端返回单一对象，直接赋值
            ribaoData.balance = parseFloat(result.data.balance || 0);
            ribaoData.ribao_balance = parseFloat(result.data.ribao_balance || 0);
            ribaoData.ribao_total_profit = parseFloat(result.data.ribao_total_profit || 0);
            ribaoData.ribao_yesterday_profit = parseFloat(result.data.ribao_yesterday_profit || 0);
            ribaoData.expected_profit = parseFloat(result.data.expected_profit || 0);
            ribaoData.daily_rate = parseFloat(result.data.daily_rate || 0.001);
            ribaoData.min_amount = parseFloat(result.data.min_amount || 100);
            ribaoData.max_amount = parseFloat(result.data.max_amount || 1000000);
            ribaoData.is_enabled = result.data.is_enabled !== false;

            console.log('[日利宝] 解析后的数据:', {
              balance: ribaoData.balance,
              ribao_balance: ribaoData.ribao_balance,
              ribao_total_profit: ribaoData.ribao_total_profit,
              ribao_yesterday_profit: ribaoData.ribao_yesterday_profit,
              expected_profit: ribaoData.expected_profit,
              daily_rate: ribaoData.daily_rate
            });

            updateDisplay();
          } else {
            console.error("[日利宝] 加载数据失败:", result.message || result.msg);
            showToast("", result.message || result.msg || "加载失败");
          }
        } catch (e) {
          console.error("加载日利宝数据失败:", e);
          showToast("", "加载失败，请刷新重试");
        }
      }

      // 收益率已经在loadRibaoData中加载，不再需要单独加载
      function loadRates() {
        updateRateDisplay();
      }

      function switchCurrency(currency) {
        currentCurrency = currency;

        // 移除所有active类
        document.querySelectorAll(".currency-tab").forEach((tab) => {
          tab.classList.remove("active");
        });

        // 为当前选中的tab添加active类
        document
          .querySelector(`.currency-tab[data-currency="${currency}"]`)
          .classList.add("active");

        // 动态切换所有按钮的颜色模式
        updateColorMode(currency);

        updateDisplay();
        updateRateDisplay();
      }

      function updateColorMode(currency) {
        const modeClass = currency === "CNY" ? "cny-mode" : "usdt-mode";
        const removeClass = currency === "CNY" ? "usdt-mode" : "cny-mode";

        // 更新标题颜色
        const heroTitle = document.getElementById("heroTitle");
        if (heroTitle) {
          heroTitle.classList.remove(removeClass);
          heroTitle.classList.add(modeClass);
        }

        // 更新KPI卡片边框和金额颜色
        document.querySelectorAll(".kpi").forEach((kpi) => {
          kpi.classList.remove(removeClass);
          kpi.classList.add(modeClass);
        });

        // 更新收益说明框边框
        const tipsBox = document.getElementById("tipsBox");
        if (tipsBox) {
          tipsBox.classList.remove(removeClass);
          tipsBox.classList.add(modeClass);
        }

        // 更新转入/转出tab按钮
        document.querySelectorAll(".tab-btn").forEach((btn) => {
          btn.classList.remove(removeClass);
          btn.classList.add(modeClass);
        });

        // 更新确认按钮
        document.querySelectorAll(".submit-btn").forEach((btn) => {
          btn.classList.remove(removeClass);
          btn.classList.add(modeClass);
        });

        // 更新快捷金额按钮
        document.querySelectorAll(".quick-btn").forEach((btn) => {
          btn.classList.remove(removeClass);
          btn.classList.add(modeClass);
        });

        // 更新密码输入框
        const passwordInput = document.getElementById("payPassword");
        if (passwordInput) {
          passwordInput.classList.remove(removeClass);
          passwordInput.classList.add(modeClass);
        }

        // 更新弹窗内容
        const popupContent = document.getElementById("popupContent");
        if (popupContent) {
          popupContent.classList.remove(removeClass);
          popupContent.classList.add(modeClass);
        }
      }

      function updateDisplay() {
        // 后端返回单一对象，所有币种共用同一数据
        const precision = currentCurrency === "USDT" ? 4 : 2;
        const symbol = currentCurrency === "USDT" ? "$" : "¥";
        document.getElementById("ribaoBalance").textContent =
          symbol + ribaoData.ribao_balance.toFixed(precision);
        document.getElementById("todayEarnings").textContent =
          symbol + ribaoData.ribao_yesterday_profit.toFixed(precision);
        document.getElementById("totalEarnings").textContent =
          symbol + ribaoData.ribao_total_profit.toFixed(precision);
      }

      function updateRateDisplay() {
        const rate = (ribaoData.daily_rate * 100).toFixed(2);
        document.getElementById("rateIn").textContent = rate + "%";
        const currencyName = currentCurrency === "CNY" ? "人民币" : "USDT";
        document.getElementById("rateTip").textContent =
          `${currencyName}日收益率：${rate}%`;
      }

      function switchTab(tab) {
        currentTab = tab;
        document
          .querySelectorAll(".tab-btn")
          .forEach((btn) => btn.classList.remove("active"));
        document
          .querySelectorAll(".form-area")
          .forEach((area) => area.classList.remove("active"));

        const modeClass = currentCurrency === "CNY" ? "cny-mode" : "usdt-mode";

        if (tab === "in") {
          const btn = document.querySelector(".tab-btn:first-child");
          btn.classList.add("active");
          btn.classList.add(modeClass);
          document.getElementById("formIn").classList.add("active");
        } else {
          const btn = document.querySelector(".tab-btn:last-child");
          btn.classList.add("active");
          btn.classList.add(modeClass);
          document.getElementById("formOut").classList.add("active");
        }
      }

      function quickAmount(type, value) {
        const input =
          type === "in"
            ? document.getElementById("amountIn")
            : document.getElementById("amountOut");
        if (value === "all") {
          const precision = currentCurrency === "USDT" ? 4 : 2;
          if (type === "in") {
            // 转入时显示账户余额
            input.value = ribaoData.balance.toFixed(precision);
          } else {
            // 转出时显示日利宝余额
            input.value = ribaoData.ribao_balance.toFixed(precision);
          }
        } else {
          input.value = value;
        }
      }

      function confirmTransfer(type) {
        const input =
          type === "in"
            ? document.getElementById("amountIn")
            : document.getElementById("amountOut");
        const amount = parseFloat(input.value);

        if (!amount || amount <= 0) {
          showToast("", "请输入有效金额");
          return;
        }

        if (type === "in") {
          // 检查转入金额最低限制（使用后端返回的min_amount）
          const minAmount = ribaoData.min_amount || 100;
          if (amount < minAmount) {
            showToast("", `转入金额最低${minAmount}元起`);
            return;
          }

          // 检查用户余额是否足够
          const userBalance = getUserBalance(currentCurrency);
          if (amount > userBalance) {
            showToast(
              "",
              `${currentCurrency === "CNY" ? "人民币" : "USDT"}余额不足`
            );
            return;
          }
        }

        if (type === "out") {
          if (amount > ribaoData.ribao_balance) {
            showToast("", "日利宝余额不足");
            return;
          }
          // 检查转出金额最低限制
          const minAmount = ribaoData.min_amount || 100;
          if (amount < minAmount) {
            showToast("", `转出金额最低${minAmount}元起`);
            return;
          }
        }

        transferAmount = amount;
        // 保存当前操作类型，用于submitTransfer函数
        window.currentTransferType = type;
        document.getElementById("passwordPopup").classList.add("show");
        setTimeout(() => {
          document.getElementById("payPassword").focus();
        }, 300);
      }

      // 获取用户钱包余额（需要从API加载）
      let userBalances = {
        CNY: 0,
        USDT: 0,
      };

      function getUserBalance(currency) {
        return userBalances[currency] || 0;
      }

      // 在页面加载时获取用户余额
      async function loadUserBalance() {
        try {
          // 优先使用ApiService封装（来自config.js）
          let result = null;
          if (window.ApiService && window.ApiService.finance && window.ApiService.finance.getUserBalance) {
            try {
              const res = await window.ApiService.finance.getUserBalance();
              if (res && (res.balance !== undefined || res.usdt_balance !== undefined)) {
                result = { code: 1, data: res };
              } else if (res && res.code === 1 && res.data) {
                result = res;
              }
            } catch (apiError) {
              console.warn('ApiService调用失败，使用fallback:', apiError);
            }
          }

          // Fallback: 直接使用fetch
          if (!result) {
            const API_BASE = window.API_CONFIG?.baseURL || 'https://api.4kp3l0iq.top/api';
            const res = await fetch(
              `${API_BASE}/user/balance`,
              {
                method: "GET",
                headers: {
                  "Content-Type": "application/json",
                  token:
                    localStorage.getItem("providence_token") ||
                    localStorage.getItem("token") ||
                    "",
                },
              }
            );
            result = await res.json();
          }

          if (result && (result.code === 1 || result.code === 1 || result.code === 200) && result.data) {
            userBalances.CNY = parseFloat(result.data.balance || 0);
            userBalances.USDT = parseFloat(result.data.usdt_balance || result.data.usdt_money || 0);
          }
        } catch (e) {
          console.error("加载用户余额失败:", e);
        }
      }

      async function submitTransfer() {
        const pwd = document.getElementById("payPassword").value.trim();

        if (!pwd || pwd.length !== 6) {
          const popup = document.getElementById("popupContent");
          popup.classList.add("shake");
          setTimeout(() => popup.classList.remove("shake"), 300);
          showToast("", "请输入6位支付密码");
          return;
        }

        try {
          // 优先使用ApiService封装（来自config.js）
          let result = null;
          if (window.ApiService && window.ApiService.ribao) {
            try {
              if (window.currentTransferType === "in") {
                const data = await window.ApiService.ribao.transferIn({
                  amount: transferAmount,
                  pay_password: pwd
                });
                if (data) {
                  result = { code: 1, message: "转入成功", data: data };
                }
              } else {
                const data = await window.ApiService.ribao.transferOut({
                  amount: transferAmount,
                  pay_password: pwd
                });
                if (data) {
                  result = { code: 1, message: "转出成功", data: data };
                }
              }
            } catch (apiError) {
              console.warn('ApiService调用失败，使用fallback:', apiError);
            }
          }

          // Fallback: 直接使用fetch
          if (!result) {
            const API_BASE = window.API_CONFIG?.baseURL || 'https://api.4kp3l0iq.top/api';
            const apiUrl = (window.currentTransferType === "in")
              ? `${API_BASE}/user/api/ribao/transfer-in`
              : `${API_BASE}/user/api/ribao/transfer-out`;

            const res = await fetch(apiUrl, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                token:
                  localStorage.getItem("providence_token") ||
                  localStorage.getItem("token") ||
                  "",
              },
              body: JSON.stringify({
                amount: transferAmount,
                pay_password: pwd,
              }),
            });

            result = await res.json();
          }

          if (result.code === 1) {
            closePopup();
            showToast("", window.currentTransferType === "in" ? "转入成功" : "转出成功");
            document.getElementById("amountIn").value = "";
            document.getElementById("amountOut").value = "";
            loadRibaoData();
            loadUserBalance(); // 重新加载用户余额
          } else {
            showToast("", result.message || result.msg || "操作失败");
          }
        } catch (e) {
          console.error("转账操作失败:", e);
          showToast("", "网络错误，请重试");
        }
      }

      function closePopup() {
        document.getElementById("passwordPopup").classList.remove("show");
        document.getElementById("payPassword").value = "";
      }
    </script>
    <script>
      // 动态货币模式切换函数
      function updateCurrencyMode(mode) {
        const isCNY = mode === "cny";
        const className = isCNY ? "cny-mode" : "usdt-mode";

        console.log(
          "[Currency Switch] Switching to:",
          mode,
          "| className:",
          className
        );

        // 更新tab-btn
        document.querySelectorAll(".tab-btn").forEach((el) => {
          el.classList.remove("cny-mode", "usdt-mode");
          if (el.classList.contains("active")) {
            el.classList.add(className);
            console.log("[Currency Switch] Updated tab-btn:", el);
          }
        });

        // 更新quick-btn
        document.querySelectorAll(".quick-btn").forEach((el) => {
          el.classList.remove("cny-mode", "usdt-mode");
          el.classList.add(className);
        });

        // 更新submit-btn
        document.querySelectorAll(".submit-btn").forEach((el) => {
          el.classList.remove("cny-mode", "usdt-mode");
          el.classList.add(className);
        });

        // 更新amount-input
        document.querySelectorAll(".amount-input").forEach((el) => {
          el.classList.remove("cny-mode", "usdt-mode");
          el.classList.add(className);
        });

        // 更新标题
        const heroTitle = document.querySelector(".hero h2");
        if (heroTitle) {
          heroTitle.classList.remove("cny-mode", "usdt-mode");
          heroTitle.classList.add(className);
        }
      }

      // 初始化货币切换监听
      document.addEventListener("DOMContentLoaded", function () {
        console.log("[Ribao Init] Setting up currency mode listeners...");

        // 找到货币选择按钮
        const currencyBtns = document.querySelectorAll(".currency-btn");
        console.log(
          "[Ribao Init] Found currency buttons:",
          currencyBtns.length
        );

        currencyBtns.forEach((btn, index) => {
          btn.addEventListener("click", function () {
            const text = this.textContent || this.innerText;
            const mode =
              text.includes("人民币") || text.includes("CNY") ? "cny" : "usdt";
            console.log(
              `[Ribao] Button ${index} clicked, detected mode:`,
              mode
            );
            updateCurrencyMode(mode);
          });
        });

        // 默认初始化为CNY金色模式
        updateCurrencyMode("cny");
        console.log("[Ribao Init] Initialized with CNY mode");
      });
    </script>
    <script src="page-lifecycle.js?v=1763813622"></script>

  </body>
</html>
