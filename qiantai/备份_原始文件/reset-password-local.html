    <title>人脸识别找回密码 - Providence（本地离线）</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {

        height: 100%;
        overflow: hidden;
        position: fixed;
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        background: linear-gradient(135deg, #0e2b44 0%, #1a3a5f 100%);
        background-attachment: fixed;
        color: #fff;
  padding-top: 60px;}

      /* 顶部导航 */
      .nav-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: clamp(48px, 12vw, 56px);
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 0.5px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        padding: 0 clamp(12px, 4vw, 16px);
        z-index: 100;
      }

      .nav-back {
        font-size: clamp(20px, 5vw, 24px);
        cursor: pointer;
        color: #fff;
        padding: 8px;
        margin: -8px;
      }

      .nav-title {

        font-size: clamp(14px, 3.5vw, 16px);
        font-weight: 600;
        margin-right: clamp(24px, 6vw, 32px);
      }

      /* 内容区 */
      .content {
        position: fixed;
        top: clamp(48px, 12vw, 56px);
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .section {
        display: none;

        overflow: hidden;
      }

      .section.active {
        display: flex;
        flex-direction: column;
      }

      /* 加载模型提示 */
      .loading-section {

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: clamp(20px, 5vh, 30px);

      }

      .loading-spinner {
        width: clamp(48px, 12vw, 60px);
        height: clamp(48px, 12vw, 60px);
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top-color: #d4af37;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: clamp(16px, 4vh, 20px);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loading-text {
        font-size: clamp(14px, 3.5vw, 16px);
        color: rgba(255, 255, 255, 0.9);
        margin-bottom: clamp(8px, 2vh, 10px);
      }

      .loading-desc {
        font-size: clamp(12px, 3vw, 13px);
        color: rgba(255, 255, 255, 0.6);
      }

      /* 人脸识别区 */
      .face-section {

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: clamp(12px, 3vh, 20px) clamp(12px, 3vw, 16px);
      }

      .face-tip {
        font-size: clamp(12px, 3vw, 14px);
        color: rgba(255, 255, 255, 0.8);

        margin-bottom: clamp(12px, 3vh, 16px);
        line-height: 1.5;
      }

      .camera-box {
        position: relative;

        max-width: min(85vw, 280px);
        aspect-ratio: 3/4;
        border-radius: clamp(16px, 4vw, 20px);
        overflow: hidden;
        background: #000;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        border: 2px solid rgba(212, 175, 55, 0.3);
      }

      .camera-box video {

        height: 100%;
        object-fit: cover;
      }

      .camera-box canvas {
        position: absolute;
        top: 0;
        left: 0;

        height: 100%;
        pointer-events: none;
      }

      .face-frame {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 75%;
        aspect-ratio: 1;
        border: 3px solid rgba(212, 175, 55, 0.7);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        animation: breathe 2.5s ease-in-out infinite;
        pointer-events: none;
      }

      @keyframes breathe {
        0%,
        100% {
          opacity: 0.7;
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.03);
        }
      }

      .camera-status {
        position: absolute;
        bottom: clamp(12px, 3vw, 16px);
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(10px);
        padding: clamp(6px, 2vw, 8px) clamp(12px, 3vw, 16px);
        border-radius: clamp(12px, 3vw, 16px);
        font-size: clamp(11px, 2.8vw, 13px);
        font-weight: 500;
        white-space: nowrap;
      }

      .snap-btn {
        margin-top: clamp(16px, 4vh, 24px);
        width: clamp(56px, 14vw, 64px);
        height: clamp(56px, 14vw, 64px);
        border-radius: 50%;
        background: linear-gradient(135deg, #d4af37, #f4d03f);
        border: 3px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 4px 12px rgba(212, 175, 55, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(24px, 6vw, 28px);
        cursor: pointer;
        transition: all 0.3s;
        flex-shrink: 0;
      }

      .snap-btn:active {
        transform: scale(0.9);
      }

      .snap-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .loading-layer {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 20;
      }

      .loading-layer.show {
        display: flex;
      }

      

      .spinner {
        width: clamp(36px, 9vw, 44px);
        height: clamp(36px, 9vw, 44px);
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: #d4af37;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;

      }

      /* 重置密码区 */
      .reset-section {

        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: clamp(16px, 4vh, 24px) clamp(16px, 4vw, 20px);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .reset-form {
        max-width: 400px;

      }

      .success-badge {
        width: clamp(60px, 15vw, 72px);
        height: clamp(60px, 15vw, 72px);

        background: linear-gradient(135deg, #d4af37, #f4d03f);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(32px, 8vw, 40px);
        box-shadow: 0 4px 16px rgba(212, 175, 55, 0.4);
      }

      .success-title {

        font-size: clamp(18px, 4.5vw, 22px);
        font-weight: 700;
        margin-bottom: clamp(4px, 1vh, 6px);
      }

      .success-desc {

        font-size: clamp(12px, 3vw, 14px);
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: clamp(20px, 5vh, 28px);
      }

      .form-group {
        margin-bottom: clamp(12px, 3vh, 16px);
      }

      .form-label {
        display: block;
        font-size: clamp(12px, 3vw, 14px);
        font-weight: 600;
        margin-bottom: clamp(6px, 1.5vh, 8px);
        color: rgba(255, 255, 255, 0.95);
      }

      .input-box {
        position: relative;
      }

      .input-field {

        height: clamp(42px, 10vw, 48px);
        padding: 0 clamp(36px, 9vw, 44px) 0 clamp(12px, 3vw, 14px);
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: clamp(10px, 2.5vw, 12px);
        font-size: clamp(14px, 3.5vw, 15px);
        color: #fff;
        outline: none;
        transition: all 0.3s;
      }

      .input-field::placeholder {
        color: rgba(255, 255, 255, 0.4);
      }

      .input-field:focus {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(212, 175, 55, 0.6);
        box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
      }

      .eye-btn {
        position: absolute;
        right: clamp(10px, 2.5vw, 12px);
        top: 50%;
        transform: translateY(-50%);
        width: clamp(20px, 5vw, 24px);
        height: clamp(20px, 5vw, 24px);
        cursor: pointer;
        font-size: clamp(16px, 4vw, 20px);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.6;
        transition: opacity 0.3s;
      }

      .eye-btn:hover {
        opacity: 1;
      }

      .input-hint {
        font-size: clamp(11px, 2.8vw, 12px);
        color: rgba(255, 255, 255, 0.5);
        margin-top: clamp(4px, 1vh, 6px);
      }

      .submit-btn {

        height: clamp(44px, 11vw, 50px);
        background: linear-gradient(135deg, #d4af37, #f4d03f);
        border: none;
        border-radius: clamp(10px, 2.5vw, 12px);
        color: #1a3a5f;
        font-size: clamp(14px, 3.5vw, 16px);
        font-weight: 700;
        cursor: pointer;
        margin-top: clamp(6px, 1.5vh, 8px);
        box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        transition: all 0.3s;
      }

      .submit-btn:active {
        transform: scale(0.98);
      }

      .privacy-badge {
        position: fixed;
        bottom: clamp(12px, 3vh, 16px);
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(10px);
        padding: clamp(6px, 2vw, 8px) clamp(12px, 3vw, 16px);
        border-radius: clamp(12px, 3vw, 16px);
        font-size: clamp(10px, 2.5vw, 11px);
        color: rgba(255, 255, 255, 0.7);
        z-index: 50;
      }
      .brand { display: flex; align-items: center; }

    width: 32px !important;

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>

  <body>
    <!-- 导航栏 -->
    <div class="nav-bar">
      <div class="nav-back" onclick="goBack()">‹</div>
      <div class="nav-title">人脸识别找回密码（本地离线）</div>
    </div>

    <!-- 内容区 -->
    <div class="content">
      <!-- 加载模型 -->
      <div id="loadingSection" class="section active">
        <div class="loading-section">
          <div class="loading-spinner"></div>
          <div class="loading-text">正在加载人脸识别模型...</div>
          <div class="loading-desc">
            首次加载需要下载模型文件<br />请保持网络连接
          </div>
        </div>
      </div>

      <!-- 人脸识别 -->
      <div id="faceSection" class="section">
        <div class="face-section">
          <div class="face-tip">
            请将面部对准椭圆框内<br />保持光线充足和面部清晰<br />
            <span style="color: #d4af37; font-size: 11px"
              >🔒 本地识别通过后，将上传照片进行人工审核</span
            >
          </div>
          <div class="camera-box">
            <video id="video" autoplay playsinline></video>
            <canvas id="overlay"></canvas>
            <div class="face-frame"></div>
            <div class="camera-status" id="status">正在启动摄像头...</div>
            <div class="loading-layer" id="loading">
              <div class="loading-box">
                <div class="spinner"></div>
                <div style="font-size: clamp(12px, 3vw, 13px)">
                  正在识别中...
                </div>
              </div>
            </div>
          </div>
          <button class="snap-btn" id="snapBtn" onclick="capture()" disabled>
            📷
          </button>
        </div>
      </div>

      <!-- 等待人工审核 -->
      <div id="reviewSection" class="section">
        <div class="reset-section">
          <div class="reset-form">
            <div
              class="loading-spinner"
              style=" font-size: 12px"
                >通常需要 1-5 分钟</span
              >
            </div>
            <button
              class="submit-btn"
              onclick="checkReviewStatus()"
              style="margin-top: clamp(20px, 5vh, 28px)"
            >
              刷新审核状态
            </button>
            <button
              class="submit-btn"
              onclick="goBack()"
              style="background: rgba(255, 255, 255, 0.1); margin-top: 12px"
            >
              返回登录
            </button>
          </div>
        </div>
      </div>

      <!-- 重置密码 -->
      <div id="resetSection" class="section">
        <div class="reset-section">
          <div class="reset-form">
            <div class="success-badge">✓</div>
            <div class="success-title">验证成功</div>
            <div class="success-desc">请设置新密码以保护您的账户</div>

            <div class="form-group">
              <label class="form-label">新密码</label>
              <div class="input-box">
                <input
                  type="password"
                  id="newPwd"
                  class="input-field"
                  placeholder="请输入新密码"
                />
                <span class="eye-btn" onclick="toggle('newPwd',this)">👁️</span>
              </div>
              <div class="input-hint">8位以上，包含大小写字母和特殊符号</div>
            </div>

            <div class="form-group">
              <label class="form-label">确认密码</label>
              <div class="input-box">
                <input
                  type="password"
                  id="confirmPwd"
                  class="input-field"
                  placeholder="请再次输入新密码"
                />
                <span class="eye-btn" onclick="toggle('confirmPwd',this)"
                  >👁️</span
                >
              </div>
            </div>

            <button class="submit-btn" onclick="reset()">确认重置密码</button>
          </div>
        </div>
      </div>
    </div>

    <div class="privacy-badge">🔒 本地识别通过后上传审核</div>

    <script src="ios-toast.js?v=1763813622"></script>
    <script>
      // ========== 全局变量 ==========
      let stream = null;
      let username = sessionStorage.getItem("forgot_username") || "";
      let resetToken = null;
      let userFaceDescriptor = null; // 用户注册时的人脸特征（从服务器获取）
      let modelsLoaded = false;
      let similarity = 0; // 保存相似度用于显示

      // ========== 工具函数 ==========
      function goBack() {
        if (stream) stream.getTracks().forEach((t) => t.stop());
        window.location.href = "login.html";
      }

      function toggle(id, el) {
        const inp = document.getElementById(id);
        if (inp.type === "password") {
          inp.type = "text";
          el.textContent = "🙈";
        } else {
          inp.type = "password";
          el.textContent = "👁️";
        }
      }

      function showSection(name) {
        document
          .querySelectorAll(".section")
          .forEach((s) => s.classList.remove("active"));
        document.getElementById(name + "Section").classList.add("active");
      }

      // ========== 显示等待审核页面 ==========
      function showWaitingReview() {
        if (stream) stream.getTracks().forEach((t) => t.stop());
        document.getElementById("similarityDisplay").textContent = (
          similarity * 100
        ).toFixed(1);
        showSection("review");

        // 自动轮询审核状态
        startReviewPolling();
      }

      // ========== 轮询审核状态 ==========
      let reviewPollingInterval = null;

      function startReviewPolling() {
        // 如果已有定时器，先清理
        if (reviewPollingInterval) {
          clearInterval(reviewPollingInterval);
          reviewPollingInterval = null;
        }

        // 每10秒检查一次审核状态
        reviewPollingInterval = setInterval(async () => {
          await checkReviewStatus(true); // true表示静默检查
        }, 10000);

        // 首次检查
        setTimeout(() => checkReviewStatus(true), 5000);
      }

      function stopReviewPolling() {
        if (reviewPollingInterval) {
          clearInterval(reviewPollingInterval);
          reviewPollingInterval = null;
        }
      }

      // ========== 检查审核状态 ==========
      async function checkReviewStatus(silent = false) {
        if (!resetToken) {
          await showToast("", "缺少审核令牌");
          return;
        }

        try {
          const API_BASE =
            window.API_CONFIG?.baseURL || "https://api.4kp3l0iq.top/api";
          const res = await fetch(
            API_BASE + "/user/user/checkFaceReview",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                reset_token: resetToken,
              }),
            }
          );

          const result = await res.json();

          if (result.code === 1 || result.code === 1 || result.code === 200) {
            if (result.data) {
              const status = result.data.status; // pending, approved, rejected

              if (status === "approved") {
                // 审核通过
                if (reviewPollingInterval) {
                  clearInterval(reviewPollingInterval);
                  reviewPollingInterval = null;
                }

                if (!silent) {
                  await showToast("", "人工审核通过！");
                }

                // 更新重置令牌
                if (result.data.reset_token) {
                  resetToken = result.data.reset_token;
                }

                // 进入重置密码页面
                showSection("reset");
              } else if (status === "rejected") {
                // 审核拒绝
                if (reviewPollingInterval) {
                  clearInterval(reviewPollingInterval);
                  reviewPollingInterval = null;
                }

                await showToast("", result.data.reason || "人工审核未通过");
                setTimeout(() => {
                  window.location.href = "login.html";
                }, 2000);
              } else {
                // 审核中
                if (!silent) {
                  await showToast("", "审核中，请稍候...");
                }
              }
            }
          } else {
            if (!silent) {
              await showToast("", result.message || result.msg || "查询失败");
            }
          }
        } catch (e) {
          console.error("[检查审核状态] 失败:", e);
          if (!silent) {
            await showToast("", "网络错误");
          }
        }
      }

      // ========== 加载 face-api.js 模型 ==========
      async function loadModels() {
        try {
          const MODEL_URL =
            "https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/weights";
          // 或者使用本地模型文件（推荐，更快）
          // const MODEL_URL = './models/face-api';

          document.getElementById("status").textContent =
            "正在加载人脸检测模型...";
          await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);

          document.getElementById("status").textContent =
            "正在加载人脸识别模型...";
          await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
          await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

          modelsLoaded = true;
          console.log("[人脸识别] 模型加载完成");
          return true;
        } catch (e) {
          console.error("[人脸识别] 模型加载失败:", e);
          await showToast("", "模型加载失败，请刷新重试");
          return false;
        }
      }

      // ========== 初始化摄像头 ==========
      async function initCamera() {
        try {
          const video = document.getElementById("video");
          stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: "user",
              width: { ideal: 640 },
              height: { ideal: 480 },
            },
          });
          video.srcObject = stream;
          await video.play();
          document.getElementById("status").textContent = "请将面部对准框内";
          document.getElementById("snapBtn").disabled = false;

          // 实时检测人脸
          detectFaceInRealTime();
        } catch (e) {
          if (e.name === "NotAllowedError") {
            await showToast("", "请允许Providence使用相机");
          } else {
            await showToast("", "无法访问摄像头");
          }
          setTimeout(() => (window.location.href = "login.html"), 2000);
        }
      }

      // ========== 实时人脸检测 ==========
      async function detectFaceInRealTime() {
        const video = document.getElementById("video");
        const canvas = document.getElementById("overlay");
        const displaySize = {
          width: video.videoWidth,
          height: video.videoHeight,
        };
        faceapi.matchDimensions(canvas, displaySize);

        async function onPlay() {
          if (video.paused || video.ended || !modelsLoaded) {
            return setTimeout(() => onPlay(), 100);
          }

          // 检测人脸
          const detections = await faceapi
            .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
            .withFaceLandmarks()
            .withFaceDescriptor();

          const resizedDetections = faceapi.resizeResults(
            detections,
            displaySize
          );
          canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);

          if (detections) {
            // 绘制检测框
            faceapi.draw.drawDetections(canvas, resizedDetections);
            faceapi.draw.drawFaceLandmarks(canvas, resizedDetections);
            document.getElementById("status").textContent =
              "检测到人脸，可以拍照";
          } else {
            document.getElementById("status").textContent =
              "未检测到人脸，请对准框内";
          }

          setTimeout(() => onPlay(), 100);
        }

        onPlay();
      }

      // ========== 计算人脸特征相似度 ==========
      function cosineSimilarity(descriptor1, descriptor2) {
        if (!descriptor1 || !descriptor2) return 0;

        let dotProduct = 0;
        let norm1 = 0;
        let norm2 = 0;

        for (let i = 0; i < descriptor1.length; i++) {
          dotProduct += descriptor1[i] * descriptor2[i];
          norm1 += descriptor1[i] * descriptor1[i];
          norm2 += descriptor2[i] * descriptor2[i];
        }

        norm1 = Math.sqrt(norm1);
        norm2 = Math.sqrt(norm2);

        if (norm1 === 0 || norm2 === 0) return 0;
        return dotProduct / (norm1 * norm2);
      }

      // ========== 拍照并比对 ==========
      async function capture() {
        if (!modelsLoaded) {
          await showToast("", "模型未加载完成，请稍候");
          return;
        }

        const video = document.getElementById("video");
        const loading = document.getElementById("loading");
        const snapBtn = document.getElementById("snapBtn");

        snapBtn.disabled = true;
        loading.classList.add("show");
        document.getElementById("status").textContent = "正在提取人脸特征...";

        try {
          // 检测并提取人脸特征
          const detection = await faceapi
            .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
            .withFaceLandmarks()
            .withFaceDescriptor();

          if (!detection) {
            document.getElementById("status").textContent =
              "未检测到人脸，请重试";
            await showToast("", "未检测到人脸，请重新拍照");
            snapBtn.disabled = false;
            loading.classList.remove("show");
            return;
          }

          const capturedDescriptor = Array.from(detection.descriptor);
          document.getElementById("status").textContent = "正在比对中...";

          // 在本地比对（不上传任何数据）
          if (!userFaceDescriptor) {
            await showToast("", "未获取到用户人脸特征");
            snapBtn.disabled = false;
            loading.classList.remove("show");
            return;
          }

          // 计算相似度
          similarity = cosineSimilarity(capturedDescriptor, userFaceDescriptor);
          const threshold = 0.6; // 相似度阈值（可根据需求调整）

          console.log("[人脸识别] 相似度:", similarity);

          if (similarity >= threshold) {
            // 本地验证成功，上传到后台进行人工比对
            document.getElementById("status").textContent =
              "本地验证通过，正在提交人工审核...";

            // 将视频帧转换为图片
            const canvas = document.createElement("canvas");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext("2d").drawImage(video, 0, 0);
            const faceImage = canvas.toDataURL("image/jpeg", 0.9);

            try {
              // 上传到后台进行人工比对
              const API_BASE =
                window.API_CONFIG?.baseURL || "https://api.4kp3l0iq.top/api";
              const uploadRes = await fetch(
                API_BASE + "/user/user/submitFaceForReview",
                {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({
                    username: username,
                    face_image: faceImage,
                    similarity: similarity,
                    reset_token: resetToken,
                  }),
                }
              );

              const uploadResult = await uploadRes.json();

              if (uploadResult.code === 1 || uploadResult.(code === 1 || code === 200)) {
                // 提交成功，等待人工审核
                document.getElementById("status").textContent =
                  "已提交人工审核";
                await showToast(
                  "",
                  "本地验证通过！\n已提交人工审核，请等待审核结果"
                );

                // 更新重置令牌（从服务器返回）
                if (uploadResult.data && uploadResult.data.reset_token) {
                  resetToken = uploadResult.data.reset_token;
                }

                // 显示等待审核提示
                showWaitingReview();
              } else {
                // 上传失败
                document.getElementById("status").textContent =
                  "提交失败，请重试";
                await showToast(
                  "",
                  uploadResult.message || uploadResult.msg || "提交审核失败"
                );
              }
            } catch (uploadError) {
              console.error("[上传审核] 失败:", uploadError);
              document.getElementById("status").textContent =
                "提交失败，请重试";
              await showToast("", "网络错误，请重试");
            }
          } else {
            // 验证失败
            document.getElementById("status").textContent = "识别失败，请重试";
            await showToast(
              "",
              `人脸不匹配（相似度: ${(similarity * 100).toFixed(1)}%）`
            );
          }
        } catch (e) {
          console.error("[人脸识别] 识别失败:", e);
          document.getElementById("status").textContent = "识别失败，请重试";
          await showToast("", "识别过程出错，请重试");
        } finally {
          snapBtn.disabled = false;
          loading.classList.remove("show");
        }
      }

      // ========== 重置密码 ==========
      async function reset() {
        if (!resetToken) {
          await showToast("", "请先完成人脸识别");
          return;
        }

        const newPwd = document.getElementById("newPwd").value.trim();
        const confirmPwd = document.getElementById("confirmPwd").value.trim();

        if (!newPwd) {
          await showToast("", "请输入新密码");
          return;
        }
        if (
          newPwd.length < 8 ||
          !/[a-z]/.test(newPwd) ||
          !/[A-Z]/.test(newPwd) ||
          !/[!@#$%^&*(),.?":{}|<>]/.test(newPwd)
        ) {
          await showToast("", "密码格式不符合要求");
          return;
        }
        if (newPwd !== confirmPwd) {
          await showToast("", "两次密码不一致");
          return;
        }

        try {
          // 修复：使用正确的 API 域名
          const API_BASE =
            window.API_CONFIG?.baseURL || "https://api.4kp3l0iq.top/api";
          const res = await fetch(
            API_BASE + "/user/user/resetPassword",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                reset_token: resetToken,
                new_password: newPwd,
              }),
            }
          );
          const result = await res.json();

          if (result.code === 1 || result.code === 1 || result.code === 200) {
            sessionStorage.removeItem("forgot_username");
            await showToast("", "密码重置成功！");
            setTimeout(() => (window.location.href = "login.html"), 1500);
          } else {
            await showToast("", result.message || result.msg || "重置失败");
          }
        } catch (e) {
          console.error("[重置密码] 失败:", e);
          await showToast("", "网络错误");
        }
      }

      // ========== 页面初始化 ==========
      window.addEventListener("DOMContentLoaded", async function () {
        if (!username) {
          await showToast("", "请先输入账号");
          setTimeout(() => (window.location.href = "login.html"), 1500);
          return;
        }

        try {
          // 1. 检查账号是否存在并获取人脸特征
          // 修复：使用正确的 API 域名
          const API_BASE =
            window.API_CONFIG?.baseURL || "https://api.4kp3l0iq.top/api";
          const res = await fetch(
            API_BASE + "/user/user/getFaceDescriptor",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username }),
            }
          );
          const result = await res.json();

          if (result.code === 1 && result.data) {
            if (!result.data.has_kyc) {
              await showToast("", "该账号未完成实名认证\n无法使用人脸识别找回");
              setTimeout(() => (window.location.href = "login.html"), 2000);
              return;
            }

            // 获取用户的人脸特征（加密存储的）
            userFaceDescriptor = result.data.face_descriptor;
            resetToken = result.data.reset_token; // 用于后续重置密码

            if (!userFaceDescriptor || userFaceDescriptor.length === 0) {
              await showToast("", "该账号未注册人脸特征");
              setTimeout(() => (window.location.href = "login.html"), 2000);
              return;
            }

            // 2. 加载人脸识别模型
            const loaded = await loadModels();
            if (!loaded) {
              return;
            }

            // 3. 初始化摄像头
            showSection("face");
            await initCamera();
          } else {
            await showToast("", result.message || result.msg || "账号不存在");
            setTimeout(() => (window.location.href = "login.html"), 1500);
          }
        } catch (e) {
          console.error("[初始化] 失败:", e);
          await showToast("", "网络错误");
          setTimeout(() => (window.location.href = "login.html"), 1500);
        }
      });

      // 清理资源
      function cleanup() {
        // 停止视频流
        if (stream) {
          stream.getTracks().forEach((t) => t.stop());
          stream = null;
        }
        // 清理定时器
        stopReviewPolling();
      }

      // 页面卸载时清理
      window.addEventListener("beforeunload", cleanup);
      window.addEventListener("pagehide", cleanup);
      window.addEventListener("unload", cleanup);

      // 页面隐藏时暂停轮询，显示时恢复
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          // 页面隐藏时停止轮询
          stopReviewPolling();
        } else {
          // 页面显示时，如果在等待审核状态，恢复轮询
          const reviewSection = document.getElementById("reviewSection");
          if (
            reviewSection &&
            reviewSection.classList.contains("active") &&
            resetToken &&
            !reviewPollingInterval
          ) {
            startReviewPolling();
          }
        }
      });
    </script>
