<!DOCTYPE html>
<html lang="zh-cmn-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
    <!-- iOS状态栏配色 - 深色主题 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a1020" />
<title>AI智能客服 | PROVIDENCE</title>
<link rel="icon" href="favicon.ico" />
<link rel="stylesheet" href="styles.css?v=1763813622" />
<style>
.chat-container{height:calc(100vh - 130px);display:flex;flex-direction:column;background:#f7f8fa}

.chat-messages{flex:1;overflow-y:auto;padding:16px}

.chat-msg{margin-bottom:16px;display:flex;gap:12px}

.chat-msg.user{flex-direction:row-reverse}

.chat-avatar{height:36px;border-radius:50%;background:#d4af37;display:flex;align-items:center;justify-content:center;font-size:18px;border-radius:16px;line-height:1.6}

.chat-msg.ai .chat-bubble{background:#fff;color:#333;border-radius:4px 16px 16px 16px}

.chat-msg.user .chat-bubble{background:#d4af37;color:#fff;border-radius:16px 4px 16px 16px}

.chat-input-wrap{padding:12px;background:#fff;border-top:1px solid #e0e0e0;display:flex;gap:8px}

.chat-input{flex:1;padding:10px 16px;border:1px solid #ddd;border-radius:20px;font-size:14px}

.chat-send-btn{padding:10px 20px;background:#d4af37;color:#fff;border:none;border-radius:20px;font-weight:600;cursor:pointer}

.brand { display: flex; flex-direction: row; align-items: center; gap: 8px; white-space: nowrap; justify-content: flex-start; }      .brand .back-btn {
    width: 32px !important;
    height: 32px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    border-radius: 8px !important;
    background: rgba(232, 201, 145, 0.15) !important;
    border: 1px solid rgba(232, 201, 145, 0.3) !important;
    color: #e8c991 !important;
    font-size: 20px !important;
    cursor: pointer !important;
    transition: all 0.2s ease !important;
}
.back-btn:active {
    transform: scale(0.95) !important;
}
.back-btn:active {
    transform: scale(0.95) !important;
}      .brand .page-title, .brand h1 { margin: 0; display: inline-block; white-space: nowrap; flex: 0 1 auto; }

</style>
</head>
<body class="page-other">
<div id="app">
<header class="hero-simple">
<div class="hero-top">
<a href="messages.html" class="back-btn">←</a>
<div class="brand"><span class="b1">AI智能客服</span></div>
</div>
</header>
<main class="chat-container">
<div class="chat-messages" id="chatMessages">
<div class="chat-msg ai">
<div class="chat-avatar">🤖</div>
<div class="chat-bubble">您好！我是您的专属智能理财顾问，有什么可以帮您的吗？</div>
</div>
</div>
<div class="chat-input-wrap">
<input type="text" class="chat-input" id="chatInput" placeholder="输入您的问题..." />
<button class="chat-send-btn" onclick="sendMessage()">发送</button>
</div>
</main>
</div>
<script src="api-new.js?v=1763813622"></script>
<script src="ai-service.js?v=1763813622"></script>
<script>
const chatMessages = document.getElementById('chatMessages');
const chatInput = document.getElementById('chatInput');

async function sendMessage(){
  const message = chatInput.value.trim();
  if(!message) return;

  // 显示用户消息
  addMessage('user', message);
  chatInput.value = '';

  // 显示加载状态
  const loadingId = addMessage('ai', '正在思考...');

  // 调用AI
  const result = await sendToAI(message);

  // 移除加载消息，显示AI回复
  document.getElementById(loadingId)?.remove();
  addMessage('ai', result.message);

  // 滚动到底部
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function addMessage(type, text){
  const msgId = 'msg-' + Date.now();
  const avatar = type === 'ai' ? '🤖' : '👤';
  const html = `
    <div class="chat-msg ${type}" id="${msgId}">
      <div class="chat-avatar">${avatar}</div>
      <div class="chat-bubble">${text}</div>
    </div>
  `;
  chatMessages.insertAdjacentHTML('beforeend', html);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  return msgId;
}

chatInput.addEventListener('keypress', e => {
  if(e.key === 'Enter') sendMessage();
});
</script>
    <script src="page-lifecycle.js?v=1763813622"></script>
    <script src="smart-swipe-control.js?v=1763813622"></script>


</body>
</html>
