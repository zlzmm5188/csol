        #fileInput {

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            margin-top: 20px;
            transition: transform 0.2s;
        }

            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .preview {
            margin-top: 20px;

        }

        }

        .result.error {

        .spinner {

</head>
<body>
    <div class="container">
        <h1>📸 图片上传</h1>
        <p class="subtitle">上传到 /providence/img 目录</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">点击或拖拽图片到这里</div>
            <div class="upload-hint">支持 JPG、PNG、GIF、WEBP，最大 5MB</div>
        </div>

        <input type="file" id="fileInput" accept="image/*" />

        <button class="btn" id="uploadBtn" disabled>上传图片</button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #666;">上传中...</p>
        </div>

        <div class="preview" id="preview"></div>

        <div class="result" id="result"></div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const preview = document.getElementById('preview');
        const result = document.getElementById('result');
        const loading = document.getElementById('loading');

        let selectedFile = null;

        // 点击上传区域
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // 文件选择
        fileInput.addEventListener('change', (e) => {
            handleFile(e.target.files[0]);
        });

        // 拖拽上传
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFile(e.dataTransfer.files[0]);
        });

        // 处理文件
        function handleFile(file) {
            if (!file) return;

            // 验证文件类型
            if (!file.type.startsWith('image/')) {
                showResult('错误：请选择图片文件', false);
                return;
            }

            // 验证文件大小
            if (file.size > 5 * 1024 * 1024) {
                showResult('错误：文件大小不能超过5MB', false);
                return;
            }

            selectedFile = file;
            uploadBtn.disabled = false;
            result.style.display = 'none';

            // 显示预览
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.innerHTML = `<img src="${e.target.result}" alt="预览" />`;
            };
            reader.readAsDataURL(file);
        }

        // 上传按钮
        uploadBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            uploadBtn.disabled = true;
            loading.style.display = 'block';
            result.style.display = 'none';

            const formData = new FormData();
            formData.append('image', selectedFile);

            try {
                const response = await fetch('upload-image.php', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    showResult(`✅ ${data.msg}\n文件路径：${data.path}`, true, data.url);
                } else {
                    showResult(`❌ ${data.msg}`, false);
                }
            } catch (error) {
                showResult(`❌ 上传失败：${error.message}`, false);
            } finally {
                loading.style.display = 'none';
                uploadBtn.disabled = false;
            }
        });

        // 显示结果
        function showResult(message, isSuccess, url = null) {
            result.className = `result ${isSuccess ? 'success' : 'error'}`;
            result.innerHTML = message;
            if (url) {
                result.innerHTML += `<div class="result-url">访问地址：<a href="${url}" target="_blank">${url}</a></div>`;
            }
            result.style.display = 'block';
        }
    </script>
    <script src="page-lifecycle.js?v=1763813622"></script>
    <script src="smart-swipe-control.js?v=1763813622"></script>


</body>
</html>
