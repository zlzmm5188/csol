<script>
// 下载链接配置
const DOWNLOAD_LINKS = {
  android: 'https://your-download-link.com/providence.apk',  // 替换为实际下载链接
  ios: 'https://apps.apple.com/app/idXXXXXXXX'  // 替换为App Store链接
};

// 检测设备类型
function detectDevice() {
  const ua = navigator.userAgent.toLowerCase();
  if (/android/i.test(ua)) return 'android';
  if (/iphone|ipad|ipod/i.test(ua)) return 'ios';
  return 'unknown';
}

// 自动突出显示对应平台按钮
const device = detectDevice();
if (device === 'android') {
  document.getElementById('androidBtn').style.boxShadow = '0 0 20px rgba(199,181,138,0.5)';
} else if (device === 'ios') {
  document.getElementById('iosBtn').style.boxShadow = '0 0 20px rgba(199,181,138,0.5)';
}

// 绑定下载事件
document.getElementById('androidBtn').addEventListener('click', function(e) {
  e.preventDefault();
  window.location.href = DOWNLOAD_LINKS.android;
);

document.getElementById('iosBtn').addEventListener('click', function(e) {
  e.preventDefault();
  window.location.href = DOWNLOAD_LINKS.ios;
);
</script>
