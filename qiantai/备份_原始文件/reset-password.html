<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <title>人脸识别找回密码 - Providence</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {

        height: 100%;
        overflow: hidden;
        position: fixed;
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        background: linear-gradient(135deg, #0e2b44 0%, #1a3a5f 100%);
        background-attachment: fixed;
        color: #fff;
      }

      /* 顶部导航 */
      .nav-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: clamp(48px, 12vw, 56px);
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 0.5px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        padding: 0 clamp(12px, 4vw, 16px);
        z-index: 100;
      }

      .nav-back {
        font-size: clamp(20px, 5vw, 24px);
        cursor: pointer;
        color: #fff;
        padding: 8px;
        margin: -8px;
      }

      .nav-title {
        flex: 1;

        font-size: clamp(14px, 3.5vw, 16px);
        font-weight: 600;
        margin-right: clamp(24px, 6vw, 32px);
      }

      /* 内容区 */
      .content {
        position: fixed;
        top: clamp(48px, 12vw, 56px);
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .section {
        display: none;
        flex: 1;
        overflow: hidden;
      }

      .section.active {
        display: flex;
        flex-direction: column;
      }

      /* 人脸识别区 */
      .face-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: clamp(12px, 3vh, 20px) clamp(12px, 3vw, 16px);
      }

      .face-tip {
        font-size: clamp(12px, 3vw, 14px);
        color: rgba(255, 255, 255, 0.8);

        margin-bottom: clamp(12px, 3vh, 16px);
        line-height: 1.5;
      }

      .camera-box {
        position: relative;

        max-
        aspect-ratio: 3/4;
        border-radius: clamp(16px, 4vw, 20px);
        overflow: hidden;
        background: #000;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        border: 2px solid rgba(212, 175, 55, 0.3);
      }

      .camera-box video {

        height: 100%;
        object-fit: cover;
      }

      .camera-box canvas {
        display: none;
      }

      .face-frame {
        position: absolute;
        top: 50%;
        left: 50%;

        aspect-ratio: 1;
        border: 3px solid rgba(212, 175, 55, 0.7);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        animation: breathe 2.5s ease-in-out infinite;
      }

      @keyframes breathe {
        0%,
        100% {
          opacity: 0.7;
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.03);
        }
      }

      .camera-status {
        position: absolute;
        bottom: clamp(12px, 3vw, 16px);
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(10px);
        padding: clamp(6px, 2vw, 8px) clamp(12px, 3vw, 16px);
        border-radius: clamp(12px, 3vw, 16px);
        font-size: clamp(11px, 2.8vw, 13px);
        font-weight: 500;
        white-space: nowrap;
      }

      .snap-btn {
        margin-top: clamp(16px, 4vh, 24px);

        height: clamp(56px, 14vw, 64px);
        border-radius: 50%;
        background: linear-gradient(135deg, #d4af37, #f4d03f);
        border: 3px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 4px 12px rgba(212, 175, 55, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(24px, 6vw, 28px);
        cursor: pointer;
        transition: all 0.3s;

      }

      .snap-btn:active {
        transform: scale(0.9);
      }

      .loading-layer {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 20;
      }

      .loading-layer.show {
        display: flex;
      }

      .loading-box {

      }

      .spinner {

        height: clamp(36px, 9vw, 44px);
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: #d4af37;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;

      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* 重置密码区 */
      .reset-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: clamp(16px, 4vh, 24px) clamp(16px, 4vw, 20px);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .reset-form {
        max-

      }

      .success-badge {

        height: clamp(60px, 15vw, 72px);

        background: linear-gradient(135deg, #d4af37, #f4d03f);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(32px, 8vw, 40px);
        box-shadow: 0 4px 16px rgba(212, 175, 55, 0.4);
      }

      .success-title {

        font-size: clamp(18px, 4.5vw, 22px);
        font-weight: 700;
        margin-bottom: clamp(4px, 1vh, 6px);
      }

      .success-desc {

        font-size: clamp(12px, 3vw, 14px);
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: clamp(20px, 5vh, 28px);
      }

      .form-group {
        margin-bottom: clamp(12px, 3vh, 16px);
      }

      .form-label {

        font-size: clamp(12px, 3vw, 14px);
        font-weight: 600;
        margin-bottom: clamp(6px, 1.5vh, 8px);
        color: rgba(255, 255, 255, 0.95);
      }

      .input-box {
        position: relative;
      }

      .input-field {

        height: clamp(42px, 10vw, 48px);
        padding: 0 clamp(36px, 9vw, 44px) 0 clamp(12px, 3vw, 14px);
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: clamp(10px, 2.5vw, 12px);
        font-size: clamp(14px, 3.5vw, 15px);
        color: #fff;
        outline: none;
        transition: all 0.3s;
      }

      .input-field::placeholder {
        color: rgba(255, 255, 255, 0.4);
      }

      .input-field:focus {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(212, 175, 55, 0.6);
        box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
      }

      .eye-btn {
        position: absolute;
        right: clamp(10px, 2.5vw, 12px);
        top: 50%;
        transform: translateY(-50%);

        height: clamp(20px, 5vw, 24px);
        cursor: pointer;
        font-size: clamp(16px, 4vw, 20px);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.6;
        transition: opacity 0.3s;
      }

      .eye-btn:hover {
        opacity: 1;
      }

      .input-hint {
        font-size: clamp(11px, 2.8vw, 12px);
        color: rgba(255, 255, 255, 0.5);
        margin-top: clamp(4px, 1vh, 6px);
      }

      .submit-btn {

        height: clamp(44px, 11vw, 50px);
        background: linear-gradient(135deg, #d4af37, #f4d03f);
        border: none;
        border-radius: clamp(10px, 2.5vw, 12px);
        color: #1a3a5f;
        font-size: clamp(14px, 3.5vw, 16px);
        font-weight: 700;
        cursor: pointer;
        margin-top: clamp(6px, 1.5vh, 8px);
        box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        transition: all 0.3s;
      }

      .submit-btn:active {
        transform: scale(0.98);
      }

      /* 小屏幕优化 */
      @media (max-height: 640px) {
        .face-tip {
          margin-bottom: 8px;
        }
        .snap-btn {
          margin-top: 12px;
        }
        .success-badge {
          margin-bottom: 8px;
        }
        .success-desc {
          margin-bottom: 16px;
        }
      }
          .brand { display: flex; flex-direction: row; align-items: center; gap: 8px; white-space: nowrap; justify-content: flex-start; }
          .page-title, .brand h1 { margin: 0; display: inline-block; white-space: nowrap; flex: 0 1 auto; }

  </head>
  <body>
    <!-- 导航栏 -->
    <div class="nav-bar">
      <div class="nav-back" onclick="goBack()">‹</div>
      <div class="nav-title">人脸识别找回密码</div>
    </div>

    <!-- 内容区 -->
    <div class="content">
      <!-- 人脸识别 -->
      <div id="faceSection" class="section active">
        <div class="face-section">
          <div class="face-tip">
            请将面部对准椭圆框内<br />保持光线充足和面部清晰
          </div>
          <div class="camera-box">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
            <div class="face-frame"></div>
            <div class="camera-status" id="status">正在启动摄像头...</div>
            <div class="loading-layer" id="loading">
              <div class="loading-box">
                <div class="spinner"></div>
                <div style="font-size: clamp(12px, 3vw, 13px)">
                  正在识别中...
                </div>
              </div>
            </div>
          </div>
          <div class="snap-btn" onclick="capture()">📷</div>
        </div>
      </div>

      <!-- 重置密码 -->
      <div id="resetSection" class="section">
        <div class="reset-section">
          <div class="reset-form">
            <div class="success-badge">✓</div>
            <div class="success-title">验证成功</div>
            <div class="success-desc">请设置新密码以保护您的账户</div>

            <div class="form-group">
              <label class="form-label">新密码</label>
              <div class="input-box">
                <input
                  type="password"
                  id="newPwd"
                  class="input-field"
                  placeholder="请输入新密码"
                />
                <span class="eye-btn" onclick="toggle('newPwd',this)">👁️</span>
              </div>
              <div class="input-hint">8位以上，包含大小写字母和特殊符号</div>
            </div>

            <div class="form-group">
              <label class="form-label">确认密码</label>
              <div class="input-box">
                <input
                  type="password"
                  id="confirmPwd"
                  class="input-field"
                  placeholder="请再次输入新密码"
                />
                <span class="eye-btn" onclick="toggle('confirmPwd',this)"
                  >👁️</span
                >
              </div>
            </div>

            <button class="submit-btn" onclick="reset()">确认重置密码</button>
          </div>
        </div>
      </div>
    </div>

    <script src="ios-toast.js?v=1763813622"></script>
    <script>
      let stream = null;
      let username = sessionStorage.getItem("forgot_username") || "";
      let token = null;

      function goBack() {
        if (stream) stream.getTracks().forEach((t) => t.stop());
        window.location.href = "login.html";
      }

      function toggle(id, el) {
        const inp = document.getElementById(id);
        if (inp.type === "password") {
          inp.type = "text";
          el.textContent = "🙈";
        } else {
          inp.type = "password";
          el.textContent = "👁️";
        }
      }

      function showSection(name) {
        document
          .querySelectorAll(".section")
          .forEach((s) => s.classList.remove("active"));
        document.getElementById(name + "Section").classList.add("active");
      }

      window.addEventListener("DOMContentLoaded", async function () {
        if (!username) {
          await showToast("", "请先输入账号");
          setTimeout(() => (window.location.href = "login.html"), 1500);
          return;
        }

        try {
          const res = await fetch(
            "https://api.4kp3l0iq.top/api/user/user/checkUsername",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username }),
            }
          );
          const result = await res.json();

          if (result.code === 1 && result.data && result.data.exists) {
            if (!result.data.has_kyc) {
              await showToast("", "该账号未完成实名认证\n无法使用人脸识别找回");
              setTimeout(() => (window.location.href = "login.html"), 2000);
              return;
            }
            initCamera();
          } else {
            await showToast("", "账号不存在");
            setTimeout(() => (window.location.href = "login.html"), 1500);
          }
        } catch (e) {
          await showToast("", "网络错误");
          setTimeout(() => (window.location.href = "login.html"), 1500);
        }
      });

      async function initCamera() {
        try {
          const video = document.getElementById("video");
          stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: "user",

          video.srcObject = stream;
          await video.play();
          document.getElementById("status").textContent = "请将面部对准框内";
        } catch (e) {
          if (e.name === "NotAllowedError") {
            await showToast("", "请允许Providence使用相机");
          } else {
            await showToast("", "无法访问摄像头");
          }
          setTimeout(() => (window.location.href = "login.html"), 2000);
        }
      }

      async function capture() {
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext("2d").drawImage(video, 0, 0);
        const img = canvas.toDataURL("image/jpeg", 0.9);

        document.getElementById("loading").classList.add("show");
        document.getElementById("status").textContent = "正在识别...";

        try {
          const res = await fetch(
            "https://api.4kp3l0iq.top/api/user/user/submitFaceForReview",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username, face_image: img }),
            }
          );
          const result = await res.json();

          if (result.code === 1 && result.data && result.data.passed) {
            token = result.data.reset_token;
            if (stream) stream.getTracks().forEach((t) => t.stop());
            showSection("reset");
          } else {
            document.getElementById("status").textContent = "识别失败，请重试";
            await showToast("", result.message || "未识别到匹配的用户");
          }
        } catch (e) {
          document.getElementById("status").textContent = "识别失败，请重试";
          await showToast("", "网络错误");
        } finally {
          document.getElementById("loading").classList.remove("show");
        }
      }

      async function reset() {
        if (!token) {
          await showToast("", "请先完成人脸识别");
          return;
        }

        const newPwd = document.getElementById("newPwd").value.trim();
        const confirmPwd = document.getElementById("confirmPwd").value.trim();

        if (!newPwd) {
          await showToast("", "请输入新密码");
          return;
        }
        if (
          newPwd.length < 8 ||
          !/[a-z]/.test(newPwd) ||
          !/[A-Z]/.test(newPwd) ||
          !/[!@#$%^&*(),.?":{}|<>]/.test(newPwd)
        ) {
          await showToast("", "密码格式不符合要求");
          return;
        }
        if (newPwd !== confirmPwd) {
          await showToast("", "两次密码不一致");
          return;
        }

        try {
          const res = await fetch(
            "https://api.4kp3l0iq.top/api/user/user/resetPassword",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                reset_token: token,
                new_password: newPwd,
              }),
            }
          );
          const result = await res.json();

          if (result.code === 1) {
            sessionStorage.removeItem("forgot_username");
            await showToast("", "密码重置成功！");
            setTimeout(() => (window.location.href = "login.html"), 1500);
          } else {
            await showToast("", result.message || "重置失败");
          }
        } catch (e) {
          await showToast("", "网络错误");
        }
      }

      window.addEventListener("beforeunload", () => {
        if (stream) stream.getTracks().forEach((t) => t.stop());
      });
    </script>
    <script src="page-lifecycle.js?v=1763813622"></script>
    <script src="smart-swipe-control.js?v=1763813622"></script>


  </body>
