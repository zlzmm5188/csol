<script>
// 如果 config.js 未加载或加载慢，使用内联配置
if (!window.API_CONFIG || !window.API_CONFIG.baseURL) {
    window.API_CONFIG = {
        baseURL: 'https://api.4kp3l0iq.top/api,
        adminURL: 'https://admin.4kp3l0iq.top',
        tokenKey: 'providence_token',
        timeout: 15000,
        debug: true
    };
    console.log('[Messages] API_CONFIG 快速初始化完成');
}

// 确保 API 对象存在
if (!window.API) {
    window.API = {
        get: async function(url, options = {}) {
            const token = localStorage.getItem('providence_token');
            const response = await fetch(window.API_CONFIG.baseURL + url, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'token': token,
                    'Authorization': `Bearer ${token}`,
                    ...(options.headers || {})
                },
                signal: AbortSignal.timeout(window.API_CONFIG.timeout)
            });
            return await response.json();
        },
        post: async function(url, data = {}, options = {}) {
            const token = localStorage.getItem('providence_token');
            const response = await fetch(window.API_CONFIG.baseURL + url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'token': token,
                    'Authorization': `Bearer ${token}`,
                    ...(options.headers || {})
                },
                body: JSON.stringify(data),
                signal: AbortSignal.timeout(window.API_CONFIG.timeout)
            });
            return await response.json();
        }
    };
    console.log('[Messages] API 对象快速初始化完成');
}

</script>

<script>
const messagesArea=document.getElementById('messagesArea'),chatInput=document.getElementById('chatInput'),sendBtn=document.getElementById('sendBtn');

// 对话历史保存功能
const CHAT_HISTORY_KEY='providence_chat_history';
const MAX_HISTORY_MESSAGES=50;

// 加载历史对话
function loadChatHistory(){
try{
const history=localStorage.getItem(CHAT_HISTORY_KEY);
if(history){
const messages=JSON.parse(history);
messages.forEach(msg=>{
if(msg.type&&msg.text&&msg.timestamp){
// 检查是否是今天的消息
const msgDate=new Date(msg.timestamp);
const today=new Date();
if(msgDate.toDateString()===today.toDateString()){
addMessage(msg.type,msg.text,msg.id,false);
}
}
});
}
}catch(e){
console.error('[历史记录]加载失败:',e);
}
}

// 保存消息到历史
function saveChatMessage(type,text,msgId){
try{
const history=JSON.parse(localStorage.getItem(CHAT_HISTORY_KEY)||'[]');
history.push({
type,
text,
id:msgId,
timestamp:Date.now()
});
// 只保留最近的消息
if(history.length>MAX_HISTORY_MESSAGES){
history.splice(0,history.length-MAX_HISTORY_MESSAGES);
}

localStorage.setItem(CHAT_HISTORY_KEY,JSON.stringify(history));
}catch(e){
console.error('[历史记录]保存失败:',e);
}
}

function quickAsk(question){chatInput.value=question;handleSend()}

function handleActionButton(action){if(!action)return;console.log("[AI按钮] 执行操作:",action);if(action.startsWith("query:")){const query=action.replace("query:","");chatInput.value=query;handleSend();}else if(action.startsWith("navigate:")){const url=action.replace("navigate:","");window.location.href=url;}else if(action.startsWith("api:")){const apiAction=action.replace("api:","");handleApiAction(apiAction);}}function handleApiAction(action){const token=localStorage.getItem("providence_token");if(!token){if(typeof showToast==="function"){showToast("请先登录");}window.location.href="login.html";return;}console.log("[API操作]",action);switch(action){case "recharge":window.location.href="recharge.html";break;case "withdraw":window.location.href="withdraw.html";break;case "vip":window.location.href="vip.html";break;case "investment":window.location.href="my-investments.html";break;case "team":window.location.href="team-rewards.html";break;case "ribao":window.location.href="ribao.html";break;default:if(typeof showToast==="function"){showToast("操作暂不支持");}}}

async function handleSend(){
const message=chatInput.value.trim();
if(!message)return;
chatInput.disabled=true;sendBtn.disabled=true;
const userMsgId=addMessage('user',message);
saveChatMessage('user',message,userMsgId);
chatInput.value='';
const loadingId='loading-'+Date.now();
addMessage('ai','<div class="typing"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>',loadingId,false);
try{
console.log('[AI] 发送消息:',message);
const result=await sendToAI(message);
console.log('[AI] 收到回复:',result);
const loadingEl=document.getElementById(loadingId);
if(loadingEl)loadingEl.remove();
if(result&&result.message){
const aiMsgId=addMessage('ai',result.message);
saveChatMessage('ai',result.message,aiMsgId);
if(result.actionButton){
const lastBubble=messagesArea.querySelector('.msg.ai:last-child .msg-bubble');
if(lastBubble){
lastBubble.insertAdjacentHTML('beforeend',`<div class="ai-action-buttons"><a href="${result.actionButton.link}" class="ai-action-btn">${result.actionButton.text}</a></div>`);
}
}

if(result.actionButtons && Array.isArray(result.actionButtons)){
const lastBubble=messagesArea.querySelector('.msg.ai:last-child .msg-bubble');
if(lastBubble){
const timestamp=Date.now();
const buttonsHtml=result.actionButtons.map((btn,index)=>{
const action=btn.action||btn.onclick||(btn.link?"navigate:"+btn.link:"");
return `<button class="ai-action-btn ${btn.type||""}" data-action="${action}">${btn.text}</button>`;
}).join('');
lastBubble.insertAdjacentHTML('beforeend',`<div class="ai-action-buttons">${buttonsHtml}</div>`);
}
}
}else{
addMessage('ai','抱歉，我暂时无法回答这个问题。');
}
}catch(error){
console.error('[AI] 错误:',error);
const loadingEl=document.getElementById(loadingId);
if(loadingEl)loadingEl.remove();
addMessage('ai','抱歉，服务暂时不可用，请稍后再试。');
}finally{
chatInput.disabled=false;sendBtn.disabled=false;chatInput.focus();
}
}

function addMessage(type,text,msgId,shouldSave=true){
const id=msgId||'msg-'+Date.now()+'-'+Math.random();
const avatar=type==='ai'?'<img src="img/logo-new.png" alt="Providence" onerror="this.style.display=\'none\';this.parentElement.innerHTML=\'🤖\';" />':'<img src="img/user-avatar-default.svg" alt="用户" onerror="this.style.display=\'none\';this.parentElement.innerHTML=\'👤\';" />';
const time=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
const html=`<div class="msg ${type}" id="${id}"><div class="msg-avatar">${avatar}</div><div class="msg-content"><div class="msg-bubble">${text}</div><div class="msg-time">${time}</div></div></div>`;
messagesArea.insertAdjacentHTML('beforeend',html);
setTimeout(()=>{messagesArea.scrollTop=messagesArea.scrollHeight},50);
return id;
}
