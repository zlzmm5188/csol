<body>
    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- 顶栏 -->
    <div class="topbar">
        <div class="topbar-inner">
            <a href="points-exchange.html" class="back-btn">←</a>
            <div class="page-title">兑换记录</div>
            <div class="placeholder"></div>
        </div>
    </div>

    <!-- 记录列表 -->
    <div class="container" id="recordList">
        <!-- 动态加载 -->
    </div>

    <script src="js/config.js?v=1763813622"></script>
    <script>
        // Toast提示
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // 加载兑换记录
        async function loadRecords() {
            try {
                const token = localStorage.getItem('providence_token');
                if (!token) {
                    showToast('请先登录');
                    setTimeout(() => window.location.href = 'login.html', 1000);
                    return;
                }

                const response = await fetch('https://api.4kp3l0iq.top/apiuser/points/logs', {
                    headers: { 'token': token }
                });

                const data = await response.json();

                if (data.code === 1 && data.data && data.data.length > 0) {
                    renderRecords(data.data);
                } else {
                    showEmptyState();
                }
            } catch (error) {
                console.error('加载失败:', error);
                showToast('加载失败，请重试');
                showEmptyState();
            }
        }

        // 渲染记录
        function renderRecords(records) {
            const container = document.getElementById('recordList');
            container.innerHTML = records.map(record => `
                <div class="record-item">
                    <div class="record-header">
                        <div class="record-type">积分兑换</div>
                        <div class="record-status">成功</div>
                    </div>
                    <div class="record-amount">+¥${record.amount_received || 0}</div>
                    <div class="record-details">
                        <div class="detail-item">
                            <span class="detail-label">消耗积分</span>
                            <span>${record.points_used || 0}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">汇率</span>
                            <span>${record.exchange_rate || 0.1}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">剩余积分</span>
                            <span>${record.after_points || 0}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">账户余额</span>
                            <span>¥${record.after_balance || 0}</span>
                        </div>
                    </div>
                    <div class="record-time">${record.created_at || ''}</div>
                </div>
            `).join('');
        }

        // 空状态
        function showEmptyState() {
            const container = document.getElementById('recordList');
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📭</div>
                    <div class="empty-text">暂无兑换记录</div>
                </div>
            `;
        }

        // 页面加载
        document.addEventListener('DOMContentLoaded', loadRecords);
    </script>
