<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>人脸找回密码 - Providence</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {

        height: 100%;
        overflow: hidden;
        position: fixed;
        background: linear-gradient(
          135deg,
          #0e2b44 0%,
          #1a3a5f 50%,
          #0e2b44 100%
        );
        background-attachment: fixed;
  padding-top: 60px;}

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue",
          sans-serif;
        color: #fff;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      .header {
        padding: 15px 20px;

        background: rgba(0, 0, 0, 0.2);
      }

      .title {
        font-size: 18px;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(
          135deg,
          #fff 0%,
          rgba(201, 169, 97, 0.9) 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .step-indicator {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 12px 20px;
        gap: 8px;
        background: rgba(0, 0, 0, 0.15);

      }

      .step {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .step-num {

        height: 24px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 12px;
      }

      .step.active .step-num {
        background: linear-gradient(
          135deg,
          rgba(201, 169, 97, 0.9),
          rgba(201, 169, 97, 0.7)
        );
      }

      .step.completed .step-num {
        background: rgba(76, 175, 80, 0.8);
      }

      .step-text {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
      }

      .step.active .step-text {
        color: rgba(201, 169, 97, 1);
        font-weight: 600;
      }

      .step-arrow {
        color: rgba(255, 255, 255, 0.3);
        font-size: 14px;
      }

      .content {
        flex: 1;
        padding: 15px 20px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .step-content {
        display: none;
      }

      .step-content.active {

        animation: fadeIn 0.3s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .form-group {
        margin-bottom: 15px;
      }

      .form-group label {

        font-size: 14px;
        color: rgba(255, 255, 255, 0.9);
        margin-bottom: 8px;
        font-weight: 600;
      }

      .form-group input {

        padding: 12px 14px;
        background: rgba(255, 255, 255, 0.1);
        border: 1.5px solid rgba(199, 181, 138, 0.4);
        border-radius: 10px;
        color: #fff;
        font-size: 15px;
      }

      .form-group input:focus {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(199, 181, 138, 0.8);
        outline: none;
      }

      .form-group input::placeholder {
        color: rgba(255, 255, 255, 0.4);
      }

      .camera-area {
        position: relative;

        max-
        aspect-ratio: 3/4;

        border-radius: 16px;
        overflow: hidden;
        background: #1a1a24;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        border: 2px solid rgba(212, 175, 55, 0.3);
      }

      #faceVideo {

        height: 100%;
        object-fit: cover;
      }

      #faceCanvas {
        display: none;
      }

      .face-guide {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);

        aspect-ratio: 1/1;
        border: 3px dashed rgba(212, 175, 55, 0.6);
        border-radius: 50%;
        pointer-events: none;
        animation: facePulse 2s ease-in-out infinite;
      }

      @keyframes facePulse {
        0%,
        100% {
          border-color: rgba(212, 175, 55, 0.4);
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          border-color: rgba(212, 175, 55, 0.8);
          transform: translate(-50%, -50%) scale(1.05);
        }
      }

      .camera-tip {
        position: absolute;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(10px);
        padding: 8px 16px;
        border-radius: 16px;
        color: #ffffff;
        font-size: 12px;
        font-weight: 500;
        max-

        z-index: 10;
      }

      .permission-guide {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.9);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
        border-radius: 16px;
      }

      .permission-guide.show {
        display: flex;
      }

      .permission-content {

        padding: 20px;
      }

      .permission-icon {
        font-size: 48px;
        margin-bottom: 16px;
        animation: bounce 1s ease-in-out infinite;
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      .permission-title {
        font-size: 18px;
        font-weight: 700;
        color: #fff;
        margin-bottom: 12px;
      }

      .permission-desc {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.8);
        line-height: 1.6;
        margin-bottom: 16px;
      }

      .permission-steps {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 12px;

        font-size: 12px;
        line-height: 1.8;
        color: rgba(255, 255, 255, 0.9);
      }

      .loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        display: none;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
      }

      .loading-overlay.show {
        display: flex;
      }

      .loading-spinner {

        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top-color: rgba(201, 169, 97, 0.9);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;

      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loading-text {
        font-size: 13px;
        font-weight: 500;
        color: #fff;

      }

      .btn {

        padding: 13px;
        background: linear-gradient(135deg, #0b3b5e, #0e4a78);
        border: none;
        border-radius: 10px;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(11, 59, 94, 0.4);
        transition: all 0.3s ease;
      }

      .btn:active {
        transform: scale(0.98);
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.1);
        border: 1.5px solid rgba(199, 181, 138, 0.4);
        margin-top: 10px;
        box-shadow: none;
      }

      .info-box {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(201, 169, 97, 0.3);
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 15px;
      }

      .info-row {
        display: flex;
        justify-content: space-between;
        padding: 6px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .info-row:last-child {
        border-bottom: none;
      }

      .info-label {
        color: rgba(255, 255, 255, 0.7);
        font-size: 13px;
      }

      .info-value {
        color: #fff;
        font-weight: 600;
        font-size: 13px;
      }

      .hint-text {

        color: rgba(255, 255, 255, 0.7);
        margin-bottom: 12px;
        font-size: 12px;
        line-height: 1.5;
      }

      .input-wrapper {
        position: relative;
      }

      .input-wrapper input {
        padding-right: 45px !important;
      }

      .eye-icon {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;

        height: 22px;
        opacity: 0.7;
      }

      .eye-icon:hover {
        opacity: 1;
      }

      .eye-icon svg {

        height: 100%;
        fill: rgba(199, 181, 138, 0.9);
      }

      .footer-links {

        padding: 12px;
        background: rgba(0, 0, 0, 0.15);

      }

      .footer-links a {
        color: rgba(199, 181, 138, 0.9);
        text-decoration: none;
        font-size: 13px;
        margin: 0 10px;
      }
          .brand { display: flex; flex-direction: row; align-items: center; gap: 8px; white-space: nowrap; justify-content: flex-start; }
          .page-title, .brand h1 { margin: 0; display: inline-block; white-space: nowrap; flex: 0 1 auto; }
    </style>
  </head>
  <body>
    <div class="header">
      <h1 class="title">人脸找回密码</h1>
    </div>

    <div class="step-indicator">
      <div class="step active" data-step="1">
        <div class="step-num">1</div>
        <div class="step-text">账号</div>
      </div>
      <div class="step-arrow">→</div>
      <div class="step" data-step="2">
        <div class="step-num">2</div>
        <div class="step-text">人脸</div>
      </div>
      <div class="step-arrow">→</div>
      <div class="step" data-step="3">
        <div class="step-num">3</div>
        <div class="step-text">密码</div>
      </div>
    </div>

    <div class="content">
      <!-- 步骤1: 输入账号 -->
      <div class="step-content active" data-content="1">
        <div class="form-group">
          <label>账号</label>
          <input
            type="text"
            id="username"
            placeholder="请输入您的账号"
            autocomplete="username"
          />
        </div>
        <button class="btn" onclick="goToFaceVerify()">下一步</button>
        <button class="btn btn-secondary" onclick="location.href='login.html'">
          返回登录
        </button>
      </div>

      <!-- 步骤2: 人脸识别 -->
      <div class="step-content" data-content="2">
        <p class="hint-text">将面部对准圆圈内，系统将与您的实名认证照片比对</p>
        <div class="camera-area">
          <video id="faceVideo" autoplay playsinline></video>
          <canvas id="faceCanvas"></canvas>
          <div class="face-guide"></div>
          <div class="camera-tip" id="cameraTip">请保持光线充足</div>

          <!-- 摄像头权限引导 -->
          <div class="permission-guide" id="permissionGuide">
            <div class="permission-content">
              <div class="permission-icon">📷</div>
              <div class="permission-title">需要使用摄像头</div>
              <div class="permission-desc">
                浏览器会请求摄像头权限<br />
                请点击"允许"以继续
              </div>
              <div class="permission-steps">
                <div>1️⃣ 点击浏览器弹出的提示</div>
                <div>2️⃣ 选择"允许"或"允许访问"</div>
                <div>3️⃣ 如果误点"拒绝"，请刷新页面</div>
              </div>
            </div>
          </div>

          <div class="loading-overlay" id="loadingOverlay">
            <div>
              <div class="loading-spinner"></div>
              <div class="loading-text">正在识别中...</div>
            </div>
          </div>
        </div>
        <button class="btn" id="captureBtn" onclick="captureFace()" disabled>
          拍摄并验证
        </button>
        <button class="btn btn-secondary" onclick="backToStep1()">
          返回上一步
        </button>
      </div>

      <!-- 步骤3: 设置新密码 -->
      <div class="step-content" data-content="3">
        <div class="info-box">
          <div class="info-row">
            <span class="info-label">账号</span>
            <span class="info-value" id="displayUsername">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">姓名</span>
            <span class="info-value" id="displayRealname">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">相似度</span>
            <span class="info-value" id="displaySimilarity">-</span>
          </div>
        </div>

        <div class="form-group">
          <label>新密码</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="newPassword"
              placeholder="8位以上，含大小写字母和特殊符号"
            />
            <span
              class="eye-icon"
              onclick="togglePassword('newPassword', this)"
            >
              <svg viewBox="0 0 24 24">
                <path
                  d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"
                />
              </svg>
            </span>
          </div>
        </div>

        <div class="form-group">
          <label>确认新密码</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="confirmPassword"
              placeholder="请再次输入新密码"
            />
            <span
              class="eye-icon"
              onclick="togglePassword('confirmPassword', this)"
            >
              <svg viewBox="0 0 24 24">
                <path
                  d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"
                />
              </svg>
            </span>
          </div>
        </div>

        <button class="btn" onclick="confirmResetPassword()">
          确认重置密码
        </button>
      </div>
    </div>

    <div class="footer-links">
      <a href="login.html">返回登录</a>
      <span style="color: rgba(255, 255, 255, 0.3)">|</span>
      <a href="register.html">注册账号</a>
    </div>

    <script src="ios-toast.js?v=1763813622"></script>
    <script src="api-new.js?v=1763813622"></script>
    <script>
      let currentStep = 1;
      let videoStream = null;
      let resetToken = null;
      let userInfo = {};

      function togglePassword(inputId, eyeIcon) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
          input.type = "text";
          eyeIcon.innerHTML = `<svg viewBox="0 0 24 24">
                    <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
                </svg>`;
        } else {
          input.type = "password";
          eyeIcon.innerHTML = `<svg viewBox="0 0 24 24">
                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>`;
        }
      }

      function switchStep(step) {
        document
          .querySelectorAll(".step-content")
          .forEach((el) => el.classList.remove("active"));
        document.querySelectorAll(".step").forEach((el) => {
          el.classList.remove("active");
          if (parseInt(el.dataset.step) < step) {
            el.classList.add("completed");
          }
        });

        document
          .querySelector(`[data-content="${step}"]`)
          .classList.add("active");
        document.querySelector(`[data-step="${step}"]`).classList.add("active");
        currentStep = step;

        if (step === 2) {
          initCamera();
        }
      }

      async function goToFaceVerify() {
        const username = document.getElementById("username").value.trim();
        if (!username) {
          await showToast("提示", "请输入账号");
          return;
        }
        userInfo.username = username;
        switchStep(2);
      }

      function backToStep1() {
        if (videoStream) {
          videoStream.getTracks().forEach((track) => track.stop());
        }
        switchStep(1);
      }

      async function initCamera() {
        try {
          const video = document.getElementById("faceVideo");
          const permissionGuide = document.getElementById("permissionGuide");
          const cameraTip = document.getElementById("cameraTip");

          // 显示权限引导
          permissionGuide.classList.add("show");
          cameraTip.textContent = "请授权摄像头访问";

          // 请求摄像头权限
          videoStream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: "user",

          // 隐藏权限引导
          permissionGuide.classList.remove("show");

          video.srcObject = videoStream;
          await video.play();

          cameraTip.textContent = "请将面部对准圆圈内";
          document.getElementById("captureBtn").disabled = false;
        } catch (error) {
          console.error("摄像头初始化失败:", error);
          document.getElementById("permissionGuide").classList.remove("show");

          if (error.name === "NotAllowedError") {
            await showToast(
              "提示",
              "摄像头权限被拒绝，请在浏览器设置中允许访问"
            );
          } else {
            await showToast("错误", "无法访问摄像头：" + error.message);
          }

          setTimeout(() => backToStep1(), 2000);
        }
      }

      async function captureFace() {
        const video = document.getElementById("faceVideo");
        const canvas = document.getElementById("faceCanvas");

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0);
        const faceImage = canvas.toDataURL("image/jpeg", 0.9);

        document.getElementById("loadingOverlay").classList.add("show");
        document.getElementById("captureBtn").disabled = true;

        try {
          const res = await fetch(
            "https://api.4kp3l0iq.top/api/user/user/submitFaceForReview",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                username: userInfo.username,
                face_image: faceImage,
              }),
            }
          );

          const result = await res.json();

          if (result.code === 1 || result.code === 200 && result.data.passed) {
            resetToken = result.data.reset_token;
            userInfo = { ...userInfo, ...result.data };

            if (videoStream) {
              videoStream.getTracks().forEach((track) => track.stop());
            }

            document.getElementById("displayUsername").textContent =
              result.data.username;
            document.getElementById("displayRealname").textContent =
              result.data.realname || "-";
            document.getElementById("displaySimilarity").textContent =
              result.data.similarity + "%";

            await showToast("成功", "人脸验证成功！");
            switchStep(3);
          } else {
            await showToast(
              "验证失败",
              result.msg || result.data?.message || "人脸识别失败"
            );
            document.getElementById("captureBtn").disabled = false;
          }
        } catch (error) {
          console.error("人脸识别错误:", error);
          await showToast("错误", "网络错误，请稍后重试");
          document.getElementById("captureBtn").disabled = false;
        } finally {
          document.getElementById("loadingOverlay").classList.remove("show");
        }
      }

      async function confirmResetPassword() {
        const newPassword = document.getElementById("newPassword").value.trim();
        const confirmPassword = document
          .getElementById("confirmPassword")
          .value.trim();

        if (!newPassword) {
          await showToast("提示", "请输入新密码");
          return;
        }

        if (newPassword.length < 8) {
          await showToast("提示", "密码长度不少于8位");
          return;
        }

        if (!/[a-z]/.test(newPassword)) {
          await showToast("提示", "密码必须包含小写字母");
          return;
        }

        if (!/[A-Z]/.test(newPassword)) {
          await showToast("提示", "密码必须包含大写字母");
          return;
        }

        if (!/[!@#$%^&*(),.?":{}|<>]/.test(newPassword)) {
          await showToast("提示", "密码必须包含至少一位特殊符号");
          return;
        }

        if (newPassword !== confirmPassword) {
          await showToast("提示", "两次密码输入不一致");
          return;
        }

        try {
          const res = await fetch(
            "https://api.4kp3l0iq.top/api/user/user/resetPassword",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                reset_token: resetToken,
                new_password: newPassword,
                confirm_password: confirmPassword,
              }),
            }
          );

          const result = await res.json();

          if (result.code === 1 || result.code === 200) {
            await showToast("成功", "密码重置成功！即将跳转到登录页面");
            setTimeout(() => {
              location.href = "login.html";
            }, 1500);
          } else {
            await showToast("失败", result.msg || "密码重置失败");
          }
        } catch (error) {
          console.error("密码重置错误:", error);
          await showToast("错误", "网络错误，请稍后重试");
        }
      }

      window.addEventListener("beforeunload", function () {
        if (videoStream) {
          videoStream.getTracks().forEach((track) => track.stop());
        }
      });
    </script>

    <script src="smart-swipe-control.js?v=1763813622"></script>


  </body>
