        .vip-banner {
            background: linear-gradient(135deg, #D9B45D, #E6C56E);

            }

                left: 100%;
            }

        }

        .section-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.3s ease;
            padding: 0 20px;
        }

        .section-card.active .section-content {
            max-height: 2000px;
            padding: 0 20px 20px 20px;
        }

        /* 表格样式（放大） */
        .data-table {

            border-collapse: collapse;

        .data-table th {

        .data-table td {

        }

        .data-table tr:last-child td {

        }

        .data-table .highlight {

        .data-table .vip-level {

        /* 说明文字（放大） */

<body>
    <!-- 顶部导航 -->
    <div class="vip-header">

    </div>

    <!-- 主容器 -->
    <div class="vip-container">
        <!-- VIP Banner -->
        <div class="vip-banner">
            <div class="vip-banner-icon">👑</div>
            <div class="vip-banner-title">VIP专属权益</div>

        <div class="section-card" onclick="toggleSection(this)">

                    <span class="section-icon">👥</span>

            </div>
            <div class="section-content">
                <div id="loading1" class="loading" style="padding:20px;color:rgba(255,255,255,0.6);">
                    加载中...</div>
                <table class="data-table" id="inviteTable" style="display:none;">
                    <thead>
                        <tr>
                            <th>会员等级</th>
                            <th>一级返佣</th>
                            <th>二级返佣</th>
                        </tr>
                    </thead>
                    <tbody id="inviteTableBody">
                    </tbody>
                </table>
                <div class="table-note" id="inviteNote" style="display:none;">
                    <div class="table-note-item">根据等级邀请好友，可获得邀请奖励百分比</div>
                    <div class="table-note-item">一级返佣：直推会员投资时的返佣比例</div>

                </div>
            </div>
        </div>

        <!-- 会员升级条件与额外加息板块 -->
        <div class="section-card" onclick="toggleSection(this)">
            <div class="section-header">
                <div class="section-header-left">
                    <span class="section-icon">💰</span>
                    <span class="section-title">会员升级条件与额外加息</span>
                </div>
                <span class="section-toggle">▼</span>
            </div>
            <div class="section-content">
                <div id="loading2" class="loading" style="padding:20px;color:rgba(255,255,255,0.6);">
                    加载中...</div>
                <table class="data-table" id="upgradeTable" style="display:none;">
                    <thead>
                        <tr>
                            <th>会员等级</th>
                            <th>累计投资</th>
                            <th>额外加息</th>
                        </tr>
                    </thead>
                    <tbody id="upgradeTableBody">
                    </tbody>
                </table>
                <div class="table-note" id="upgradeNote" style="display:none;">
                    <div class="table-note-item">当您的累计投资达到对应金额时，自动升级VIP等级</div>
                    <div class="table-note-item">VIP加息会叠加到所有项目的基础收益率上</div>
                    <div class="table-note-item">最终收益率 = 项目基础年化 + VIP加息率</div>
                </div>
            </div>
        </div>

        <!-- 每日签到积分板块 -->
        <div class="section-card" onclick="toggleSection(this)">
            <div class="section-header">
                <div class="section-header-left">
                    <span class="section-icon">📅</span>
                    <span class="section-title">每日签到积分（固定）</span>
                </div>

                    加载中...</div>
                <table class="data-table" id="signTable" style="display:none;">
                    <thead>
                        <tr>
                            <th>会员等级</th>
                            <th>每日签到积分</th>
                        </tr>
                    </thead>

    <script src="api-new.js?v=1763813622"></script>
    <script>
        // 折叠展开功能
        function toggleSection(card) {
            const isActive = card.classList.contains('active');

            // 如果点击的是当前激活的，则关闭
            if (isActive) {
                card.classList.remove('active');
            } else {
                // 关闭其他所有板块
                document.querySelectorAll('.section-card').forEach(c => {
                    c.classList.remove('active');
                });
                // 打开当前板块
                card.classList.add('active');

                // 如果是第一次打开，加载数据
                const sectionId = card.querySelector('.section-icon').textContent;
                if (sectionId === '👥' && !card.dataset.loaded1) {
                    card.dataset.loaded1 = 'true';
                    renderInviteTable();
                } else if (sectionId === '💰' && !card.dataset.loaded2) {
                    card.dataset.loaded2 = 'true';
                    renderUpgradeTable();
                } else if (sectionId === '📅' && !card.dataset.loaded3) {
                    card.dataset.loaded3 = 'true';
                    renderSignTable();
                }
            }
        }

        // 邀请奖励数据（固定）
        const inviteRewardData = [
            { level: 'VIP0', level1: 1, level2: 0 },
            { level: 'VIP1', level1: 2, level2: 1 },
            { level: 'VIP2', level1: 3, level2: 2 },
            { level: 'VIP3', level1: 4, level2: 2 },
            { level: 'VIP4', level1: 5, level2: 3 },
            { level: 'VIP5', level1: 5, level2: 4 },
            { level: 'VIP6', level1: 6, level2: 4 },
            { level: 'VIP7', level1: 6, level2: 5 },
            { level: 'VIP8', level1: 7, level2: 5 }
        ];

        // 升级条件与加息数据（固定）
        const upgradeData = [
            { level: 'VIP1', invest: 30000, addRate: 0.05 },
            { level: 'VIP2', invest: 100000, addRate: 0.1 },
            { level: 'VIP3', invest: 250000, addRate: 0.12 },
            { level: 'VIP4', invest: 800000, addRate: 0.15 },
            { level: 'VIP5', invest: 1500000, addRate: 0.16 },
            { level: 'VIP6', invest: 3800000, addRate: 0.18 },
            { level: 'VIP7', invest: 8000000, addRate: 0.23 },
            { level: 'VIP8', invest: 13000000, addRate: 0.25 }
        ];

        // 签到积分数据（固定）
        const signData = [
            { level: 'VIP0', points: 6 },
            { level: 'VIP1', points: 10 },
            { level: 'VIP2', points: 16 },
            { level: 'VIP3', points: 20 },
            { level: 'VIP4', points: 30 },
            { level: 'VIP5', points: 40 },
            { level: 'VIP6', points: 50 },
            { level: 'VIP7', points: 60 },
            { level: 'VIP8', points: 70 }
        ];

        // 格式化金额
        function formatAmount(amount) {
            if (amount >= 100000000) {
                return (amount / 100000000).toFixed(1) + '亿';
            }
            if (amount >= 10000) {
                return (amount / 10000).toFixed(0) + '万';
            }
            return amount.toLocaleString();
        }

        // 渲染邀请奖励表格
        function renderInviteTable() {
            const loading = document.getElementById('loading1');
            const table = document.getElementById('inviteTable');
            const tableBody = document.getElementById('inviteTableBody');
            const tableNote = document.getElementById('inviteNote');

            const rows = inviteRewardData.map(item => `
            <tr>
                <td class="vip-level">${item.level}</td>
                <td class="highlight">${item.level1}%</td>
                <td>${item.level2}%</td>
            </tr>
        `).join('');

            tableBody.innerHTML = rows;
            loading.style.display = 'none';
            table.style.display = 'table';
            tableNote.style.display = 'block';
        }

        // 渲染升级条件表格
        function renderUpgradeTable() {
            const loading = document.getElementById('loading2');
            const table = document.getElementById('upgradeTable');
            const tableBody = document.getElementById('upgradeTableBody');
            const tableNote = document.getElementById('upgradeNote');

            const rows = upgradeData.map(item => `
            <tr>
                <td class="vip-level">${item.level}</td>
                <td>¥${formatAmount(item.invest)}</td>
                <td class="highlight">+${item.addRate}%</td>
            </tr>
        `).join('');

            tableBody.innerHTML = rows;
            loading.style.display = 'none';
            table.style.display = 'table';
            tableNote.style.display = 'block';
        }

        // 渲染签到积分表格
        function renderSignTable() {
            const loading = document.getElementById('loading3');
            const table = document.getElementById('signTable');
            const tableBody = document.getElementById('signTableBody');
            const tableNote = document.getElementById('signNote');

            const rows = signData.map(item => `
            <tr>
                <td class="vip-level">${item.level}</td>
                <td class="highlight">${item.points 积分</td>
            </tr>
        `).join('');

            tableBody.innerHTML = rows;
            loading.style.display = 'none';
            table.style.display = 'table';
            tableNote.style.display = 'block';
        
    </script>
    <script src="page-lifecycle.js?v=1763813622"></script>
    <script src="smart-swipe-control.js?v=1763813622"></script>
