    <script>
      // 禁止左右滑动手势（防止浏览器前进/后退）
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      let lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, false);

      // 禁止水平滑动
      let startX = 0;
      let startY = 0;
      document.addEventListener('touchstart', function(e) {
        startX = e.touches[0].pageX;
        startY = e.touches[0].pageY;
      }, { passive: true });

      document.addEventListener('touchmove', function(e) {
        const moveX = e.touches[0].pageX;
        const moveY = e.touches[0].pageY;
        const diffX = Math.abs(moveX - startX);
        const diffY = Math.abs(moveY - startY);

        // 如果水平移动大于垂直移动，阻止默认行为（禁止左右滑动）
        if (diffX > diffY && diffX > 10) {
          e.preventDefault();
        }
      }, { passive: false });
    </script>

<body>

    <div class="top">
        <div class="top-bar">
            <div class="back-btn" onclick="history.back()">‹</div>
            <div class="page-title">每日签到</div>
        </div>

                <div class="olabel">今日积分</div>

            </div>
            <div class="ocard">
                <div class="olabel">连续签到</div>
                <div class="ovalue" id="continuousDays">0天</div>
            </div>
            <div class="ocard">
                <div class="olabel">本月签到</div>
                <div class="ovalue" id="monthCount">0次</div>
            </div>
        </div>
    </div>

    <div class="main">

        <div class="month-nav">
            <div class="mnav" onclick="prevMonth()">‹</div>
            <div class="mname" id="monthName">2025年 11月</div>
            <div class="mnav" onclick="nextMonth()">›</div>
        </div>

        <div class="cal">
            <div class="cal-head">
                <div class="cal-th">日</div>

        </div>

            <button class="checkin-btn" id="checkinBtn" onclick="doCheckin()">立即签到</button>
        </div>

    </div>

    <!-- iOS原生风格弹窗 -->
    <div class="ios-toast" id="iosToast">
        <div class="ios-toast-title" id="iosToastTitle"></div>
        <div class="ios-toast-message" id="iosToastMessage"></div>
        <div class="ios-toast-buttons">
            <div class="ios-toast-button only-button" id="iosToastConfirm">确定</div>
        </div>
    </div>

    <script>
        const API_BASE = window.API_CONFIG?.baseURL || 'https://api.4kp3l0iq.top/api';
        let year = new Date().getFullYear(), month = new Date().getMonth() + 1;
        let signData = {}; // 签到数据：{date: {signed: true, points: 10}}
        let signInfo = {}; // 签到信息
        let userData = { token: localStorage.getItem('providence_token') || '' };

        // iOS原生风格弹窗
        function showToast(title, message) {
            const toast = document.getElementById('iosToast');
            const titleEl = document.getElementById('iosToastTitle');
            const msgEl = document.getElementById('iosToastMessage');
            const confirmBtn = document.getElementById('iosToastConfirm');

            titleEl.textContent = title;
            msgEl.textContent = message;
            toast.classList.add('show');

            confirmBtn.onclick = () => {
                toast.classList.remove('show');
            };
        }

        // 加载签到信息
        async function loadSignInfo() {
            try {
                const response = await fetch(API_BASE + '/user/sign/info', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'token': userData.token
                    }
                });
                const data = await response.json();
                console.log('[签到] API响应:', data);

                if (data.code === 1 && data.data) {
                    signInfo = data.data;
                    updateOverview(data.data);
                    // 更新按钮状态
                    const btn = document.getElementById('checkinBtn');
                    if (data.data.is_signed) {
                        btn.disabled = true;
                        btn.textContent = '今日已签到';
                    } else {
                        btn.disabled = false;
                        btn.textContent = '立即签到 +' + data.data.today_points + '积分';
                    }
                }
            } catch (error) {
                console.error('[签到] 加载签到信息失败:', error);
            }
        }

        // 更新顶部统计
        function updateOverview(data) {
            document.getElementById('todayPoints').textContent = '+' + (data.today_points || 0);
            document.getElementById('continuousDays').textContent = (data.continuous_days || 0) + '天';
            document.getElementById('monthCount').textContent = (data.month_sign_count || 0) + '次';

            console.log('[签到] 更新总览:', data);
        }

        // 执行签到
        async function doCheckin() {
            const btn = document.getElementById('checkinBtn');
            if (btn.disabled) return;

            try {
                btn.disabled = true;
                btn.textContent = '签到中...';

                const response = await fetch(API_BASE + '/user/sign/sign', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'token': userData.token
                    }
                });

                const text = await response.text();
                console.log('[签到] 原始响应:', text.substring(0, 200));

                // 检查是否是HTML错误页面
                if (text.trim().startsWith('<!DOCTYPE') || text.trim().startsWith('<html') || text.includes('系统发生错误')) {
                    console.error('[签到] 服务器返回HTML错误页面');
                    showToast('签到失败', '服务器错误，请稍后重试或联系客服');
                    btn.disabled = false;
                    btn.textContent = '立即签到';
                    return;
                }

                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    console.error('[签到] JSON解析失败:', e);
                    showToast('签到失败', '服务器返回格式错误');
                    btn.disabled = false;
                    btn.textContent = '立即签到';
                    return;
                }

                console.log('[签到] 签到响应:', data);

                if (data.code === 1) {
                    showToast('签到成功', data.message || data.msg || '恭喜您，获得' + signInfo.today_points + '积分');
                    // 重新加载数据
                    setTimeout(() => {
                        loadData();
                    }, 1500);
                } else {
                    showToast('签到失败', data.message || data.msg || '请稍后重试');
                    btn.disabled = false;
                    btn.textContent = '立即签到';
                }
            } catch (error) {
                console.error('[签到] 签到失败:', error);
                showToast('签到失败', '网络错误，请稍后重试');
                btn.disabled = false;
                btn.textContent = '立即签到';
            }
        }

        function render() {
            const first = new Date(year, month - 1, 1).getDay();
            const days = new Date(year, month, 0).getDate();
            const body = document.getElementById('calBody');
            body.innerHTML = '';
            document.getElementById('monthName').textContent = `${year}年 ${month}月`;

            // 上月空格
            for (let i = 0; i < first; i++) {
                const c = document.createElement('div');
                c.className = 'cal-cell other';
                body.appendChild(c);
            }

            const today = new Date();
            const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

            for (let d = 1; d <= days; d++) {
                const c = document.createElement('div');
                const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const isToday = dateStr === todayStr;
                const dayData = signData[dateStr] || {};
                const signed = dayData.signed || false;

                c.className = `cal-cell ${isToday ? 'today' : ''} ${signed ? 'signed' : ''}`;
                c.innerHTML = `<div class="cnum">${d}</div>${signed ? '<div class="check-mark">✓</div>' : ''}`;
                c.onclick = () => {
                    if (signed) {
                        showToast(`${month}月${d}日`, `已签到\n获得积分：${dayData.points || 0}`);
                    } else {
                        showToast(`${month}月${d}日`, '未签到');
                    }
                };
                body.appendChild(c);
            }

            // 如果是当前月，标记今天之前的日期为已签到（模拟）
            if (year === today.getFullYear() && month === today.getMonth() + 1 && signInfo.month_sign_count > 0) {
                // 这里应该从后端获取具体哪些天签到了
                // 暂时只标记今天
                if (signInfo.is_signed) {
                    signData[todayStr] = { signed: true, points: signInfo.today_points || 0 };
                }
                render(); // 重新渲染
            }
        }

        function prevMonth() {
            month--;
            if (month < 1) { month = 12; year-- }
            render();
        }

        function nextMonth() {
            month++;
            if (month > 12) { month = 1; year++ }
            render();
        }

        function loadData() {
            loadSignInfo().then(() => {
                render();
            });
        }

        // 初始化
        loadData();
    </script>
    <script src="page-lifecycle.js?v=1763813622"></script>
    <script defer src="smart-swipe-control.js?v=1763813622"></script>


</body>
