    <script>
      let currentTab = "in";
      let currentCurrency = "CNY";
      let transferAmount = 0;
      let ribaoData = {
        CNY: { balance: 0, todayEarnings: 0, totalEarnings: 0, rate: 0.001 },
        USDT: { balance: 0, todayEarnings: 0, totalEarnings: 0, rate: 0.002 },
      };

      // 右滑返回
      let touchStartX = 0,
        touchEndX = 0;

      document.addEventListener("touchstart", (e) => {
        touchStartX = e.changedTouches[0].screenX;
      });

      document.addEventListener("touchend", (e) => {
        touchEndX = e.changedTouches[0].screenX;
        if (touchEndX - touchStartX > 100) {
          history.back();
        }
      });

      document.addEventListener("DOMContentLoaded", function () {
        // 检查登录状态（新版本token检查）
        if (!ApiService.auth.requireLogin()) return;

        // 初始化为CNY金色模式
        updateColorMode("CNY");

        loadRibaoData();
        loadRates();
        loadUserBalance(); // 加载用户钱包余额
      });

      async function loadRibaoData() {
        try {
          const res = await fetch(
            "https://api.4kp3l0iq.top/api/user/api/ribao/info",
            {
              method: "GET",
              headers: {
                "Content-Type": "application/json",
                token:
                  localStorage.getItem("providence_token") ||
                  localStorage.getItem("token") ||
                  "",
              },
            }
          );
          const result = await res.json();
          if (result.code === 1 && result.data) {
            ribaoData.CNY = result.data.CNY || ribaoData.CNY;
            ribaoData.USDT = result.data.USDT || ribaoData.USDT;
            updateDisplay();
          }
        } catch (e) {
          console.error("加载日利宝数据失败:", e);
        }
      }

      async function loadRates() {
        try {
          const res = await fetch(
            "https://api.4kp3l0iq.top/api/user/api/ribao/info",
            {
              method: "GET",
              headers: {
                "Content-Type": "application/json",
                token:
                  localStorage.getItem("providence_token") ||
                  localStorage.getItem("token") ||
                  "",
              },
            }
          );
          const result = await res.json();
          if (result.code === 1 && result.data) {
            ribaoData.CNY.rate = result.data.CNY?.rate || 0.001;
            ribaoData.USDT.rate = result.data.USDT?.rate || 0.002;
            updateRateDisplay();
          }
        } catch (e) {
          console.error("加载收益率失败:", e);
        }
      }

      function switchCurrency(currency) {
        currentCurrency = currency;

        // 移除所有active类
        document.querySelectorAll(".currency-tab").forEach((tab) => {
          tab.classList.remove("active");
        });

        // 为当前选中的tab添加active类
        document
          .querySelector(`.currency-tab[data-currency="${currency}"]`)
          .classList.add("active");

        // 动态切换所有按钮的颜色模式
        updateColorMode(currency);

        updateDisplay();
        updateRateDisplay();
      }

      function updateColorMode(currency) {
        const modeClass = currency === "CNY" ? "cny-mode" : "usdt-mode";
        const removeClass = currency === "CNY" ? "usdt-mode" : "cny-mode";

        // 更新标题颜色
        const heroTitle = document.getElementById("heroTitle");
        if (heroTitle) {
          heroTitle.classList.remove(removeClass);
          heroTitle.classList.add(modeClass);
        }

        // 更新转入/转出tab按钮
        document.querySelectorAll(".tab-btn").forEach((btn) => {
          btn.classList.remove(removeClass);
          btn.classList.add(modeClass);
        });

        // 更新确认按钮
        document.querySelectorAll(".submit-btn").forEach((btn) => {
          btn.classList.remove(removeClass);
          btn.classList.add(modeClass);
        });

        // 更新快捷金额按钮
        document.querySelectorAll(".quick-btn").forEach((btn) => {
          btn.classList.remove(removeClass);
          btn.classList.add(modeClass);
        });

        // 更新密码输入框
        const passwordInput = document.getElementById("payPassword");
        if (passwordInput) {
          passwordInput.classList.remove(removeClass);
          passwordInput.classList.add(modeClass);
        }
      }

      function updateDisplay() {
        const data = ribaoData[currentCurrency];
        const symbol = currentCurrency === "USDT" ? "$" : "¥";
        document.getElementById("ribaoBalance").textContent =
          symbol + data.balance.toFixed(currentCurrency === "USDT" ? 4 : 2);
        document.getElementById("todayEarnings").textContent =
          symbol +
          data.todayEarnings.toFixed(currentCurrency === "USDT" ? 4 : 2);
        document.getElementById("totalEarnings").textContent =
          symbol +
          data.totalEarnings.toFixed(currentCurrency === "USDT" ? 4 : 2);
      }

      function updateRateDisplay() {
        const rate = (ribaoData[currentCurrency].rate * 100).toFixed(2);
        document.getElementById("rateIn").textContent = rate + "%";
        const currencyName = currentCurrency === "CNY" ? "人民币" : "USDT";
        document.getElementById("rateTip").textContent =
          `${currencyName}日收益率：${rate}%`;
      }

      function switchTab(tab) {
        currentTab = tab;
        document
          .querySelectorAll(".tab-btn")
          .forEach((btn) => btn.classList.remove("active"));
        document
          .querySelectorAll(".form-area")
          .forEach((area) => area.classList.remove("active"));

        const modeClass = currentCurrency === "CNY" ? "cny-mode" : "usdt-mode";

        if (tab === "in") {
          const btn = document.querySelector(".tab-btn:first-child");
          btn.classList.add("active");
          btn.classList.add(modeClass);
          document.getElementById("formIn").classList.add("active");
        } else {
          const btn = document.querySelector(".tab-btn:last-child");
          btn.classList.add("active");
          btn.classList.add(modeClass);
          document.getElementById("formOut").classList.add("active");
        }
      }

      function quickAmount(type, value) {
        const input =
          type === "in"
            ? document.getElementById("amountIn")
            : document.getElementById("amountOut");
        if (value === "all") {
          const precision = currentCurrency === "USDT" ? 4 : 2;
          input.value = ribaoData[currentCurrency].balance.toFixed(precision);
        } else {
          input.value = value;
        }
      }

      function confirmTransfer(type) {
        const input =
          type === "in"
            ? document.getElementById("amountIn")
            : document.getElementById("amountOut");
        const amount = parseFloat(input.value);

        if (!amount || amount <= 0) {
          showToast("", "请输入有效金额");
          return;
        }

        if (type === "in") {
          // 检查转入金额最低限制
          if (amount < 100) {
            showToast("", "转入金额最低100起");
            return;
          }

          // 检查用户余额是否足够（需要从API获取用户余额）
          // 暂时假设余额存储在 userBalance 对象中
          const userBalance = getUserBalance(currentCurrency);
          if (amount > userBalance) {
            showToast(
              "",
              `${currentCurrency === "CNY" ? "人民币" : "USDT"}余额不足`
            );
            return;
          }
        }

        if (type === "out" && amount > ribaoData[currentCurrency].balance) {
          showToast("", "日利宝余额不足");
          return;
        }

        transferAmount = amount;
        document.getElementById("passwordPopup").classList.add("show");
        setTimeout(() => {
          document.getElementById("payPassword").focus();
        }, 300);
      }

      // 获取用户钱包余额（需要从API加载）
      let userBalances = {
        CNY: 0,
        USDT: 0,
      };

      function getUserBalance(currency) {
        return userBalances[currency] || 0;
      }

      // 在页面加载时获取用户余额
      async function loadUserBalance() {
        try {
          const res = await ApiService.finance.getUserBalance();
          if (res.code === 1 && res.data) {
            userBalances.CNY = parseFloat(res.data.balance || 0);
            userBalances.USDT = parseFloat(res.data.usdt_balance || 0);
          }
        } catch (e) {
          console.error("加载用户余额失败:", e);
        }
      }

      async function submitTransfer() {
        const pwd = document.getElementById("payPassword").value.trim();

        if (!pwd || pwd.length !== 6) {
          const popup = document.getElementById("popupContent");
          popup.classList.add("shake");
          setTimeout(() => popup.classList.remove("shake"), 300);
          showToast("", "请输入6位支付密码");
          return;
        }

        try {
          const res = await fetch(
            "https://api.4kp3l0iq.top/api/user/api/ribao/transfer-in",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                token:
                  localStorage.getItem("providence_token") ||
                  localStorage.getItem("token") ||
                  "",
              },
              body: JSON.stringify({
                type: currentTab,
                currency: currentCurrency,
                amount: transferAmount,
                pay_password: pwd,
              }),
            }
          );

          const result = await res.json();

          if (result.code === 1) {
            closePopup();
            showToast("", currentTab === "in" ? "转入成功" : "转出成功");
            document.getElementById("amountIn").value = "";
            document.getElementById("amountOut").value = "";
            loadRibaoData();
          } else {
            showToast("", result.message || "操作失败");
          }
        } catch (e) {
          showToast("", "网络错误，请重试");
        }
      }

      function closePopup() {
        document.getElementById("passwordPopup").classList.remove("show");
        document.getElementById("payPassword").value = "";
      }
    </script>

    <script src="smart-swipe-control.js?v=1763813622"></script>


  </body>
