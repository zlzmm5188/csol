    <div id="app">
      <div class="header">
        <img
          src="img/logo.png"
          alt="Providence"
          class="logo"
          onerror="this.style.display='none'"

        <h1 class="title">PROVIDENCE</h1>
        <p class="subtitle">EQUITY PARTNERS</p>
      </div>

      <form
        id="loginForm"
        class="form-container"
        onsubmit="event.preventDefault(); handleLoginOrForgot(); return false;"
      >
        <div class="form-group">
          <label for="loginUsername">账号</label>
          <input
            type="text"
            id="loginUsername"
            name="username"
            placeholder="请输入账号"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group" id="passwordGroup">
          <label for="loginPassword">密码</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="loginPassword"
              name="password"
              placeholder="请输入密码"
              autocomplete="current-password"
              required
            />
            <span
              class="eye-icon"
              onclick="togglePassword('loginPassword', this)"
            >
              <svg viewBox="0 0 24 24" class="eye-open">
                <path
                  d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"
                />
              </svg>
            </span>
          </div>
        </div>

        <div class="form-actions">
          <label class="remember-checkbox" id="rememberCheckbox">
            <input type="checkbox" id="rememberPassword" name="rememberMe" />
            <span>记住密码</span>
          </label>
          <a
            href="javascript:void(0)"
            onclick="toggleForgotMode()"
            id="forgotLink"
            >忘记密码</a
          >
        </div>

        <button type="submit" class="btn" id="btnLogin">
          <span id="btnText">登录</span>
        </button>

        <div id="backToLogin" style="display: none; margin-top: 12px">
          <a
            href="javascript:void(0)"
            onclick="toggleForgotMode()"
            style="
              color: rgba(199, 181, 138, 0.9);
              font-size: 14px;
              text-decoration: none;
            "
            >返回登录</a

    <script>
      // 表单提交处理（支持回车键登录）
      document.addEventListener("DOMContentLoaded", function () {
        const loginForm = document.getElementById("loginForm");
        if (loginForm) {
          loginForm.addEventListener("submit", function (e) {
            e.preventDefault();
            if (typeof handleLoginOrForgot === "function") {
              handleLoginOrForgot();
            }
          });
        }
      });

      // 切换密码可见性
      function togglePassword(inputId, eyeIcon) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
          input.type = "text";
          eyeIcon.innerHTML = `<svg viewBox="0 0 24 24" class="eye-closed">
          <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
        </svg>`;
        } else {
          input.type = "password";
          eyeIcon.innerHTML = `<svg viewBox="0 0 24 24" class="eye-open">
          <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
        </svg>`;
        }
      }

      // 忘记密码模式切换
      let isForgotMode = false;
      function toggleForgotMode() {
        isForgotMode = !isForgotMode;
        const passwordGroup = document.getElementById("passwordGroup");
        const rememberCheckbox = document.getElementById("rememberCheckbox");
        const forgotLink = document.getElementById("forgotLink");
        const btnText = document.getElementById("btnText");
        const backToLogin = document.getElementById("backToLogin");

        if (isForgotMode) {
          passwordGroup.style.display = "none";
          rememberCheckbox.style.display = "none";
          forgotLink.style.display = "none";
          btnText.textContent = "下一步";
          backToLogin.style.display = "block";
        } else {
          passwordGroup.style.display = "block";
          rememberCheckbox.style.display = "flex";
          forgotLink.style.display = "block";
          btnText.textContent = "登录";
          backToLogin.style.display = "none";
        }
      }

      // 处理登录或忘记密码
      async function handleLoginOrForgot() {
        if (isForgotMode) {
          // 忘记密码模式 - 先验证账号
          const username = document
            .getElementById("loginUsername")
            .value.trim();
          if (!username) {
            await showToast("", "请输入账号");
            return;
          }

          // 显示加载状态
          const btnLogin = document.getElementById("btnLogin");
          const btnText = document.getElementById("btnText");
          const originalText = btnText.textContent;
          btnLogin.disabled = true;
          btnText.textContent = "验证中...";

          try {
            // 验证账号是否存在
            // 确保API_CONFIG已加载
            let API_BASE = "https://api.4kp3l0iq.top/api"; // 默认值
            if (
              typeof window.API_CONFIG !== "undefined" &&
              window.API_CONFIG &&
              window.API_CONFIG.baseURL
            ) {
              API_BASE = window.API_CONFIG.baseURL;
            }

            const res = await fetch(
              API_BASE + "/user/user/checkUsername",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username: username }),
              }
            );
            const result = await res.json();

            if (result.code === 1 || result.code === 200) {
              // 账号存在，保存到sessionStorage并跳转
              sessionStorage.setItem("forgot_username", username);
              await showToast("", "账号验证成功");
              setTimeout(() => {
                window.location.href = "reset-password-local.html";
              }, 500);
            } else {
              // 账号不存在
              await showToast("", result.message || result.msg || "账号不存在");
              btnLogin.disabled = false;
              btnText.textContent = originalText;
            }
          } catch (e) {
            console.error("[验证账号] 失败:", e);
            await showToast("", "网络错误，请重试");
            btnLogin.disabled = false;
            btnText.textContent = originalText;
          }
        } else {
          // 正常登录模式
          handleLogin();
        }
      }

      // 记住密码功能 - 页面加载时恢复
      window.addEventListener("DOMContentLoaded", function () {
        const savedUsername = localStorage.getItem("saved_username");
        const savedPassword = localStorage.getItem("saved_password");
        const rememberChecked =
          localStorage.getItem("remember_password") === "true";

        if (rememberChecked && savedUsername && savedPassword) {
          document.getElementById("loginUsername").value = savedUsername;
          document.getElementById("loginPassword").value = savedPassword;
          document.getElementById("rememberPassword").checked = true;
        }
      });

      // 登录前保存密码（修复：监听实际的登录逻辑）
      function savePasswordIfRemember() {
        const username = document.getElementById("loginUsername").value;
        const password = document.getElementById("loginPassword").value;
        const remember = document.getElementById("rememberPassword").checked;

        if (remember) {
          localStorage.setItem("saved_username", username);
          localStorage.setItem("saved_password", password);
          localStorage.setItem("remember_password", "true");
        } else {
          localStorage.removeItem("saved_username");
          localStorage.removeItem("saved_password");
          localStorage.removeItem("remember_password");
        }
      }

      // 禁止页面滚动 - 修复无限循环问题
      document.addEventListener(
        "touchmove",
        function (e) {
          if (!e.target.closest(".form-container")) {
            e.preventDefault();
          }
        },
        { passive: false }
      );

      // 移除导致无限循环的scroll监听
      // window.addEventListener("scroll", () => window.scrollTo(0, 0));
    </script>
