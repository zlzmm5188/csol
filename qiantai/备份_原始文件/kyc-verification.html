<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
    <!-- iOS状态栏配色 - 深色主题 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a1020" />
    <title>实名认证 - Providence</title>
    <style>

* {
    touch-action: pan-y;
    -webkit-user-select: none;
    user-select: none;
}

html,
body {
    touch-action: pan-y !important;
    -ms-touch-action: pan-y !important;
    overscroll-behavior: none !important;
    -webkit-overscroll-behavior: none !important;
    background: linear-gradient(180deg, #0e2b44 0%, #091c2e 100%) !important;
        background-attachment: fixed;
  padding-top: 60px;}

body {
    -webkit-overflow-scrolling: touch;
    position: fixed;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

#app {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
}

        html {
            height: 100%;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: transparent;                radial-gradient(900px 420px at 120% -10%, rgba(159, 139, 84, .22), transparent 55%),
                linear-gradient(180deg, #0a1723 0%, #0d1d2b 40%, #08141f 100%);
            min-height: 100vh;
            height: 100%;
            color: #e9eef6;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: transparent;                radial-gradient(900px 420px at 120% -10%, rgba(159, 139, 84, .22), transparent 55%),
                linear-gradient(180deg, #0a1723 0%, #0d1d2b 40%, #08141f 100%);
            z-index: -1;
        }

        /* 顶部栏 */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 12px 16px;
            background: linear-gradient(180deg, rgba(10, 23, 35, .95), rgba(10, 23, 35, .75));
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {

            height: 32px;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .skip-btn {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            text-decoration: none;
            padding: 6px 12px;
        }

        /* 主容器 */
        .container {
            padding: clamp(70px, 17vw, 80px) clamp(12px, 3vw, 16px) clamp(16px, 4vw, 20px);
            max-width: clamp(320px, 90vw, 600px);
            width: 100%;
            margin: 0 auto;
        }

        /* 页面标题 */
        .page-header {

            margin-bottom: 24px;
        }

        .page-title, .brand h1 { margin: 0; display: inline-block; white-space: nowrap; flex: 0 1 auto; }

        .page-subtitle {
            font-size: clamp(12px, 3vw, 14px);
            color: rgba(255, 255, 255, 0.7);
        }

        /* 步骤指示器 */
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .step-dot {

            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s;
        }

        .step-dot.active {

            border-radius: 4px;
            background: #718096;
        }

        /* 卡片 */
        .card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: clamp(12px, 3vw, 16px);
            padding: clamp(16px, 4vw, 20px);
            backdrop-filter: blur(10px);
            width: 100%;
        }

        .card-title {
            font-size: clamp(14px, 3.5vw, 16px);
            font-weight: 600;
            margin-bottom: clamp(12px, 3vw, 16px);
            color: #cbd5e0;
            display: flex;
            align-items: center;
            gap: clamp(6px, 1.5vw, 8px);
        }

        /* 上传区域 - 紧凑版 */
        .upload-compact {
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: clamp(10px, 2.5vw, 12px);
            padding: clamp(16px, 4vw, 20px);
            width: 100%;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.05);
        }

        .upload-compact:active {
            transform: scale(0.98);
        }

        .upload-compact.uploaded {
            border-color: #718096;
            background: rgba(113, 128, 150, 0.1);
            border-style: solid;
        }

        .upload-icon {
            font-size: clamp(36px, 9vw, 48px);
            margin-bottom: clamp(6px, 1.5vw, 8px);
        }

        .upload-text {
            font-size: clamp(13px, 3.3vw, 15px);
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
        }

        .upload-hint {
            font-size: clamp(11px, 2.8vw, 12px);
            color: rgba(255, 255, 255, 0.5);
            margin-top: clamp(3px, 0.8vw, 4px);
        }

        /* 图片预览 */
        .image-preview {
            margin-top: 16px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }

        .image-preview:hover {
            border-color: #718096;
            box-shadow: 0 4px 12px rgba(113, 128, 150, 0.3);
        }

        .preview-img {

            max-height: 250px;
            object-fit: contain;
            background: rgba(0, 0, 0, 0.3);
        }

        /* 表单 */
        .form-group {
            margin-bottom: clamp(12px, 3vw, 16px);
        }

        .form-label {
            width: 100%;
            font-size: clamp(13px, 3.3vw, 14px);
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: clamp(6px, 1.5vw, 8px);
            font-weight: 500;
            display: block;
        }

        .form-input {
            width: 100%;
            padding: clamp(12px, 3vw, 14px) clamp(12px, 3vw, 16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: clamp(8px, 2vw, 10px);
            font-size: clamp(14px, 3.5vw, 15px);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            transition: all 0.3s;
            -webkit-appearance: none;
        }

        .form-input:focus {
            outline: none;
            border-color: #718096;
            background: rgba(255, 255, 255, 0.15);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        /* 按钮 */
        .btn {
            width: 100%;
            padding: clamp(14px, 3.5vw, 16px);
            border: none;
            border-radius: clamp(10px, 2.5vw, 12px);
            font-size: clamp(14px, 3.5vw, 16px);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            -webkit-appearance: none;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, #4a5568, #2d3748);
            color: #fff;
            box-shadow: 0 4px 20px rgba(74, 85, 104, 0.3);
            margin-top: 20px;
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 人脸识别区域 */
        .face-area {
            position: relative;
            margin-bottom: 16px;
        }

        .camera-view {

            border-radius: 12px;
            overflow: hidden;
            position: relative;
            background: #000;
        }

        #faceVideo {
            width: 100%;
            height: clamp(200px, 50vw, 300px);
            object-fit: cover;
        }

        .face-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(180px, 45vw, 250px);
            height: clamp(180px, 45vw, 250px);
            border: 3px dashed rgba(203, 213, 224, 0.6);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }
        }

        .face-tip {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #cbd5e0;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
        }

        .capture-placeholder {
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 60px 20px;

            cursor: pointer;
        }

        /* 隐藏元素 */
        .hidden {
            display: none !important;
        }

        /* Toast提示 */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 15px;
            z-index: 10000;
            max-

            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        /* 加载动画 */
        .loading {
            display: inline-block;

            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 成功信息 */
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: rgba(255, 255, 255, 0.6);
        }

        .info-value {
            color: #fff;
            font-weight: 600;
        }

.brand { display: flex; flex-direction: row; align-items: center; gap: 8px; white-space: nowrap; justify-content: flex-start; }      .brand .back-btn {
    width: 32px !important;
    height: 32px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    border-radius: 8px !important;
    background: rgba(232, 201, 145, 0.15) !important;
    border: 1px solid rgba(232, 201, 145, 0.3) !important;
    color: #e8c991 !important;
    font-size: 20px !important;
    cursor: pointer !important;
    transition: all 0.2s ease !important;
}
.back-btn:active {
    transform: scale(0.95) !important;
}
.back-btn:active {
    transform: scale(0.95) !important;
}      .brand .page-title, .page-title, .brand h1 { margin: 0; display: inline-block; white-space: nowrap; flex: 0 1 auto; }
    </style>

    <!-- <script defer src="token-manager.js?v=1763813622"></script> (已包含在api-new.js) -->    <script>
      let startX=0,startY=0,isScrolling=false;
      document.addEventListener('touchstart',e=>{startX=e.touches[0].pageX;startY=e.touches[0].pageY;isScrolling=false},{passive:true});
      document.addEventListener('touchmove',e=>{if(isScrolling)return;const x=e.touches[0].pageX,y=e.touches[0].pageY,dx=x-startX,dy=Math.abs(y-startY);if(Math.abs(dx)>dy&&Math.abs(dx)>10){if(dx<0){e.preventDefault();e.stopPropagation();return false}}else if(dy>10)isScrolling=true},{passive:false,capture:true});
      document.addEventListener('touchend',()=>isScrolling=false,{passive:true});
    </script>
    <script defer src="smart-swipe-control.js?v=1763813622"></script>


</head>

<body>
    <!-- 顶部栏 -->
    <div class="top-bar">
        <div class="logo-area">
            <img src="img/logo.png" alt="Logo" class="logo" />
            <span class="brand-name">PROVIDENCE</span>
        </div>
    </div>

    <div class="container">
        <!-- 页面标题 -->
        <div class="page-header">
            <div class="page-title">实名认证</div>
            <div class="page-subtitle">🔒 完成认证后可使用全部功能</div>
        </div>

        <!-- 步骤指示器 -->
        <div class="step-indicator">
            <div class="step-dot active" id="dot1"></div>
            <div class="step-dot" id="dot2"></div>
        </div>

        <!-- 步骤1：上传身份证 -->
        <div class="card" id="step1">
            <div class="card-title">
                <span>📄</span>
                <span>上传身份证</span>
            </div>

            <div class="upload-compact" id="uploadArea" onclick="document.getElementById('idInput').click()">
                <div id="uploadPlaceholder">
                    <div class="upload-icon">🪪</div>
                    <div class="upload-text">点击上传身份证正面</div>
                    <div class="upload-hint">支持拍照或相册选择，自动识别身份证号</div>
                </div>
            </div>
            <input type="file" id="idInput" accept="image/*" style="display:none;" />

            <!-- 图片预览区域（点击可重新上传） -->
            <div id="imagePreview" class="image-preview hidden" onclick="document.getElementById('idInput').click()"
                style="cursor: pointer;">
                <img id="previewImg" class="preview-img" alt="身份证预览" />
                <div style=" padding: 8px; font-size: 13px; color: rgba(255,255,255,0.7);">
                    点击图片可重新上传
                </div>
            </div>

            <div class="form-group" style="margin-top: 20px;">
                <label class="form-label">
                    <span>真实姓名</span>
                    <span
                        style="font-size: 12px; color: rgba(255,255,255,0.5); font-weight: 400; margin-left: 8px;">（自动识别后可修改）</span>
                </label>
                <input type="text" class="form-input" id="nameInput" placeholder="请输入身份证上的姓名" />
            </div>

            <div class="form-group">
                <label class="form-label">
                    <span>身份证号</span>
                    <span
                        style="font-size: 12px; color: rgba(255,255,255,0.5); font-weight: 400; margin-left: 8px;">（自动识别后可修改）</span>
                </label>
                <input type="text" class="form-input" id="idCardInput" placeholder="请输入18位身份证号" maxlength="18" />
            </div>

            <button class="btn btn-primary" id="nextBtn" onclick="goToStep2()">
                下一步：人脸识别
            </button>
        </div>

        <!-- 步骤2：人脸识别 -->
        <div class="card hidden" id="step2">
            <div class="card-title">
                <span>👤</span>
                <span>人脸识别</span>
            </div>

            <div class="face-area">
                <!-- 摄像头预览 -->
                <div class="camera-view hidden" id="cameraView">
                    <video id="faceVideo" autoplay playsinline></video>
                    <div class="face-overlay"></div>
                    <div class="face-tip">请将面部置于框内</div>
                </div>

                <!-- 拍照前占位 -->
                <div class="capture-placeholder" id="capturePlaceholder" onclick="startCamera()">
                    <div class="upload-icon">📸</div>
                    <div class="upload-text">点击开始人脸识别</div>
                    <div class="upload-hint">需要使用前置摄像头</div>
                </div>
            </div>

            <div id="faceResult" class="hidden" style="margin-top: 16px;">
                <div class="info-row">
                    <span class="info-label">比对结果</span>
                    <span class="info-value" style="color: #cbd5e0;">✓ 验证通过</span>
                </div>
                <div class="info-row">
                    <span class="info-label">相似度</span>
                    <span class="info-value" id="similarityText">--</span>
                </div>
            </div>

            <button class="btn btn-primary hidden" id="captureBtn" onclick="captureFace()">
                拍摄照片
            </button>

            <button class="btn btn-primary hidden" id="submitBtn" onclick="submitKYC()">
                提交认证
            </button>

            <button class="btn" id="backBtn" onclick="goBackToStep1()"
                style="margin-top: 12px; background: rgba(255,255,255,0.1); color: #fff;">
                返回上一步
            </button>
        </div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <!-- 引入 iOS 风格弹窗 -->
    <script src="ios-toast.js?v=1763813622"></script>
    <!-- 引入 Tesseract.js OCR 库 -->
    <script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
    <script defer src="kyc-verification-ocr.js?v=1763813622"></script>
    <script src="page-lifecycle.js?v=1763813622"></script>

</body>

</html>
