<style>
* {
    touch-action: pan-y;
    -webkit-user-select: none;
    user-select: none;
}

html,
body {
    touch-action: pan-y !important;
    -ms-touch-action: pan-y !important;
    /* 完全禁止橡皮筋效果 - 不露白色背景 */
    overscroll-behavior: none !important;
    -webkit-overscroll-behavior: none !important;
    /* 保持背景色一致 */
    background: linear-gradient(180deg, #0e2b44 0%, #091c2e 100%) !important;
        background-attachment: fixed;
}

body {
    /* iOS惯性滚动 - 保持流畅感但不露白 */
    -webkit-overflow-scrolling: touch;
    /* 确保背景固定 */
    position: fixed;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

#app {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
}

/* 统一标题栏样式 - 固定在顶部 */
.team-header {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    background: rgba(10, 16, 32, 0.95) !important;
    backdrop-filter: blur(20px) !important;
    -webkit-backdrop-filter: blur(20px) !important;
    border-bottom: 0.5px solid rgba(255, 255, 255, 0.1) !important;
    padding-top: env(safe-area-inset-top) !important;
    padding-left: calc(16px + env(safe-area-inset-left)) !important;
    padding-right: calc(16px + env(safe-area-inset-right)) !important;
    padding-bottom: 14px !important;
    height: auto !important;
    min-height: clamp(48px, 12vw, 56px) !important;
    box-sizing: content-box !important;
    z-index: 1000 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3) !important;
}

.team-header .back-btn {
    width: 32px !important;
    height: 32px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    border-radius: 8px !important;
    background: rgba(232, 201, 145, 0.15) !important;
    border: 1px solid rgba(232, 201, 145, 0.3) !important;
    color: #e8c991 !important;
    font-size: 20px !important;
    cursor: pointer !important;
    transition: all 0.2s ease !important;
}
.back-btn:active {
    transform: scale(0.95) !important;
}
.back-btn:active {
    transform: scale(0.95) !important;
}

.team-header .back-btn:active {
    transform: scale(0.92) !important;
    background: rgba(232, 201, 145, 0.15) !important;
}

.team-header .team-title {
    flex: 1 !important;
    text-align: center !important;
    font-size: clamp(17px, 4.2vw, 19px) !important;
    font-weight: 600 !important;
    color: #e8c991 !important;
    margin: 0 clamp(10px, 2.5vw, 12px) !important;
}

.btn-invite-header {
    padding: clamp(6px, 1.5vw, 8px) clamp(12px, 3vw, 14px) !important;
    background: rgba(232, 201, 145, 0.15) !important;
    border: 1px solid rgba(232, 201, 145, 0.3) !important;
    border-radius: 20px !important;
    color: #e8c991 !important;
    font-size: clamp(13px, 3.2vw, 14px) !important;
    font-weight: 600 !important;
    display: flex !important;
    align-items: center !important;
    gap: 4px !important;
    cursor: pointer !important;
    transition: all 0.2s !important;
}

.btn-invite-header:active {
    transform: scale(0.95) !important;
    background: rgba(232, 201, 145, 0.25) !important;
}

/* 内容区 - 为固定标题栏留出空间 */
#app {
    padding-top: calc(clamp(48px, 12vw, 56px) + 14px + env(safe-area-inset-top)) !important;
}

.team-stats {
    margin-top: 0 !important;
}

/* 无效成员样式 */
.team-member-card.invalid-member {
    opacity: 0.6;
    background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    border-left: 3px solid #6b7280;
}

.invalid-badge {
    display: inline-block;
    padding: 2px 8px;
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.3);
    border-radius: 10px;
    font-size: 10px;
    color: #ef4444;
    margin-left: 6px;
    font-weight: 600;
}

.invalid-notice {
    margin-top: 12px;
    padding: 8px 12px;
    background: rgba(251, 191, 36, 0.1);
    border: 1px solid rgba(251, 191, 36, 0.3);
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: #fbbf24;
}

.notice-icon {
    font-size: 14px;
}

.notice-text {
    flex: 1;
    line-height: 1.4;
}

.team-stat-footer {
    text-align: center;
    padding: 16px;
    margin-top: 12px;
    background: rgba(255,255,255,0.03);
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08);
}

.stat-footer-text {
    font-size: 13px;
    color: rgba(255,255,255,0.7);
    font-weight: 500;
}

    font-size: 20px !important;

}
.back-btn:active {
    transform: scale(0.95) !important;
}
.back-btn:active {
    transform: scale(0.95) !important;
}      .brand .page-title, .brand h1 { margin: 0; display: inline-block; white-space: nowrap; flex: 0 1 auto; }

<body class="page-team">
<div id="app">
    <!-- 顶部导航 -->
    <header class="team-header">
        <a href="profile.html" class="back-btn">←</a>
        <h1 class="team-title">我的团队</h1>
        <button class="btn-invite-header" onclick="window.location.href='invite-share.html'">
            <span>🎁</span>
            <span>邀请</span>
        </button>
    </header>

    <!-- 团队统计 -->
    <section class="team-stats">
        <div class="stat-box">
            <div class="stat-label">团队总人数</div>
            <div class="stat-value" id="totalMembers">--</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">团队总投资</div>
            <div class="stat-value" id="totalInvestment">--</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">我的佣金</div>
            <div class="stat-value stat-value-gold" id="myCommission">--</div>
        </div>
    </section>

    <!-- 级别切换 -->
    <section class="level-tabs">
        <button class="level-tab active" data-level="1">一级团队</button>
        <button class="level-tab" data-level="2">二级团队</button>
    </section>

    <!-- 团队列表 -->
    <section class="team-list" id="teamList">
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <div class="loading-text">加载中...</div>
        </div>
    </section>
</div>
