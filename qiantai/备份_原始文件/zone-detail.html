<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
    <!-- iOS状态栏配色 - 深色主题 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a1020" />
    <title>专区介绍 - Providence</title>
    <link rel="stylesheet" href="styles.css?v=1763813622" />
    <style>
        /* 专区介绍页面 - 品牌配色 */
        .page-zone-detail {
            background: #f7f8fa;
            min-height: 100vh;
            padding-bottom: 20px;
        }

        /* 顶部导航 */
        .zone-header-theme {
            position: sticky;
            top: 0;
            background: linear-gradient(135deg, #0b3b5e 0%, #0e4a78 100%);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .back-btn-zone {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 28px;
            text-decoration: none;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .back-btn-zone:active {
            background: rgba(255,255,255,0.25);
            transform: scale(0.95);
        }

        .zone-title-header {

            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin: 0;
            letter-spacing: 0.5px;
        }

        .header-spacer {
            width: 40px;
        }

        /* 专区介绍卡片 */
        .zone-intro-hero {
            background: linear-gradient(135deg, #0b3b5e 0%, #0e4a78 100%);
            padding: 32px 20px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .zone-intro-hero::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
            border-radius: 50%;
        }

        .zone-hero-title {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            margin: 0 0 12px 0;
            position: relative;
            z-index: 10;
        }

        .zone-hero-subtitle {
            font-size: 16px;
            color: rgba(255,255,255,0.9);
            margin: 0 0 20px 0;
            position: relative;
            z-index: 10;
        }

        .zone-features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            position: relative;
            z-index: 10;
        }

        .feature-badge {
            padding: 8px 12px;
            background: rgba(255,255,255,0.2);
            border-radius: 12px;

            font-size: 12px;
            font-weight: 600;
            color: #fff;
            backdrop-filter: blur(10px);
        }

        /* 策略说明卡片 */
        .strategy-card {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            margin: 0 16px 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        .strategy-title {
            font-size: 18px;
            font-weight: 700;
            color: #222;
            margin: 0 0 20px 0;
            display: flex;
            align-items: center;
        }

        .strategy-title::before {
            content: '🎯';
            margin-right: 8px;
            font-size: 20px;
        }

        .strategy-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .strategy-item {
            display: flex;
            align-items: flex-start;
            font-size: 14px;
            color: #424242;
            line-height: 1.6;
        }

        .strategy-item::before {
            content: '✓';
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #c99b2b 0%, #e0b54e 100%);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-weight: bold;
            font-size: 12px;
            margin-right: 12px;
        }

        /* 适合人群 */
        .suitable-card {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            margin: 0 16px 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        .suitable-title {
            font-size: 18px;
            font-weight: 700;
            color: #222;
            margin: 0 0 20px 0;
            display: flex;
            align-items: center;
        }

        .suitable-title::before {
            content: '👥';
            margin-right: 8px;
            font-size: 20px;
        }

        .people-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .people-item {
            padding: 16px;
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            border-radius: 12px;
            border: 1px solid #f0f0f0;
        }

        .people-type {
            font-size: 15px;
            font-weight: 700;
            color: #c99b2b;
            margin: 0 0 8px 0;
        }

        .people-desc {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
            margin: 0;
        }

        /* 产品列表 */
        .products-section {
            margin: 0 16px 16px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #222;
            margin: 0 0 16px 0;
            padding: 0 4px;
        }

        .product-list-compact {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .product-card-compact {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: all 0.3s;
            cursor: pointer;
            border: 1px solid #f0f0f0;
        }

        .product-card-compact:active {
            transform: scale(0.98);
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        .product-card-compact.locked {
            opacity: 0.7;
            filter: grayscale(0.3);
        }

        .product-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        

        .product-title {
            font-size: 16px;
            font-weight: 700;
            color: #222;
            margin: 0 0 6px 0;
        }

        .product-code {
            font-size: 12px;
            color: #6b7a8a;
            font-family: 'Courier New', monospace;
        }

        .status-tag {
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }

        .status-tag.active {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            color: #4caf50;
        }

        .product-metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .metric-box {

            padding: 12px 8px;
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            border-radius: 12px;
        }

        .metric-value {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .metric-value.rate {
            background: linear-gradient(135deg, #c99b2b 0%, #e0b54e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .metric-value.period {
            color: #0b3b5e;
        }

        .metric-value.amount {
            color: #0b3b5e;
        }

        .metric-label {
            font-size: 11px;
            color: #6b7a8a;
            font-weight: 500;
        }

        .product-actions-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 16px;
            border-top: 1px solid #f0f0f0;
        }

        .btn-invest-primary {
            padding: 12px 32px;
            background: linear-gradient(135deg, #c99b2b 0%, #e0b54e 100%);
            color: #fff;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(201, 155, 43, 0.3);
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }

        .btn-invest-primary:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(201, 155, 43, 0.3);
        }

        /* 加载状态 */
        .loading-container {

            padding: 60px 20px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f0f3f7;
            border-top-color: #c99b2b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;

        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #6b7a8a;
            font-size: 14px;
        }

        /* 空状态 */
        .empty-state {

            padding: 80px 20px;
            color: #6b7a8a;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-text {
            font-size: 16px;
        }
      .brand { display: flex; align-items: center; }
      .brand .back-btn {
    width: 32px !important;
    height: 32px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    border-radius: 8px !important;
    background: rgba(232, 201, 145, 0.15) !important;
    border: 1px solid rgba(232, 201, 145, 0.3) !important;
    color: #e8c991 !important;
    font-size: 20px !important;
    cursor: pointer !important;
    transition: all 0.2s ease !important;
}
.back-btn:active {
    transform: scale(0.95) !important;
}
.back-btn:active {
    transform: scale(0.95) !important;
}
      .brand .page-title, .brand .page-title, .brand h1 { margin: 0; font-size: 16px; white-space: nowrap; flex: 0 1 auto; }
    </style>
</head>
<body class="page-zone-detail">
<div id="app">
    <!-- 顶部导航 -->
    <header class="zone-header-theme">
        <a href="projects.html" class="back-btn-zone" id="backBtn">←</a>
        <h1 class="zone-title-header" id="pageTitle">专区介绍</h1>
        <div class="header-spacer"></div>
    </header>

    <!-- 内容区域 -->
    <section id="contentArea">
        <!-- 动态加载 -->
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <div class="loading-text">加载中...</div>
        </div>
    </section>
</div>

<!-- 底部导航 -->

<script src="ios-toast.js?v=1763813622"></script>
<script src="zone-detail.js?v=1763813622"></script>

</body>
</html>
