// 加载文章详情
function loadArticle() {
    const urlParams = new URLSearchParams(window.location.search);
    const newsId = parseInt(urlParams.get('id'));

    if (!newsId || !newsDetails[newsId]) {
        document.getElementById('articleContent').innerHTML = `
            <div style="padding:60px 20px;color:#8a95a6;">
                <div style="font-size:48px;margin-bottom:16px;">📰</div>
                <div>文章不存在</div>
            </div>
        `;
        return;
    }

    const article = newsDetails[newsId];
    const container = document.getElementById('articleContent');

    container.innerHTML = `
        <div class="article-header">
            <span class="article-badge">${article.badge}</span>
            <h1 class="article-title">${article.title}</h1>
            <div class="article-meta">
                <span class="article-date">${formatDate(article.date)}</span>
                <span>Providence Equity Partners</span>
            </div>
        </div>
        <div class="article-content">
            ${article.content}
        </div>
        <div class="article-footer">
            <a href="company-news.html" class="back-to-list">返回列表</a>
        </div>
    `;

    // 更新页面标题
    document.title = `${article.title} | PROVIDENCE EQUITY PARTNERS`;
}

// 格式化日期
function formatDate(dateStr) {
    const date = new Date(dateStr);
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
}

// 初始化
document.addEventListener('DOMContentLoaded', function() {
    setTimeout(() => {
        loadArticle();
    }, 300);
});
