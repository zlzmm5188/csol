    <div class="nav-bar">
      <div class="nav-back" onclick="goBack()">‹</div>

    <div id="app">
    <div class="container">
            <!-- 总览卡片 -->
      <div class="summary-card">
        <div class="summary-grid">
          <div class="summary-item">
            <div class="summary-label">投资总额</div>
            <div class="summary-value" id="totalInvest">¥0.00</div>
          </div>
          <div class="summary-item">
            <div class="summary-label">累计收益</div>
            <div class="summary-value" id="totalProfit">¥0.00</div>
          </div>
          <div class="summary-item">
            <div class="summary-label">进行中</div>
            <div class="summary-value" id="activeCount">0</div>
          </div>
          <div class="summary-item">
            <div class="summary-label">已完成</div>
            <div class="summary-value" id="completedCount">0</div>
          </div>
        </div>
      </div>

            <!-- Tab 切换 -->
      <div class="tabs">
                <button class="tab-btn active" data-tab="all" onclick="switchTab(event)">全部</button>
                <button class="tab-btn" data-tab="active" onclick="switchTab(event)">进行中</button>
                <button class="tab-btn" data-tab="completed" onclick="switchTab(event)">已完成</button>
      </div>

            <!-- 投资列表 -->
      <div class="investment-list" id="investmentList">
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">加载中...</div>
                </div>
        </div>
      </div>
    </div>

    <!-- 脚本 -->
    <script src="api-new.js?v=1763897782"></script>
    <script src="ios-toast.js?v=1763897782"></script>
    <script>
        // ============================================
        // 配置
        // ============================================
        const API_BASE = window.API_CONFIG?.baseURL || 'https://api.4kp3l0iq.top';
        const TOKEN_KEY = window.API_CONFIG?.tokenKey || 'providence_token';
        let currentTab = 'all';
      let allInvestments = [];

        // ============================================
        // 初始化
        // ============================================
        document.addEventListener('DOMContentLoaded', function () {
            // 检查登录状态
            const token = localStorage.getItem(TOKEN_KEY);
            if (!token) {
                console.warn('[投资] 未登录，跳转到登录页');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1000);
                return;
            }

            // 加载投资数据
            loadInvestments();
        });

        // ============================================
        // API 调用
        // ============================================

        /**
         * 加载投资列表
         */
      async function loadInvestments() {
            const investmentList = document.getElementById('investmentList');

        try {
                const token = localStorage.getItem(TOKEN_KEY);
          if (!token) {
                    console.error('[投资] Token 已失效');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1000);
            return;
          }

                console.log('[投资] 开始加载投资列表...');
                // 修改为获取用户的投资记录，而不是项目列表
                const response = await fetch(`${API_BASE}/api/orders/my-investments`, {
                    method: 'GET',
            headers: {
                        'Content-Type': 'application/json',
                        'Token': token  // 首字母大写
                    }
                });

                console.log('[投资] API响应状态:', response.status, response.statusText);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const text = await response.text();
                console.log('[投资] 原始响应:', text.substring(0, 500));

                // 检查是否是HTML错误页面
                if (text.trim().startsWith('<!DOCTYPE') || text.trim().startsWith('<html') || text.includes('系统发生错误')) {
                    console.error('[投资] 服务器返回HTML错误页面');
                    investmentList.innerHTML = '<div class="error-state">服务器错误，请稍后重试</div>';
                    return;
                }

                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    console.error('[投资] JSON解析失败:', e);
                    investmentList.innerHTML = '<div class="error-state">数据格式错误，请联系客服</div>';
                    return;
                }

                console.log('[投资] 投资列表响应:', data);

                // 检查响应码
                if (data.code === 1 || data.code === 200) {
                    // 提取投资列表
                    const listData = data.data?.list || data.data || [];

                    if (Array.isArray(listData) && listData.length > 0) {
                        allInvestments = listData;
                        console.log('[投资] 加载成功，共', allInvestments.length, '条投资记录');
                        updateSummary();
                        renderInvestments();
                    } else {
                        console.log('[投资] 暂无投资记录');
                        allInvestments = [];
            updateSummary();
            renderInvestments();
                    }
                } else if (data.code === -1 || data.code === 401) {
                    // 未登录或 token 过期
                    console.warn('[投资] Token 过期或未登录');
                    localStorage.removeItem(TOKEN_KEY);
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1000);
                } else {
                    console.error('[投资] API错误:', data.message || data.msg);
                    investmentList.innerHTML = `<div class="error-state">${data.message || data.msg || '加载失败'}</div>`;
          }
        } catch (error) {
                console.error('[投资] 加载失败:', error);
                if (error.message.includes('401') || error.message.includes('403')) {
                    investmentList.innerHTML = `<div class="error-state">登录已过期，请重新登录</div>`;
                    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                } else {
                    investmentList.innerHTML = `<div class="error-state">暂无投资记录</div>`;
                }
            }
        }

        /**
         * 更新统计信息
         */
      function updateSummary() {
            try {
                // 计算总投资额
                const totalInvest = allInvestments.reduce((sum, item) => {
                    const amount = parseFloat(item.amount || 0);
                    return sum + (isNaN(amount) ? 0 : amount);
                }, 0);

                // 计算总收益
                const totalProfit = allInvestments.reduce((sum, item) => {
                    const profit = parseFloat(item.profit || 0);
                    return sum + (isNaN(profit) ? 0 : profit);
                }, 0);

                // 计数进行中和已完成
                const activeCount = allInvestments.filter(item => item.status === 'active' || item.status === 1).length;
                const completedCount = allInvestments.filter(item => item.status === 'completed' || item.status === 2).length;

                // 更新 DOM
                const totalInvestEl = document.getElementById('totalInvest');
                const totalProfitEl = document.getElementById('totalProfit');
                const activeCountEl = document.getElementById('activeCount');
                const completedCountEl = document.getElementById('completedCount');

                if (totalInvestEl) {
                    totalInvestEl.textContent = `¥${totalInvest.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
                }
                if (totalProfitEl) {
                    totalProfitEl.textContent = `¥${totalProfit.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
                }
                if (activeCountEl) {
                    activeCountEl.textContent = activeCount;
                }
                if (completedCountEl) {
                    completedCountEl.textContent = completedCount;
                }

                console.log('[投资] 统计更新:', { totalInvest, totalProfit, activeCount, completedCount });
            } catch (error) {
                console.error('[投资] 更新统计失败:', error);
            }
        }

        /**
         * 渲染投资列表
         */
      function renderInvestments() {
            const container = document.getElementById('investmentList');

            try {
                // 过滤投资
        let filtered = allInvestments;
                if (currentTab === 'active') {
                    filtered = allInvestments.filter(item => item.status === 'active' || item.status === 1);
                } else if (currentTab === 'completed') {
                    filtered = allInvestments.filter(item => item.status === 'completed' || item.status === 2);
        }

                console.log('[投资] 渲染列表，当前Tab:', currentTab, '过滤后:', filtered.length, '条');

                // 空状态
        if (filtered.length === 0) {
          container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📊</div>
            <div class="empty-text">暂无投资记录</div>
            <a href="projects.html" class="empty-btn">去投资</a>
          </div>
        `;
          return;
        }

                // 渲染卡片
                container.innerHTML = filtered.map(item => {
                    const projectId = item.project_id || item.id;
                    // 项目名称 - 支持多种字段名
                    const projectName = item.project_name || item.project_title || item.name || '投资项目';
                    // 投资金额
                    const amount = parseFloat(item.amount || item.money || 0);
                    // 预期收益/已赚取收益 - 支持多种字段名
                    const profit = parseFloat(item.estimated_profit || item.estimated_earning || item.profit || item.earned_amount || 0);
                    // 剩余天数 - 计算或直接获取
                    let remainDays = item.remain_days || item.day || 0;
                    if (remainDays === 0 && item.cycle_days && item.start_time) {
                        // 如果没有 remain_days，根据 cycle_days 和 start_time 计算
                        const startDate = new Date(item.start_time);
                        const endDate = new Date(startDate.getTime() + item.cycle_days * 24 * 60 * 60 * 1000);
                        const now = new Date();
                        remainDays = Math.max(0, Math.ceil((endDate - now) / (24 * 60 * 60 * 1000)));
                    }
                    // 创建时间 - 支持多种字段名
                    const createTime = item.create_time || item.created_at || item.start_time || '';

                    // 确定状态类和文本
                    let statusClass = 'status-active';
                    let statusText = '进行中';
                    if (item.status === 'completed' || item.status === 'finished' || item.status === 2) {
                        statusClass = 'status-completed';
                        statusText = '已完成';
                    } else if (item.status === 'expired' || item.status === 'cancelled' || item.status === 3) {
                        statusClass = 'status-expired';
                        statusText = '已到期';
                    }

                    return `
                        <div class="investment-card" onclick="window.location.href='project-detail.html?id=${projectId}'">
          <div class="investment-header">
            <div>
                                    <div class="investment-title">${escapeHtml(projectName)}</div>
                                    <div class="investment-date">${createTime}</div>
            </div>
                                <span class="investment-status ${statusClass}">${statusText}</span>
          </div>
          <div class="investment-details">
            <div class="detail-item">
              <div class="detail-label">投资金额</div>
                                    <div class="detail-value">¥${amount.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
            </div>
            <div class="detail-item">
              <div class="detail-label">预期收益</div>
                                    <div class="detail-value profit-value">¥${profit.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
            </div>
            <div class="detail-item">
              <div class="detail-label">剩余天数</div>
                                    <div class="detail-value">${remainDays}天</div>
            </div>
          </div>
        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('[投资] 渲染失败:', error);
                container.innerHTML = '<div class="error-state">渲染失败，请刷新重试</div>';
      }
        }

        // ============================================
        // UI 交互
        // ============================================

        /**
         * 切换 Tab
         */
        function switchTab(event) {
            event.preventDefault();

            // 获取目标 tab
            const tabName = event.target.dataset.tab;
            if (!tabName) return;

            console.log('[投资] 切换Tab:', tabName);

            // 更新当前 tab
            currentTab = tabName;

            // 更新按钮样式
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // 重新渲染
        renderInvestments();
      }

        /**
         * HTML 转义
         */
        // ========== 导航函数 ==========
        function goBack() {
            window.history.back();
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, char => map[char]);
        }
    </script>
