<script src="api-new.js?v=1763897782"></script>
<script>
// 开发模式调试开关
const DEBUG = false;
const log = (...args) => DEBUG && console.log(...args);
const warn = (...args) => DEBUG && console.warn(...args);
const error = (...args) => console.error(...args);

// API等待函数 - 优化版本
function waitForAPI() {
    return new Promise((resolve) => {
        if (window.API && window.API_CONFIG) {
            resolve();
            return;
        }
        let attempts = 0;
        const maxAttempts = 20; // 增加最大尝试次数
        const check = setInterval(() => {
            if ((window.API && window.API_CONFIG) || attempts++ >= maxAttempts) {
                clearInterval(check);
                resolve();
            }
        }, 50);
    });
}

// 全局状态管理
const state = {
    projects: [],
    isLoading: false,
    currentFilter: 'all',
    elements: {
        chips: null,
        list: null,
        loading: null,
        moreBtn: null
    }
};

// 防抖函数
function debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
        const later = () => {
            clearTimeout(timeout);
            func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
    };
}

// 节流函数
function throttle(func, limit) {
    let inThrottle;
    return function(...args) {
        if (!inThrottle) {
            func.apply(this, args);
            inThrottle = true;
            setTimeout(() => inThrottle = false, limit);
        }
    };
}

// 确保DOM加载完成后再获取元素 - 优化版本
function initElements() {
    const { elements } = state;
    if (!elements.chips) elements.chips = document.querySelectorAll('.chip');
    if (!elements.list) elements.list = document.getElementById('list');
    if (!elements.loading) elements.loading = document.getElementById('loading');
    if (!elements.moreBtn) elements.moreBtn = document.getElementById('more');
    return elements.list && elements.loading;
}

// 筛选函数 - 优化版本（使用节流）
const applyFilter = throttle(function() {
    if (!initElements()) return;
    const { elements } = state;
    const activeChip = document.querySelector('.chip.active');
    const active = activeChip?.dataset.chip || 'all';
    state.currentFilter = active;

    const cards = elements.list.querySelectorAll('.card');
    const fragment = document.createDocumentFragment();

    cards.forEach(card => {
    const type = card.dataset.type;
    const isVip = card.dataset.vip === 'true';
        const title = card.textContent.toLowerCase();

    let show = true;
        switch(active) {
            case 'ipo': show = type === 'ipo'; break;
            case 'bond': show = type === 'bond'; break;
            case 'newbie': show = title.includes('新手'); break;
            case 'vip': show = isVip; break;
            default: show = true;
        }

        // 使用 requestAnimationFrame 优化显示/隐藏
        requestAnimationFrame(() => {
    card.style.display = show ? '' : 'none';
            card.style.opacity = show ? '1' : '0';
  });
    });
}, 100);

// 初始化筛选器 - 优化版本
function initFilters() {
    if (!initElements()) {
        setTimeout(initFilters, 100);
        return;
    }
    const { elements } = state;
    // 移除旧的事件监听器，避免重复绑定
    elements.chips.forEach(chip => {
        chip.removeEventListener('click', handleFilterClick);
        chip.addEventListener('click', handleFilterClick);
    });
}

// 筛选器点击处理函数
function handleFilterClick(e) {
    const chip = e.currentTarget;
    const { elements } = state;

    // 更新激活状态
    elements.chips.forEach(c => c.classList.remove('active'));
    chip.classList.add('active');

    // 应用筛选
    applyFilter();

    // 添加点击反馈动画
    chip.style.transform = 'scale(0.95)';
    setTimeout(() => {
        chip.style.transform = '';
    }, 150);
}

// 加载项目列表 - 优化版本
async function loadProjects() {
    if (state.isLoading) {
        warn('[Projects] 正在加载中，跳过重复请求');
        return;
    }

    state.isLoading = true;

    try {
        await waitForAPI();

        const API_BASE = window.API_CONFIG?.baseURL || "https://api.4kp3l0iq.top";
        const token = localStorage.getItem('providence_token') || localStorage.getItem('token') || '';

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000);

        try {
            let data = null;

            // 优先使用统一API封装（如果存在）
            if (window.ApiService && window.ApiService.project && window.ApiService.project.getList) {
                try {
                    const result = await Promise.race([
                        window.ApiService.project.getList(),
                        new Promise((_, reject) => setTimeout(() => reject(new Error('超时')), 8000))
                    ]);
                    if (result && result.code === 1 && result.data) {
                        data = result;
                    }
                } catch (e) {
                    warn('[Projects] ApiService调用失败:', e);
                }
            }

            // 降级方案：使用统一的httpClient
            if (!data) {
                // 优先使用window.httpClient（统一API客户端）
                if (window.httpClient && typeof window.httpClient.get === 'function') {
                    try {
                        const result = await window.httpClient.get("/api/project/index");
                        if (result && (result.code === 1 || result.code === 200)) {
                            data = result;
                            log('[Projects] 使用httpClient成功');
                        } else {
                            throw new Error(result?.msg || '获取项目列表失败');
                        }
                    } catch (httpError) {
                        error('[Projects] httpClient调用失败:', httpError);
                        throw httpError;
                    }
                } else {
                    // 最后降级：直接调用API
                    const url = `${API_BASE}/api/project/index`;
                    log('[Projects] 请求项目列表:', url);

                    const response = await fetch(url, {
                        method: 'GET',
                        headers: {
                            "Accept": "application/json",
                            "Content-Type": "application/json",
                            "Authorization": token ? `Bearer ${token}` : ""
                        },
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }

                    const contentType = response.headers.get('content-type');
                    if (!contentType || !contentType.includes('application/json')) {
                        const text = await response.text();
                        throw new Error(`返回的不是JSON格式: ${text.substring(0, 100)}`);
                    }

                    const text = await response.text();
                    try {
                        data = JSON.parse(text);
                        log('[Projects] API响应成功');
                    } catch (parseError) {
                        error('[Projects] JSON解析失败:', parseError);
                        throw new Error('服务器返回格式错误');
                    }
                }
            }

            // 处理响应数据
            let projectList = null;

            if (data && data.code === 1 && data.data) {
                // 标准格式：{ code: 1, data: { list: [...] } }
                if (data.data.list && Array.isArray(data.data.list)) {
                    projectList = data.data.list;
                } else if (Array.isArray(data.data)) {
                    projectList = data.data;
                } else if (data.data.projects && Array.isArray(data.data.projects)) {
                    projectList = data.data.projects;
                }
            } else if (data && Array.isArray(data)) {
                // 直接数组格式
                projectList = data;
            } else if (data && data.code === 1 && Array.isArray(data.data)) {
                // 另一种格式：{ code: 1, data: [...] }
                projectList = data.data;
            }

            if (projectList && Array.isArray(projectList) && projectList.length > 0) {
                state.projects = projectList.map(p => {
                    // 后端字段映射到前端字段
                    const project = {
                        id: p.id || p.project_id || 0,
                        title: p.name || p.title || p.project_name || "投资项目",
                        rate: parseFloat(p.user_rate || p.daily_rate || p.rate || 0), // 优先使用user_rate（含VIP加息）
                        vip_rate: parseFloat(p.added_rate || p.vip_rate || p.extra_rate || 0),
                        day: parseInt(p.period || p.cycle || p.total_days || p.day || 0), // 后端返回period或cycle
                        min: parseFloat(p.min_amount || p.min_invest || p.min || 0),
                        max: parseFloat(p.max_amount || p.max_invest || p.max || 0),
                        vip: parseInt(p.vip_min || p.vip_only || p.vip || p.vip_level || 0),
                        categoryName: p.category || p.categoryName || p.category_name || "固收优选",
                        currency: p.currency || 'CNY',
                        status: p.status || 1,
                        // 额外字段
                        progress: parseFloat(p.progress || 0), // 投资进度
                        remain: parseFloat(p.remain || 0), // 剩余额度
                        total_amount: parseFloat(p.total_amount || 0), // 总金额
                        sold_amount: parseFloat(p.sold_amount || 0), // 已售金额
                        description: p.description || '' // 项目描述
                    };
                    return project;
                });
                log(`[Projects] 成功加载 ${state.projects.length} 个项目`);
                renderProjects();
                if (state.elements.loading) {
                    state.elements.loading.style.display = "none";
                }
            } else {
                warn('[Projects] 没有项目数据或数据格式不正确');
                if (state.elements.loading) {
                    state.elements.loading.innerHTML = '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.7);">暂无项目</div>';
                    state.elements.loading.style.display = 'block';
                }
            }
        } catch (e) {
            clearTimeout(timeoutId);
            error('[Projects] 加载失败:', e);
            if (state.elements.loading) {
                let errorMsg = '加载失败';
                if (e.message) {
                    if (e.message.includes('HTTP 404')) {
                        errorMsg = '接口不存在，请检查API路径';
                    } else if (e.message.includes('HTTP 401') || e.message.includes('HTTP 403')) {
                        errorMsg = '未授权，请重新登录';
                    } else if (e.message.includes('超时')) {
                        errorMsg = '请求超时，请检查网络连接';
                    } else {
                        errorMsg = `加载失败: ${e.message}`;
                    }
                }
                state.elements.loading.innerHTML = `<div style="text-align:center;padding:40px;color:#ff6b6b;">${errorMsg}<br><button onclick="loadProjects()" style="margin-top:16px;padding:8px 16px;background:#e8c991;color:#0a1723;border:none;border-radius:8px;cursor:pointer;">重试</button></div>`;
            }
        }
    } catch (err) {
        error('[Projects] 初始化失败:', err);
        if (state.elements.loading) {
            state.elements.loading.innerHTML = `<div style="text-align:center;padding:40px;color:#ff6b6b;">加载失败: ${err.message || '未知错误'}<br><button onclick="loadProjects()" style="margin-top:16px;padding:8px 16px;background:#e8c991;color:#0a1723;border:none;border-radius:8px;cursor:pointer;">重试</button></div>`;
        }
    } finally {
        state.isLoading = false;
    }
}

// 渲染项目列表 - 优化版本（使用 DocumentFragment 批量插入）
function renderProjects() {
    // 确保元素已初始化
    if (!initElements()) {
        error('[Projects] 元素未找到，延迟渲染');
        setTimeout(renderProjects, 100);
        return;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const isNewbieMode = urlParams.get('type') === 'newbie';

    if (isNewbieMode) {
        showNewbieRewardPage();
        return;
    }

    const { elements } = state;

    // 清除现有卡片 - 优化版本
    const existingCards = elements.list.querySelectorAll('.card');
    if (existingCards.length > 0) {
        // 使用 requestAnimationFrame 优化移除动画
        requestAnimationFrame(() => {
            existingCards.forEach(card => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(-10px)';
                setTimeout(() => card.remove(), 200);
            });
        });
    }

    if (state.projects.length === 0) {
        elements.loading.innerHTML = '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.7);">暂无项目</div>';
        elements.loading.style.display = 'block';
        return;
    }

    // 使用 DocumentFragment 批量插入，提升性能
    const fragment = document.createDocumentFragment();
    const insertBefore = elements.moreBtn;

    state.projects.forEach((project, index) => {
        try {
            const card = createProjectCard(project);
            // 设置动画延迟
            card.style.animationDelay = `${0.1 + index * 0.05}s`;
            fragment.appendChild(card);
        } catch (err) {
            error('[Projects] 创建卡片失败:', err, project);
        }
    });

    // 批量插入DOM
    if (insertBefore) {
        elements.list.insertBefore(fragment, insertBefore);
    } else {
        elements.list.appendChild(fragment);
    }

    // 使用事件委托处理卡片点击
    setupCardEvents();

    log(`[Projects] 成功渲染 ${state.projects.length} 个项目卡片`);
    elements.loading.style.display = 'none';
}

// 设置卡片事件 - 使用事件委托优化性能
function setupCardEvents() {
    const { elements } = state;
    if (!elements.list) return;

    // 移除旧的事件监听器
    elements.list.removeEventListener('click', handleCardClick);

    // 添加新的事件监听器（事件委托）
    elements.list.addEventListener('click', handleCardClick);
}

// 卡片点击处理函数
function handleCardClick(e) {
    const target = e.target;

    // 处理按钮点击
    if (target.classList.contains('card-btn')) {
        const projectId = target.dataset.projectId;
        if (projectId) {
            window.location.href = `project-detail.html?id=${projectId}`;
        }
            return;
        }

    // 处理卡片点击（点击卡片任意位置跳转）
    const card = target.closest('.card');
    if (card && !target.closest('.card-btn')) {
        const btn = card.querySelector('.card-btn');
        if (btn && btn.dataset.projectId) {
            window.location.href = `project-detail.html?id=${btn.dataset.projectId}`;
        }
    }
}

function showToast(message) {
    const toast = document.createElement('div');

    setTimeout(() => {
        toast.classList.add('show');
    }, 10);

    setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => {
            document.body.removeChild(toast);

    }, 2000);

function createProjectCard(project) {
    const rate = parseFloat(project.rate || 0);
    const vipRate = parseFloat(project.vip_rate || 0);
    const totalRate = rate + vipRate;
    const day = parseInt(project.day || 0);
    const min = parseFloat(project.min || 0);
    const vipReq = parseInt(project.vip || 0);
    const isVipOnly = vipReq > 0;
    const status = parseInt(project.status || 1);
    const isEnded = status === 0 || status === 2;
    const isHot = project.is_hot == 1 || project.hot == 1;
    const isNew = project.is_new == 1 || project.new == 1;
    const isRecommend = project.is_recommend == 1 || project.recommend == 1;
    const investCount = parseInt(project.invest_count || project.buyer_count || 0);

    // 计算剩余金额和进度
    const total = parseFloat(project.total || project.total_amount || 0);
    const sold = parseFloat(project.sold || project.sold_amount || 0);
    const remain = Math.max(0, total - sold);
    const progress = total > 0 ? Math.min((sold / total) * 100, 100) : 0;

    // 币种
    const currency = (project.currency || 'CNY').toUpperCase();
    const hasUSDT = currency === 'USDT' || currency === 'BOTH';

    const card = document.createElement('article');
    card.className = 'card' + (isEnded ? ' ended' : '');
    card.dataset.projectId = project.id;
    card.onclick = () => {
        if (!isEnded) window.location.href = `project-detail.html?id=${project.id}`;
    };

    // 周期文本
    let cycleText = '灵活';
    if (day > 0) {
        if (day < 30) cycleText = `${day}天`;
        else if (day < 365) cycleText = `${Math.floor(day/30)}个月`;
        else cycleText = `${Math.floor(day/365)}年`;
    }

    // 收益率
    const rateText = totalRate > 0 ? totalRate.toFixed(2) : '—';

    // 顶部标签（热门/新品/推荐）
    let tagsHtml = '';
    const tags = [];
    if (isHot || totalRate > 0.2) tags.push('<span class="tag hot">🔥热门</span>');
    if (isNew) tags.push('<span class="tag new">✨新品</span>');
    if (isRecommend) tags.push('<span class="tag recommend">👍推荐</span>');
    if (tags.length > 0) {
        tagsHtml = `<div class="card-tags">${tags.join('')}</div>`;
    }

    // 右侧徽章
    let badgesHtml = '';

    // USDT徽章 - 只显示图标
    if (hasUSDT) {
        badgesHtml += `<img class="badge-logo" src="img/imagecms.png" alt="USDT" title="支持USDT">`;
    }

    // VIP限购徽章 - 只显示图标
    let detectedVipLevel = 0;
    const titleLower = (project.title || '').toLowerCase();
    if (isVipOnly && vipReq > 0) {
        detectedVipLevel = vipReq;
    } else if (titleLower.includes('vip')) {
        const vipMatch = titleLower.match(/vip(\d+)/);
        if (vipMatch) {
            detectedVipLevel = parseInt(vipMatch[1]);
        }
    }

    if (detectedVipLevel > 0) {
        badgesHtml += `<img class="badge-logo" src="img/vip${detectedVipLevel}-badge.svg" alt="VIP${detectedVipLevel}" title="VIP${detectedVipLevel}限购">`;
    }

    // VIP加息徽章
    if (vipRate > 0) {
        badgesHtml += `<span class="badge vip-bonus">+${vipRate.toFixed(2)}%加息</span>`;
    }

    // 底部信息
    let footerInfo = '';
    if (!isEnded) {
        // 起投金额
        const minText = min >= 10000 ? `${(min/10000).toFixed(0)}万` : min.toLocaleString();
        footerInfo += `<div class="info-item"><span class="icon">💰</span><span class="text">起投</span><span class="value">¥${minText}</span></div>`;

        // 已购人数
        if (investCount > 0) {
            footerInfo += `<div class="info-item"><span class="icon">👥</span><span class="value">${investCount}人已购</span></div>`;
        }

        // 剩余额度（进度条形式）
        if (total > 0) {
            const remainText = remain >= 10000 ? `${(remain/10000).toFixed(1)}万` : remain.toLocaleString();
            footerInfo += `<div class="info-item remain"><span class="icon">📊</span><span class="value">剩${progress.toFixed(0)}%</span></div>`;
        }
    }

    card.innerHTML = `
        ${tagsHtml}
        <div class="card-header" style="${tags.length > 0 ? 'padding-top: 28px;' : ''}">
            <h3 class="card-title"><span class="title-text">${project.title || '投资项目'}</span>${badgesHtml ? `<span class="title-badges">${badgesHtml}</span>` : ''}</h3>
        </div>
        <div class="card-body">
            <div class="card-metric main">
                <div class="metric-label">日收益率</div>
                <div class="metric-value">${rateText}<small>%</small></div>
            </div>
            <div class="card-metric">
                <div class="metric-label">投资周期</div>
                <div class="metric-value white">${cycleText}</div>
            </div>
        </div>
        <div class="card-footer">
            <div class="card-info">${footerInfo}</div>
            <div class="card-action" data-project-id="${project.id}">${isEnded ? '已结束' : '查看'}</div>
        </div>
    `;

    return card;
}

// 页面初始化 - 优化版本
(function() {
    const urlParams = new URLSearchParams(window.location.search);
    const isNewbieMode = urlParams.get('type') === 'newbie';

    log('[Init] URL参数检查:', { isNewbieMode, search: window.location.search });

    // 初始化函数
    function runInit() {
        // 初始化元素和筛选器
        initElements();
        initFilters();

        if (isNewbieMode) {
            log('[Init] 进入新人体验金模式');
            showNewbieRewardPage();
        } else {
            log('[Init] 进入正常项目列表模式');
    loadProjects();
        }
    }

    // 根据文档状态决定何时执行
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', runInit);
    } else {
        // DOM已经加载完成，使用 requestIdleCallback 优化初始化时机
        if ('requestIdleCallback' in window) {
            requestIdleCallback(runInit, { timeout: 1000 });
        } else {
            setTimeout(runInit, 0);
        }
    }

    // 页面可见性变化处理
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden && state.projects.length === 0 && !state.isLoading) {
            loadProjects();
        }
    });
})();
